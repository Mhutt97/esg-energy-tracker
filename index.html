/**
 * Calculates normalized energy (kWh), normalized water (m³), and GHG emissions (tCO2e)
 * using UK DEFRA conversion factors.
 */
function calculateInvoiceEsgMetrics(invoice) {
  const usage = Math.max(0, Number(invoice.usage ?? invoice.quantity) || 0);
  const category = invoice.category || 'electricity';

  if (category === 'electricity') {
    const unitObj =
      UTILITY_CATEGORIES.electricity.units.find((u) => u.id === invoice.unit) ||
      UTILITY_CATEGORIES.electricity.units[0];
    const normalizedEnergyKwh = usage * unitObj.toKwh;
    const factor = UTILITY_CATEGORIES.electricity.kgCo2ePerKwh;
    const co2eTonnes = (normalizedEnergyKwh * factor) / 1000;

    return {
      scope: 'Scope 2',
      normalizedEnergyKwh,
      normalizedWaterM3: 0,
      co2eTonnes,
      effectiveFactorLabel: `${factor.toFixed(3)} kgCO₂e/kWh (UK DEFRA)`,
    };
  }

  if (category === 'natural_gas') {
    const unitObj =
      UTILITY_CATEGORIES.natural_gas.units.find((u) => u.id === invoice.unit) ||
      UTILITY_CATEGORIES.natural_gas.units[0];
    const normalizedEnergyKwh = usage * unitObj.toKwh;

    let totalKgCo2e = 0;
    if (unitObj.kgCo2ePerUnitOverride) {
      totalKgCo2e = usage * unitObj.kgCo2ePerUnitOverride;
    } else {
      totalKgCo2e =
        normalizedEnergyKwh * UTILITY_CATEGORIES.natural_gas.kgCo2ePerKwh;
    }

    const co2eTonnes = totalKgCo2e / 1000;

    return {
      scope: 'Scope 1',
      normalizedEnergyKwh,
      normalizedWaterM3: 0,
      co2eTonnes,
      effectiveFactorLabel: `${UTILITY_CATEGORIES.natural_gas.kgCo2ePerKwh.toFixed(
        4
      )} kgCO₂e/kWh (UK DEFRA)`,
    };
  }

  const unitObj =
    UTILITY_CATEGORIES.water.units.find((u) => u.id === invoice.unit) ||
    UTILITY_CATEGORIES.water.units[0];
  const normalizedWaterM3 = usage * unitObj.toM3;
  const factorPerM3 = UTILITY_CATEGORIES.water.kgCo2ePerM3;
  const co2eTonnes = (normalizedWaterM3 * factorPerM3) / 1000;

  return {
    scope: 'Water',
    normalizedEnergyKwh: 0,
    normalizedWaterM3,
    co2eTonnes,
    effectiveFactorLabel: `${factorPerM3.toFixed(3)} kgCO₂e/m³ (UK DEFRA)`,
  };
}

/**
 * Comprehensive validation for utility invoice entry to prevent missing or erroneous data
 */
function validateInvoiceForm(
  form,
  existingInvoices = [],
  editingId = null
) {
  const errors = {};

  // 1. Invoice Number
  const invNum = String(form.invoiceNumber || '').trim();
  if (!invNum) {
    errors.invoiceNumber = 'Invoice reference number is required.';
  } else if (invNum.length < 3) {
    errors.invoiceNumber = 'Invoice number must be at least 3 characters.';
  } else {
    const isDuplicate = existingInvoices.some(
      (inv) =>
        inv.id !== editingId &&
        String(inv.invoiceNumber || '')
          .trim()
          .toLowerCase() === invNum.toLowerCase()
    );
    if (isDuplicate) {
      errors.invoiceNumber = `Invoice "${invNum}" already exists in the ledger.`;
    }
  }

  // 2. Supplier & Site Name
  if (!SUPPLIERS.includes(form.supplier)) {
    errors.supplier = 'Select a valid UK utilities provider.';
  }
  if (!SITES.includes(form.siteName)) {
    errors.siteName = 'Select a valid UK site location.';
  }

  // 3. Dates (Invoice Date, Billing Start, Billing End)
  if (!form.invoiceDate) {
    errors.invoiceDate = 'Invoice date is required.';
  }
  if (!form.billingPeriodStart) {
    errors.billingPeriodStart = 'Billing start date is required.';
  }
  if (!form.billingPeriodEnd) {
    errors.billingPeriodEnd = 'Billing end date is required.';
  }

  if (form.billingPeriodStart && form.billingPeriodEnd) {
    const start = new Date(form.billingPeriodStart);
    const end = new Date(form.billingPeriodEnd);
    if (isNaN(start.getTime()) || isNaN(end.getTime())) {
      errors.billingPeriodEnd = 'Invalid billing period dates.';
    } else if (end < start) {
      errors.billingPeriodEnd =
        'Billing end date cannot be earlier than the billing start date.';
    } else {
      const diffDays = (end - start) / (1000 * 60 * 60 * 24);
      if (diffDays > 370) {
        errors.billingPeriodEnd =
          'Billing period exceeds 12 months. Please verify start and end dates.';
      }
    }
  }

  if (form.invoiceDate && form.billingPeriodStart) {
    const invDate = new Date(form.invoiceDate);
    const start = new Date(form.billingPeriodStart);
    if (!isNaN(invDate.getTime()) && !isNaN(start.getTime())) {
      if (invDate < start) {
        errors.invoiceDate =
          'Invoice issue date cannot precede the billing period start date.';
      }
    }
  }

  // 4. Reading Type
  if (!READING_TYPES.includes(form.readingType)) {
    errors.readingType = 'Select Actual or Estimated reading type.';
  }

  // 5. Usage
  const usageStr = String(form.usage ?? '').trim();
  const usageVal = Number(usageStr);
  if (usageStr === '' || isNaN(usageVal)) {
    errors.usage = 'Metered usage value is required.';
  } else if (usageVal <= 0) {
    errors.usage = 'Usage must be greater than zero.';
  } else if (usageVal > 100000000) {
    errors.usage = 'Usage exceeds plausible single-invoice threshold.';
  }

  // 6. Net Cost & VAT
  const netStr = String(form.netCost ?? '').trim();
  const netVal = Number(netStr);
  if (netStr === '' || isNaN(netVal)) {
    errors.netCost = 'Net invoice amount (£) is required.';
  } else if (netVal <= 0) {
    errors.netCost = 'Net amount (£) must be greater than zero.';
  } else if (netVal > 10000000) {
    errors.netCost = 'Net amount (£) exceeds plausible invoice threshold.';
  }

  const vatRateNum = Number(form.vatRate);
  if (![20, 5, 0].includes(vatRateNum)) {
    errors.vatRate = 'VAT rate must be 20%, 5%, or 0%.';
  }

  return {
    isValid: Object.keys(errors).length === 0,
    errors,
  };
}

/**
 * UTF-8 safe Base64 helpers for GitHub Contents API
 */
function utf8ToBase64(str) {
  const bytes = new TextEncoder().encode(str);
  let binary = '';
  const chunkSize = 0x8000;
  for (let i = 0; i < bytes.length; i += chunkSize) {
    binary += String.fromCharCode.apply(
      null,
      bytes.subarray(i, i + chunkSize)
    );
  }
  return btoa(binary);
}

function base64ToUtf8(base64) {
  const clean = base64.replace(/\s/g, '');
  const binary = atob(clean);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) {
    bytes[i] = binary.charCodeAt(i);
  }
  return new TextDecoder().decode(bytes);
}

/**
 * GitHub API Integration — Pulls JSON file from repository
 */
async function pullFromGitHub(ghConfig) {
  const { owner, repo, branch = 'main', filePath, token } = ghConfig;
  if (!owner || !repo || !filePath || !token) {
    throw new Error(
      'Please provide GitHub Owner, Repository, File Path, and Personal Access Token.'
    );
  }

  const cleanPath = filePath.replace(/^\/+/, '');
  const url = `https://api.github.com/repos/${encodeURIComponent(
    owner.trim()
  )}/${encodeURIComponent(repo.trim())}/contents/${cleanPath}?ref=${encodeURIComponent(
    branch.trim()
  )}`;

  const res = await fetch(url, {
    headers: {
      Accept: 'application/vnd.github+json',
      Authorization: `Bearer ${token.trim()}`,
      'X-GitHub-Api-Version': '2022-11-28',
    },
  });

  if (res.status === 404) {
    throw new Error(
      `File "${cleanPath}" not found on branch "${branch}". Click "Commit & Push Invoices to GitHub" first to initialize it.`
    );
  }

  if (!res.ok) {
    const errBody = await res.json().catch(() => ({}));
    throw new Error(
      errBody.message || `GitHub API returned HTTP ${res.status}`
    );
  }

  const data = await res.json();
  const decodedContent = base64ToUtf8(data.content);
  const parsed = JSON.parse(decodedContent);

  return {
    invoices: Array.isArray(parsed.invoices) ? parsed.invoices : [],
    orgProfile: parsed.orgProfile || DEFAULT_ORG_PROFILE,
    sha: data.sha,
    htmlUrl: data.html_url,
  };
}

/**
 * GitHub API Integration — Commits JSON database (including PDF attachments) directly to repository
 */
async function pushToGitHub(ghConfig, payload) {
  const { owner, repo, branch = 'main', filePath, token } = ghConfig;
  if (!owner || !repo || !filePath || !token) {
    throw new Error(
      'Please provide GitHub Owner, Repository, File Path, and Personal Access Token.'
    );
  }

  const cleanPath = filePath.replace(/^\/+/, '');
  const baseUrl = `https://api.github.com/repos/${encodeURIComponent(
    owner.trim()
  )}/${encodeURIComponent(repo.trim())}/contents/${cleanPath}`;

  const headers = {
    Accept: 'application/vnd.github+json',
    Authorization: `Bearer ${token.trim()}`,
    'X-GitHub-Api-Version': '2022-11-28',
  };

  let existingSha = null;
  const getRes = await fetch(
    `${baseUrl}?ref=${encodeURIComponent(branch.trim())}`,
    { headers }
  );

  if (getRes.ok) {
    const existingData = await getRes.json();
    existingSha = existingData.sha;
  } else if (getRes.status !== 404) {
    const errBody = await getRes.json().catch(() => ({}));
    throw new Error(
      errBody.message || `Failed to inspect GitHub file (HTTP ${getRes.status})`
    );
  }

  const enrichedPayload = {
    schemaVersion: '2.1',
    updatedAt: new Date().toISOString(),
    orgProfile: payload.orgProfile,
    invoices: payload.invoices.map((inv) => ({
      ...inv,
      calculatedEsg: calculateInvoiceEsgMetrics(inv),
    })),
  };

  const jsonString = JSON.stringify(enrichedPayload, null, 2);
  const body = {
    message: `chore(esg): sync ${payload.invoices.length} utility invoices via UK Energy Ledger`,
    content: utf8ToBase64(jsonString),
    branch: branch.trim(),
  };

  if (existingSha) {
    body.sha = existingSha;
  }

  const putRes = await fetch(baseUrl, {
    method: 'PUT',
    headers: {
      ...headers,
      'Content-Type': 'application/json',
    },
    body: JSON.stringify(body),
  });

  if (!putRes.ok) {
    const errBody = await putRes.json().catch(() => ({}));
    throw new Error(
      errBody.message || `GitHub commit failed (HTTP ${putRes.status})`
    );
  }

  const result = await putRes.json();
  return {
    commitSha: result.commit?.sha,
    htmlUrl: result.content?.html_url,
  };
}

/**
 * Google Sheets Apps Script Webhook Integration — Pulls rows from Google Sheet
 */
async function pullFromGoogleSheets(gsConfig) {
  const { webAppUrl } = gsConfig;
  if (!webAppUrl || !webAppUrl.startsWith('https://')) {
    throw new Error(
      'Please enter a valid Google Apps Script Web App URL starting with https://'
    );
  }

  const res = await fetch(webAppUrl.trim(), {
    method: 'GET',
    redirect: 'follow',
  });

  if (!res.ok) {
    throw new Error(`Google Sheets Web App returned HTTP ${res.status}`);
  }

  const data = await res.json();
  if (data.error) {
    throw new Error(data.error);
  }

  return {
    invoices: Array.isArray(data.invoices) ? data.invoices : [],
    orgProfile: data.orgProfile || null,
  };
}

/**
 * Google Sheets Apps Script Webhook Integration — Pushes rows to Google Sheet
 */
async function pushToGoogleSheets(gsConfig, payload) {
  const { webAppUrl } = gsConfig;
  if (!webAppUrl || !webAppUrl.startsWith('https://')) {
    throw new Error(
      'Please enter a valid Google Apps Script Web App URL starting with https://'
    );
  }

  const enrichedInvoices = payload.invoices.map((inv) => {
    const metrics = calculateInvoiceEsgMetrics(inv);
    return {
      ...inv,
      scope: metrics.scope,
      normalizedEnergyKwh: Number(metrics.normalizedEnergyKwh.toFixed(2)),
      normalizedWaterM3: Number(metrics.normalizedWaterM3.toFixed(2)),
      co2eTonnes: Number(metrics.co2eTonnes.toFixed(4)),
      pdfFileName: inv.pdfAttachment?.name || '',
    };
  });

  const res = await fetch(webAppUrl.trim(), {
    method: 'POST',
    redirect: 'follow',
    headers: {
      'Content-Type': 'text/plain;charset=utf-8',
    },
    body: JSON.stringify({
      action: 'syncAll',
      updatedAt: new Date().toISOString(),
      orgProfile: payload.orgProfile,
      invoices: enrichedInvoices,
    }),
  });

  if (!res.ok) {
    throw new Error(`Google Sheets sync failed with HTTP ${res.status}`);
  }

  const result = await res.json();
  if (result.error) {
    throw new Error(result.error);
  }
  return result;
}

    'Notes',
  ];

  const escapeCsv = (val) => {
    if (val === null || val === undefined) return '';
    const str = String(val);
    if (str.includes(',') || str.includes('"') || str.includes('\n')) {
      return `"${str.replace(/"/g, '""')}"`;
    }
    return str;
  };

  const rows = invoices.map((inv) => {
    const metrics = calculateInvoiceEsgMetrics(inv);
    const catName = UTILITY_CATEGORIES[inv.category]?.name || inv.category;
    const usageVal = Number(inv.usage ?? inv.quantity) || 0;
    const netVal = Number(inv.netCost ?? inv.cost) || 0;
    const vatRateVal = Number(inv.vatRate ?? 20);
    const vatAmtVal =
      inv.vatAmount !== undefined
        ? Number(inv.vatAmount)
        : netVal * (vatRateVal / 100);
    const grossVal =
      inv.grossCost !== undefined ? Number(inv.grossCost) : netVal + vatAmtVal;

    return [
      inv.id,
      inv.invoiceNumber,
      inv.invoiceDate || '',
      inv.siteName || inv.facility || SITES[0],
      inv.supplier || SUPPLIERS[0],
      catName,
      metrics.scope,
      inv.billingPeriodStart,
      inv.billingPeriodEnd,
      usageVal,
      inv.unit,
      metrics.normalizedEnergyKwh.toFixed(2),
      metrics.normalizedWaterM3.toFixed(2),
      metrics.co2eTonnes.toFixed(4),
      netVal.toFixed(2),
      vatRateVal,
      vatAmtVal.toFixed(2),
      grossVal.toFixed(2),
      'GBP',
      inv.readingType || 'Actual',
      inv.pdfAttachment?.name || 'None',
      inv.notes || '',
    ]
      .map(escapeCsv)
      .join(',');
  });

  return [headers.join(','), ...rows].join('\n');
}

/**
 * Parses a CSV file string into UK invoice records
 */
function parseCsvToInvoices(csvText) {
  const lines = csvText
    .split(/\r?\n/)
    .map((l) => l.trim())
    .filter(Boolean);
  if (lines.length < 2) {
    throw new Error(
      'CSV file must include a header row and at least one data row.'
    );
  }

  const parseLine = (line) => {
    const result = [];
    let current = '';
    let inQuotes = false;
    for (let i = 0; i < line.length; i++) {
      const ch = line[i];
      if (ch === '"') {
        if (inQuotes && line[i + 1] === '"') {
          current += '"';
          i++;
        } else {
          inQuotes = !inQuotes;
        }
      } else if (ch === ',' && !inQuotes) {
        result.push(current.trim());
        current = '';
      } else {
        current += ch;
      }
    }
    result.push(current.trim());
    return result;
  };

  const headers = parseLine(lines[0]).map((h) => h.toLowerCase());
  const findCol = (candidates) =>
    headers.findIndex((h) => candidates.some((c) => h.includes(c)));

  const idxInvNum = findCol(['invoice number', 'invoice #', 'invoice_number']);
  const idxInvDate = findCol(['invoice date', 'issue date', 'date']);
  const idxSite = findCol(['site name', 'site', 'facility', 'location']);
  const idxSupplier = findCol(['supplier', 'provider', 'utility']);
  const idxCategory = findCol(['category', 'type', 'utility type']);
  const idxStart = findCol(['billing start', 'start date', 'period start']);
  const idxEnd = findCol(['billing end', 'end date', 'period end']);
  const idxUsage = findCol(['usage', 'quantity', 'consumption']);
  const idxUnit = findCol(['unit', 'uom']);
  const idxNet = findCol(['net cost', 'net', 'cost']);
  const idxVatRate = findCol(['vat rate', 'vat %']);
  const idxReading = findCol(['reading type', 'reading', 'status']);
  const idxNotes = findCol(['notes', 'comment']);

  const imported = [];
  for (let i = 1; i < lines.length; i++) {
    const cols = parseLine(lines[i]);
    if (cols.length < 3) continue;

    const rawCat = (idxCategory >= 0 ? cols[idxCategory] : '').toLowerCase();
    let category = 'electricity';
    if (
      rawCat.includes('gas') ||
      rawCat.includes('fuel') ||
      rawCat.includes('therm')
    ) {
      category = 'natural_gas';
    } else if (rawCat.includes('water')) {
      category = 'water';
    }

    const defaultUnit =
      category === 'electricity'
        ? 'kWh'
        : category === 'natural_gas'
        ? 'kWh'
        : 'm3';

    const netCost = Number(idxNet >= 0 ? cols[idxNet] : 0) || 0;
    const rawVat = idxVatRate >= 0 ? Number(cols[idxVatRate]) : 20;
    const vatRate = [20, 5, 0].includes(rawVat) ? rawVat : 20;
    const vatAmount = Number((netCost * (vatRate / 100)).toFixed(2));
    const grossCost = Number((netCost + vatAmount).toFixed(2));

    const rawReading = (idxReading >= 0 ? cols[idxReading] : '').toLowerCase();
    const readingType = rawReading.includes('est') ? 'Estimated' : 'Actual';

    const endDate = (idxEnd >= 0 && cols[idxEnd]) || '2026-01-31';

    imported.push({
      id: `inv-csv-${Date.now()}-${i}`,
      invoiceNumber: (idxInvNum >= 0 && cols[idxInvNum]) || `INV-${1000 + i}`,
      invoiceDate: (idxInvDate >= 0 && cols[idxInvDate]) || endDate,
      siteName: (idxSite >= 0 && cols[idxSite]) || SITES[0],
      supplier: (idxSupplier >= 0 && cols[idxSupplier]) || SUPPLIERS[0],
      category,
      billingPeriodStart: (idxStart >= 0 && cols[idxStart]) || '2026-01-01',
      billingPeriodEnd: endDate,
      usage: Number(idxUsage >= 0 ? cols[idxUsage] : 0) || 0,
      unit: (idxUnit >= 0 && cols[idxUnit]) || defaultUnit,
      netCost,
      vatRate,
      vatAmount,
      grossCost,
      currency: 'GBP',
      readingType,
      notes: (idxNotes >= 0 && cols[idxNotes]) || '',
      pdfAttachment: null,
    });
  }

  return imported;
}

/**
 * Smoothly interpolates numerical KPI values with cubic-out easing
 */
function AnimatedNumber({
  value = 0,
  decimals = 2,
  prefix = '',
  suffix = '',
  duration = 550,
  className = '',
}) {
  const target = Number(value) || 0;
  const [displayValue, setDisplayValue] = useState(target);
  const prevValueRef = useRef(target);

  useEffect(() => {
    const startVal = prevValueRef.current;
    const endVal = target;
    if (Math.abs(endVal - startVal) < 0.0001) {
      setDisplayValue(endVal);
      prevValueRef.current = endVal;
      return;
    }

    let rafId;
    const startTime = performance.now();

    const step = (now) => {
      const elapsed = now - startTime;
      const progress = Math.min(1, elapsed / duration);
      // Cubic ease-out: 1 - (1 - t)^3
      const eased = 1 - Math.pow(1 - progress, 3);
      const current = startVal + (endVal - startVal) * eased;
      setDisplayValue(current);

      if (progress < 1) {
        rafId = requestAnimationFrame(step);
      } else {
        setDisplayValue(endVal);
        prevValueRef.current = endVal;
      }
    };

    rafId = requestAnimationFrame(step);
    return () => {
      if (rafId) cancelAnimationFrame(rafId);
    };
  }, [target, duration]);

  const formatted = displayValue.toLocaleString('en-GB', {
    minimumFractionDigits: decimals,
    maximumFractionDigits: decimals,
  });

  return (
    <span className={`tabular-nums ${className}`}>
      {prefix}
      {formatted}
      {suffix}
    </span>
  );
}

/**
 * Staggered word-by-word editorial text reveal animation
 */
function RevealText({ text = '', className = '', delayMs = 0 }) {
  const words = String(text).split(' ');
  return (
    <span className={`inline-flex flex-wrap gap-x-[0.28em] ${className}`}>
      {words.map((word, idx) => (
        <span key={`${word}-${idx}`} className="overflow-hidden inline-block">
          <span
            className="inline-block animate-word-reveal"
            style={{
              animationDelay: `${delayMs + idx * 38}ms`,
              animationFillMode: 'both',
            }}
          >
            {word}
          </span>
        </span>
      ))}
    </span>
  );
}

const EMPTY_FORM = {
  invoiceNumber: '',
  invoiceDate: '2026-05-02',
  supplier: SUPPLIERS[0],
  siteName: SITES[0],
  category: 'electricity',
  billingPeriodStart: '2026-04-01',
  billingPeriodEnd: '2026-04-30',
  readingType: 'Actual',
  usage: '',
  unit: 'kWh',
  netCost: '',
  vatRate: 20,
  vatAmount: '0.00',
  grossCost: '0.00',
  currency: 'GBP',
  notes: '',
  pdfAttachment: null,
};

function InvoiceModal({
  isOpen,
  onClose,
  onSave,
  editingInvoice,
  existingInvoices = [],
}) {
  const [form, setForm] = useState(EMPTY_FORM);
  const [touched, setTouched] = useState({});
  const [submitAttempted, setSubmitAttempted] = useState(false);
  const [pdfError, setPdfError] = useState('');
  const pdfInputRef = useRef(null);

  useEffect(() => {
    setTouched({});
    setSubmitAttempted(false);
    setPdfError('');

    if (editingInvoice) {
      const net = Number(editingInvoice.netCost ?? editingInvoice.cost) || 0;
      const rate =
        editingInvoice.vatRate !== undefined
          ? Number(editingInvoice.vatRate)
          : 20;
      const vat =
        editingInvoice.vatAmount !== undefined
          ? Number(editingInvoice.vatAmount)
          : Number((net * (rate / 100)).toFixed(2));
      const gross =
        editingInvoice.grossCost !== undefined
          ? Number(editingInvoice.grossCost)
          : Number((net + vat).toFixed(2));

      setForm({
        ...EMPTY_FORM,
        ...editingInvoice,
        invoiceDate:
          editingInvoice.invoiceDate ||
          editingInvoice.billingPeriodEnd ||
          '2026-05-02',
        siteName: editingInvoice.siteName || editingInvoice.facility || SITES[0],
        supplier: SUPPLIERS.includes(editingInvoice.supplier)
          ? editingInvoice.supplier
          : SUPPLIERS[0],
        readingType: READING_TYPES.includes(editingInvoice.readingType)
          ? editingInvoice.readingType
          : 'Actual',
        usage: editingInvoice.usage ?? editingInvoice.quantity ?? '',
        netCost: net > 0 ? String(net) : '',
        vatRate: rate,
        vatAmount: vat.toFixed(2),
        grossCost: gross.toFixed(2),
        currency: 'GBP',
        pdfAttachment: editingInvoice.pdfAttachment || null,
      });
    } else {
      const todayIso = new Date().toISOString().slice(0, 10);
      setForm({
        ...EMPTY_FORM,
        invoiceDate: todayIso,
        invoiceNumber: `INV-${new Date().getFullYear()}-${String(
          Math.floor(1000 + Math.random() * 9000)
        )}`,
      });
    }
  }, [editingInvoice, isOpen]);

  const validation = useMemo(() => {
    return validateInvoiceForm(form, existingInvoices, editingInvoice?.id);
  }, [form, existingInvoices, editingInvoice]);

  const liveMetrics = useMemo(() => {
    return calculateInvoiceEsgMetrics(form);
  }, [form]);

  if (!isOpen) return null;

  const currentCat =
    UTILITY_CATEGORIES[form.category] || UTILITY_CATEGORIES.electricity;

  const markTouched = (field) => {
    setTouched((prev) => ({ ...prev, [field]: true }));
  };

  const showError = (field) =>
    (touched[field] || submitAttempted) && validation.errors[field];

  const handleCategoryChange = (newCategory) => {
    const catObj = UTILITY_CATEGORIES[newCategory];
    setForm((prev) => ({
      ...prev,
      category: newCategory,
      unit: catObj.units[0].id,
    }));
  };

  const handleNetOrVatChange = (newNetRaw, newVatRateRaw) => {
    const netNum = Math.max(0, Number(newNetRaw) || 0);
    const rateNum = Number(newVatRateRaw);
    const vatNum = netNum * (rateNum / 100);
    const grossNum = netNum + vatNum;

    setForm((prev) => ({
      ...prev,
      netCost: newNetRaw,
      vatRate: rateNum,
      vatAmount: vatNum.toFixed(2),
      grossCost: grossNum.toFixed(2),
    }));
  };

  const handlePdfUpload = (e) => {
    setPdfError('');
    const file = e.target.files?.[0];
    if (!file) return;

    const isPdf =
      file.type === 'application/pdf' ||
      file.name.toLowerCase().endsWith('.pdf');
    if (!isPdf) {
      setPdfError('Only PDF documents (.pdf) are permitted for invoice records.');
      if (pdfInputRef.current) pdfInputRef.current.value = '';
      return;
    }

    // 5 MB limit for database/JSON storage
    const maxBytes = 5 * 1024 * 1024;
    if (file.size > maxBytes) {
      setPdfError('PDF file size must be under 5.0 MB for database storage.');
      if (pdfInputRef.current) pdfInputRef.current.value = '';
      return;
    }

    const reader = new FileReader();
    reader.onload = (ev) => {
      const dataUrl = String(ev.target?.result || '');
      setForm((prev) => ({
        ...prev,
        pdfAttachment: {
          name: file.name,
          size: file.size,
          type: 'application/pdf',
          uploadedAt: new Date().toISOString(),
          dataUrl,
        },
      }));
    };
    reader.onerror = () => {
      setPdfError('Failed to read PDF file.');
    };
    reader.readAsDataURL(file);
  };

  const handlePreviewPdf = () => {
    if (!form.pdfAttachment?.dataUrl) return;
    const win = window.open();
    if (win) {
      win.document.write(
        `<iframe src="${form.pdfAttachment.dataUrl}" frameborder="0" style="border:0; top:0; left:0; bottom:0; right:0; width:100%; height:100%;" allowfullscreen></iframe>`
      );
    }
  };

  const handleSubmit = (e) => {
    e.preventDefault();
    setSubmitAttempted(true);

    if (!validation.isValid || pdfError) {
      return;
    }

    const netNum = Number(form.netCost) || 0;
    const rateNum = Number(form.vatRate);
    const vatNum = Number((netNum * (rateNum / 100)).toFixed(2));
    const grossNum = Number((netNum + vatNum).toFixed(2));

    onSave({
      ...form,
      id: editingInvoice?.id || `inv-${Date.now()}`,
      invoiceNumber: String(form.invoiceNumber).trim(),
      usage: Number(form.usage),
      netCost: netNum,
      vatRate: rateNum,
      vatAmount: vatNum,
      grossCost: grossNum,
      currency: 'GBP',
    });
  };

  const errorList = Object.values(validation.errors);

    <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/55 backdrop-blur-[2px] p-4 overflow-y-auto animate-fade-in">

              </span>
              <span className="text-slate-700">•</span>

                UK DEFRA Verified
              </span>
            </div>
            <h2 className="text-base font-semibold tracking-tight mt-0.5">
              {editingInvoice
                ? 'Amend Utility Invoice Record'
                : 'Log Utility Invoice'}
            </h2>
          </div>
          <button

            <X className="w-4 h-4" />

        <form

function InvoiceTable({
  invoices,
  onAddInvoice,
  onEditInvoice,
  onDuplicateInvoice,
  onDeleteInvoice,
  onBulkImport,
}) {
  const [searchQuery, setSearchQuery] = useState('');
  const [categoryFilter, setCategoryFilter] = useState('all');
  const [siteFilter, setSiteFilter] = useState('all');
  const [supplierFilter, setSupplierFilter] = useState('all');
  const [readingFilter, setReadingFilter] = useState('all');
  const [importError, setImportError] = useState('');
  const [viewingPdfInvoice, setViewingPdfInvoice] = useState(null);
  const fileInputRef = useRef(null);

  const filtered = useMemo(() => {
    return invoices
      .filter((inv) => {
        const invSite = inv.siteName || inv.facility || '';
        const invReading = inv.readingType || 'Actual';

        if (categoryFilter !== 'all' && inv.category !== categoryFilter) {
          return false;
        }
        if (siteFilter !== 'all' && invSite !== siteFilter) {
          return false;
        }
        if (supplierFilter !== 'all' && inv.supplier !== supplierFilter) {
          return false;
        }
        if (readingFilter !== 'all' && invReading !== readingFilter) {
          return false;
        }
        if (searchQuery.trim()) {
          const q = searchQuery.toLowerCase();
          const hay = [
            inv.invoiceNumber,
            inv.invoiceDate,
            inv.supplier,
            invSite,
            inv.notes,
            inv.pdfAttachment?.name,
          ]
            .filter(Boolean)
            .join(' ')
            .toLowerCase();
          if (!hay.includes(q)) return false;
        }
        return true;
      })
      .sort((a, b) =>
        (b.billingPeriodStart || '').localeCompare(a.billingPeriodStart || '')
      );
  }, [
    invoices,
    categoryFilter,
    siteFilter,
    supplierFilter,
    readingFilter,
    searchQuery,
  ]);

  const handleDownloadCsv = () => {
    const csvContent = exportInvoicesToCsv(filtered);
    const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `uk-esg-utility-invoices-${new Date()
      .toISOString()
      .slice(0, 10)}.csv`;
    a.click();
    URL.revokeObjectURL(url);
  };

  const handleDownloadTemplate = () => {
    const sampleTemplate = [
      'Invoice Number,Invoice Date,Site Name,Supplier,Category,Billing Start,Billing End,Usage,Unit,Net Cost,VAT Rate,Reading Type,Notes',
      'INV-2026-001,2026-02-03,Head Office London,Octopus,Electricity,2026-01-01,2026-01-31,14500,kWh,3190.00,20,Actual,January electricity bill',
      'INV-2026-002,2026-02-04,Office Sheffield,EDF,Natural Gas,2026-01-01,2026-01-31,4200,kWh,336.00,5,Actual,De minimis 5% VAT rate',

  const handleFileUpload = (e) => {
    setImportError('');
    const file = e.target.files?.[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = (event) => {
      try {
        const text = String(event.target?.result || '');
        const parsed = parseCsvToInvoices(text);
        if (parsed.length === 0) {
          setImportError('No valid invoice rows found in CSV.');
          return;
        }
        onBulkImport(parsed);

      }
    };
    reader.readAsText(file);
  };

      return <Flame className="w-3.5 h-3.5 text-amber-700 shrink-0" />;

function BackendConfigModal({
  isOpen,
  onClose,
  backendConfig,
  onSaveConfig,
  invoices,
  orgProfile,
  onRestoreRemoteData,
}) {
  const [config, setConfig] = useState(backendConfig);
  const [activeTab, setActiveTab] = useState(
    backendConfig.activeMode === 'gsheets' ? 'gsheets' : 'github'
  );
  const [loading, setLoading] = useState(false);
  const [statusMsg, setStatusMsg] = useState(null);
  const [copiedScript, setCopiedScript] = useState(false);

  if (!isOpen) return null;

  const updateGithub = (field, value) => {
    setConfig((prev) => ({
      ...prev,
      github: { ...prev.github, [field]: value },
    }));
  };

  const updateGsheets = (field, value) => {
    setConfig((prev) => ({
      ...prev,
      gsheets: { ...prev.gsheets, [field]: value },
    }));
  };

  const handlePersistConfig = (nextConfig) => {
    setConfig(nextConfig);
    onSaveConfig(nextConfig);
  };

  const handleGitHubPush = async () => {
    setLoading(true);
    setStatusMsg(null);
    try {
      const res = await pushToGitHub(config.github, { invoices, orgProfile });
      const updated = {
        ...config,
        activeMode: 'github',
        lastSyncedAt: new Date().toISOString(),
      };
      handlePersistConfig(updated);
      setStatusMsg({
        type: 'success',
        text: `Committed ${invoices.length} invoices to ${config.github.owner}/${config.github.repo} (${config.github.filePath}).`,
        url: res.htmlUrl,
      });
    } catch (err) {
      setStatusMsg({ type: 'error', text: err.message });
    } finally {
      setLoading(false);
    }
  };

  const handleGitHubPull = async () => {
    setLoading(true);
    setStatusMsg(null);
    try {
      const res = await pullFromGitHub(config.github);
      onRestoreRemoteData(res.invoices, res.orgProfile);
      const updated = {
        ...config,
        activeMode: 'github',
        lastSyncedAt: new Date().toISOString(),
      };
      handlePersistConfig(updated);
      setStatusMsg({
        type: 'success',
        text: `Loaded ${res.invoices.length} invoices from GitHub repository.`,
      });
    } catch (err) {
      setStatusMsg({ type: 'error', text: err.message });
    } finally {
      setLoading(false);
    }
  };

  const handleGoogleSheetsPush = async () => {
    setLoading(true);
    setStatusMsg(null);
    try {
      await pushToGoogleSheets(config.gsheets, { invoices, orgProfile });
      const updated = {
        ...config,
        activeMode: 'gsheets',
        lastSyncedAt: new Date().toISOString(),
      };
      handlePersistConfig(updated);
      setStatusMsg({
        type: 'success',
        text: `Synced ${invoices.length} invoices to Google Sheets ('ESG_Invoices' tab).`,
      });
    } catch (err) {
      setStatusMsg({ type: 'error', text: err.message });
    } finally {
      setLoading(false);
    }
  };

  const handleGoogleSheetsPull = async () => {
    setLoading(true);
    setStatusMsg(null);
    try {
      const res = await pullFromGoogleSheets(config.gsheets);
      onRestoreRemoteData(res.invoices, res.orgProfile);
      const updated = {
        ...config,
        activeMode: 'gsheets',
        lastSyncedAt: new Date().toISOString(),
      };
      handlePersistConfig(updated);
      setStatusMsg({
        type: 'success',
        text: `Pulled ${res.invoices.length} invoices from Google Sheets.`,
      });
    } catch (err) {
      setStatusMsg({ type: 'error', text: err.message });
    } finally {
      setLoading(false);
    }
  };

  const handleCopyAppsScript = () => {
    navigator.clipboard.writeText(GOOGLE_APPS_SCRIPT_SNIPPET);
    setCopiedScript(true);
    setTimeout(() => setCopiedScript(false), 2500);
  };

  const handleExportJson = () => {
    const json = JSON.stringify(
      {
        exportedAt: new Date().toISOString(),
        orgProfile,
        invoices,
      },
      null,
      2
    );
    const blob = new Blob([json], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `esg-invoices-backup-${new Date()
      .toISOString()
      .slice(0, 10)}.json`;
    a.click();
    URL.revokeObjectURL(url);
  };

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 backdrop-blur-xs p-4 overflow-y-auto">
      <div className="bg-white rounded-2xl border border-slate-200 shadow-2xl max-w-2xl w-full overflow-hidden my-8">
        {/* Header */}
        <div className="px-6 py-4 bg-slate-900 text-white flex items-center justify-between">
          <div>
            <h2 className="text-lg font-bold">
              Cloud Backend Integration (GitHub API & Google Sheets)
            </h2>
            <p className="text-xs text-slate-300">
              Serverless persistence designed for GitHub Pages static hosting
            </p>
          </div>
          <button
            type="button"
            onClick={onClose}
            className="text-slate-400 hover:text-white p-1.5 rounded-lg"
          >
            <X className="w-5 h-5" />
          </button>
        </div>

        {/* Provider Tabs */}
        <div className="border-b border-slate-200 bg-slate-50 px-6 pt-3 flex items-center gap-2">
          <button
            type="button"
            onClick={() => {
              setActiveTab('github');
              setStatusMsg(null);
            }}
            className={`inline-flex items-center gap-2 px-4 py-2.5 text-xs font-bold rounded-t-lg border-b-2 transition ${
              activeTab === 'github'
                ? 'border-emerald-600 text-slate-900 bg-white'
                : 'border-transparent text-slate-500 hover:text-slate-800'
            }`}
          >
            <Github className="w-4 h-4" />
            GitHub Repository API
          </button>

          <button
            type="button"
            onClick={() => {
              setActiveTab('gsheets');
              setStatusMsg(null);
            }}
            className={`inline-flex items-center gap-2 px-4 py-2.5 text-xs font-bold rounded-t-lg border-b-2 transition ${
              activeTab === 'gsheets'
                ? 'border-emerald-600 text-slate-900 bg-white'
                : 'border-transparent text-slate-500 hover:text-slate-800'
            }`}
          >
            <FileSpreadsheet className="w-4 h-4 text-emerald-600" />
            Google Sheets Webhook
          </button>

          <button
            type="button"
            onClick={() => {
              setActiveTab('local');
              setStatusMsg(null);
            }}
            className={`inline-flex items-center gap-2 px-4 py-2.5 text-xs font-bold rounded-t-lg border-b-2 transition ${
              activeTab === 'local'
                ? 'border-emerald-600 text-slate-900 bg-white'
                : 'border-transparent text-slate-500 hover:text-slate-800'
            }`}
          >
            <HardDrive className="w-4 h-4 text-slate-600" />
            JSON Backup & Auto-Sync
          </button>
        </div>

        <div className="p-6 space-y-5 max-h-[78vh] overflow-y-auto">
          {statusMsg && (
            <div
              className={`p-3.5 rounded-xl border text-xs flex items-start gap-2.5 ${

        </div>

        {/* Modal Footer */}
        <div className="px-6 py-3.5 bg-slate-50 border-t border-slate-200 flex items-center justify-between">
          <div className="text-xs text-slate-500">
            Active Backend:{' '}
            <strong className="text-slate-800 uppercase">
              {config.activeMode}
            </strong>
            {config.lastSyncedAt &&
              ` · Last Synced: ${new Date(
                config.lastSyncedAt
              ).toLocaleTimeString()}`}
          </div>
          <button
            type="button"
            onClick={() => {
              onSaveConfig(config);
              onClose();
            }}
            className="px-4 py-2 rounded-lg text-xs font-semibold bg-emerald-600 hover:bg-emerald-700 text-white"
          >
            Save Settings & Close
          </button>
        </div>
      </div>
    </div>
  );
}


// --- File: App.jsx ---

function App() {
  const initialState = useMemo(() => loadLocalState(), []);

  const [invoices, setInvoices] = useState(initialState.invoices);
  const [orgProfile, setOrgProfile] = useState(initialState.orgProfile);
  const [backendConfig, setBackendConfig] = useState(
    initialState.backendConfig
  );

  const [activeTab, setActiveTab] = useState('dashboard');
  const [selectedSite, setSelectedSite] = useState('All Sites');
  const [selectedYear, setSelectedYear] = useState('All Years');

  const [isInvoiceModalOpen, setIsInvoiceModalOpen] = useState(false);
  const [editingInvoice, setEditingInvoice] = useState(null);
  const [isBackendModalOpen, setIsBackendModalOpen] = useState(false);
  const [toast, setToast] = useState(null);

  useEffect(() => {
    saveLocalInvoices(invoices);
  }, [invoices]);

  useEffect(() => {
    saveLocalOrgProfile(orgProfile);
  }, [orgProfile]);

  useEffect(() => {
    saveBackendConfig(backendConfig);
  }, [backendConfig]);

  const showToast = (text, type = 'success') => {
    setToast({ text, type });
    setTimeout(() => setToast(null), 3500);
  };

  const triggerAutoSyncIfEnabled = async (nextInvoices, nextProfile) => {
    if (!backendConfig.autoSync) return;
    try {
      if (
        backendConfig.activeMode === 'github' &&
        backendConfig.github?.token
      ) {
        await pushToGitHub(backendConfig.github, {
          invoices: nextInvoices,
          orgProfile: nextProfile,
        });
        showToast('Auto-synced invoices to GitHub repository');
      } else if (
        backendConfig.activeMode === 'gsheets' &&
        backendConfig.gsheets?.webAppUrl
      ) {
        await pushToGoogleSheets(backendConfig.gsheets, {
          invoices: nextInvoices,
          orgProfile: nextProfile,
        });
        showToast('Auto-synced invoices to Google Sheets');
      }
    } catch (err) {
      showToast(`Cloud auto-sync failed: ${err.message}`, 'error');
    }
  };

  const handleSaveInvoice = (invoiceRecord) => {
    let nextInvoices;
    const exists = invoices.some((i) => i.id === invoiceRecord.id);
    if (exists) {
      nextInvoices = invoices.map((i) =>
        i.id === invoiceRecord.id ? invoiceRecord : i
      );
      showToast(`Amended invoice ${invoiceRecord.invoiceNumber}`);
    } else {
      nextInvoices = [invoiceRecord, ...invoices];
      showToast(`Committed invoice ${invoiceRecord.invoiceNumber} to ledger`);
    }
    setInvoices(nextInvoices);
    setIsInvoiceModalOpen(false);
    setEditingInvoice(null);
    triggerAutoSyncIfEnabled(nextInvoices, orgProfile);
  };

  const handleDeleteInvoice = (id) => {
    const target = invoices.find((i) => i.id === id);
    const nextInvoices = invoices.filter((i) => i.id !== id);
    setInvoices(nextInvoices);
    showToast(`Removed invoice ${target?.invoiceNumber || ''}`);
    triggerAutoSyncIfEnabled(nextInvoices, orgProfile);
  };

  const handleDuplicateInvoice = (inv) => {
    const copy = {
      ...inv,
      id: `inv-${Date.now()}`,
      invoiceNumber: `${inv.invoiceNumber}-COPY`,
    };
    setEditingInvoice(copy);
    setIsInvoiceModalOpen(true);
  };

  const handleBulkImport = (importedList) => {
    const nextInvoices = [...importedList, ...invoices];
    setInvoices(nextInvoices);
    showToast(`Imported ${importedList.length} utility invoices from CSV`);
    triggerAutoSyncIfEnabled(nextInvoices, orgProfile);
  };

  return (
    <div className="min-h-screen flex flex-col bg-[#F8F9FA] text-slate-900">
      {/* Top Institutional Navigation Bar */}
      <header className="bg-slate-950 text-white border-b border-slate-800 sticky top-0 z-30 no-print">
        <div className="max-w-7xl mx-auto px-4 sm:px-6 h-14 flex items-center justify-between gap-4">
          {/* Brand Identity */}
          <div className="flex items-center gap-3">
            <div className="w-7 h-7 rounded bg-white text-slate-950 flex items-center justify-center font-mono font-bold text-xs tracking-tighter">
              ESG
            </div>
            <div className="flex items-baseline gap-2.5">
              <span className="font-semibold text-sm tracking-tight text-white">
                UK Energy & Emissions Ledger
              </span>
              <span className="hidden sm:inline-block text-[10px] font-mono uppercase tracking-[0.14em] text-slate-400">
                DEFRA · GBP (£)
              </span>
            </div>
          </div>

          {/* Center Navigation Tabs */}
          <nav className="flex items-center gap-1">
            {[
              {
                id: 'dashboard',
                label: 'Overview',
                icon: LayoutDashboard,
              },
              {
                id: 'invoices',
                label: 'Utility Invoices',
                badge: invoices.length,
                icon: Receipt,
              },
            ].map((tab) => {
              const Icon = tab.icon;
              const active = activeTab === tab.id;
              return (
                <button
                  key={tab.id}
                  type="button"
                  onClick={() => setActiveTab(tab.id)}
                  className={`inline-flex items-center gap-2 px-3.5 py-1.5 rounded-lg text-xs font-medium transition-colors ${
                    active
                      ? 'bg-slate-800 text-white'
                      : 'text-slate-400 hover:text-white hover:bg-slate-900'
                  }`}
                >
                  <Icon className="w-3.5 h-3.5" />
                  <span>{tab.label}</span>
                  {tab.badge !== undefined && (
                    <span
                      className={`px-1.5 py-0.2 rounded text-[10px] font-mono ${
                        active
                          ? 'bg-slate-700 text-slate-200'
                          : 'bg-slate-900 text-slate-400'
                      }`}
                    >
                      {tab.badge}
                    </span>
                  )}
                </button>
              );
            })}
          </nav>

          {/* Right Cloud Sync & Quick Add Actions */}
          <div className="flex items-center gap-2">
            <button
              type="button"
              onClick={() => setIsBackendModalOpen(true)}
              className="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-medium bg-slate-900 hover:bg-slate-800 text-slate-300 border border-slate-800 transition-colors"
              title="Configure GitHub API or Google Sheets Sync"
            >
              {backendConfig.activeMode === 'github' ? (
                <Github className="w-3.5 h-3.5 text-teal-400" />
              ) : (
                <Cloud className="w-3.5 h-3.5 text-teal-400" />
              )}
              <span className="hidden sm:inline">
                {backendConfig.activeMode === 'github'
                  ? 'GitHub Sync'
                  : backendConfig.activeMode === 'gsheets'
                  ? 'Sheets Sync'
                  : 'Database Sync'}
              </span>
            </button>

            <button
              type="button"
              onClick={() => {
                setEditingInvoice(null);
                setIsInvoiceModalOpen(true);
              }}
              className="inline-flex items-center gap-1.5 px-3.5 py-1.5 rounded-lg text-xs font-semibold bg-white hover:bg-slate-100 text-slate-950 transition-colors"
            >
              <Plus className="w-3.5 h-3.5" />
              <span>Log Invoice</span>
            </button>
          </div>
        </div>
      </header>

      {/* Toast Notification */}
      {toast && (
        <div className="fixed bottom-5 right-5 z-50 no-print animate-fade-in">
          <div
            className={`px-4 py-2.5 rounded-lg shadow-xl border text-xs font-mono flex items-center gap-2 ${
              toast.type === 'error'
                ? 'bg-red-950 text-red-200 border-red-800'
                : 'bg-slate-950 text-teal-300 border-slate-800'
            }`}
          >
            <span>{toast.text}</span>
          </div>
        </div>
      )}

      {/* Main Content Container */}
      <main className="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 py-7">
        {activeTab === 'dashboard' && (
          <DashboardView
            invoices={invoices}
            orgProfile={orgProfile}
            selectedSite={selectedSite}
            onSelectSite={setSelectedSite}
            selectedYear={selectedYear}
            onSelectYear={setSelectedYear}
            onOpenNewInvoice={() => {
              setEditingInvoice(null);
              setIsInvoiceModalOpen(true);
            }}
            onSwitchTab={setActiveTab}
          />
        )}

        {activeTab === 'invoices' && (
          <InvoiceTable
            invoices={invoices}
            onAddInvoice={() => {
              setEditingInvoice(null);
              setIsInvoiceModalOpen(true);
            }}
            onEditInvoice={(inv) => {
              setEditingInvoice(inv);
              setIsInvoiceModalOpen(true);
            }}
            onDuplicateInvoice={handleDuplicateInvoice}
            onDeleteInvoice={handleDeleteInvoice}
            onBulkImport={handleBulkImport}
          />
        )}
      </main>

      {/* Footer */}
      <footer className="bg-white border-t border-slate-200/90 py-3.5 px-6 text-[11px] text-slate-400 font-mono no-print">
        <div className="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-3">
          <div>
            UK BUSINESS ENERGY & ESG LEDGER · HEAD OFFICE LONDON · SHEFFIELD ·
            LEEDS · BRISTOL
          </div>
          <div>CURRENCY: GBP (£) · DEFRA CONVERSION STANDARD</div>
        </div>
      </footer>

      {/* Modals */}
      <InvoiceModal
        isOpen={isInvoiceModalOpen}
        onClose={() => {
          setIsInvoiceModalOpen(false);
          setEditingInvoice(null);
        }}
        onSave={handleSaveInvoice}
        editingInvoice={editingInvoice}
        existingInvoices={invoices}
      />

      <BackendConfigModal
        isOpen={isBackendModalOpen}
        onClose={() => setIsBackendModalOpen(false)}
        backendConfig={backendConfig}
        onSaveConfig={setBackendConfig}
        invoices={invoices}
        orgProfile={orgProfile}
        onRestoreRemoteData={(remoteInvoices, remoteProfile) => {
          setInvoices(remoteInvoices);
          if (remoteProfile) {
            setOrgProfile((prev) => ({ ...prev, ...remoteProfile }));
          }
        }}
      />
    </div>
  );
}


ReactDOM.createRoot(document.getElementById('root')).render(<App />);

    </script>
  </body>
</html>
