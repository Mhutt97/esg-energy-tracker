/**
 * Strips currency symbols (£, $, €), commas, and whitespace to parse numbers reliably
 */
function parseCleanNumber(val, fallback = 0) {
  if (typeof val === 'number') {
    return Number.isFinite(val) ? val : fallback;
  }
  if (val === null || val === undefined) return fallback;
  const cleaned = String(val)
    .replace(/[£$€,\s]/g, '')
    .trim();
  if (!cleaned) return fallback;
  const num = Number(cleaned);
  return Number.isFinite(num) ? num : fallback;
}

/**
 * Normalizes UK (DD/MM/YYYY or DD-MM-YYYY) or ISO (YYYY-MM-DD) dates into strict YYYY-MM-DD
 */
function normalizeUkDateToIso(rawDate, fallback = '2026-01-01') {
  if (!rawDate) return fallback;
  const str = String(rawDate).trim();
  // Already YYYY-MM-DD
  if (/^\d{4}-\d{2}-\d{2}$/.test(str)) {
    return str;
  }
  // UK DD/MM/YYYY or DD-MM-YYYY
  const ukMatch = str.match(/^(\d{1,2})[/-](\d{1,2})[/-](\d{4})$/);
  if (ukMatch) {
    const day = ukMatch[1].padStart(2, '0');
    const month = ukMatch[2].padStart(2, '0');
    const year = ukMatch[3];
    return `${year}-${month}-${day}`;
  }
  const parsed = new Date(str);
  if (!isNaN(parsed.getTime())) {
    return parsed.toISOString().slice(0, 10);
  }
  return fallback;
}

/**
 * Matches free-text site names to canonical UK SITES
 */
function normalizeSiteName(rawSite) {
  if (!rawSite) return SITES[0];
  const s = String(rawSite).trim();
  if (SITES.includes(s)) return s;
  const lower = s.toLowerCase();
  if (lower.includes('sheffield')) return 'Office Sheffield';
  if (lower.includes('leeds')) return 'Office Leeds';
  if (lower.includes('bristol')) return 'Office Bristol';
  if (lower.includes('london') || lower.includes('head'))
    return 'Head Office London';
  return SITES[0];
}

/**
 * Matches free-text supplier names to canonical UK SUPPLIERS
 */
function normalizeSupplierName(rawSupplier) {
  if (!rawSupplier) return SUPPLIERS[0];
  const s = String(rawSupplier).trim();
  if (SUPPLIERS.includes(s)) return s;
  const lower = s.toLowerCase();
  if (lower.includes('octopus')) return 'Octopus';
  if (lower.includes('sse')) return 'SSE';
  if (lower.includes('eon') || lower.includes('e.on')) return 'EON';
  if (lower.includes('edf')) return 'EDF';
  return SUPPLIERS[0];
}

/**
 * Normalizes an entire invoice object to guarantee schema consistency across imports and versions
 */
function sanitizeInvoiceRecord(raw, idx = 0) {
  if (!raw || typeof raw !== 'object') return null;

  const rawCat = String(raw.category || 'electricity').toLowerCase();
  let category = 'electricity';
  if (
    rawCat.includes('gas') ||
    rawCat.includes('fuel') ||
    rawCat === 'natural_gas'
  ) {
    category = 'natural_gas';
  } else if (rawCat.includes('water')) {
    category = 'water';
  }

  const catUnits = UTILITY_CATEGORIES[category].units;
  const unit = catUnits.some((u) => u.id === raw.unit)
    ? raw.unit
    : catUnits[0].id;

  const usage = Math.max(0, parseCleanNumber(raw.usage ?? raw.quantity, 0));
  const netCost = Math.max(0, parseCleanNumber(raw.netCost ?? raw.cost, 0));
  const rawVatRate = parseCleanNumber(raw.vatRate, 20);
  const vatRate = [20, 5, 0].includes(rawVatRate) ? rawVatRate : 20;
  const vatAmount = Number((netCost * (vatRate / 100)).toFixed(2));
  const grossCost = Number((netCost + vatAmount).toFixed(2));

  const billingPeriodStart = normalizeUkDateToIso(
    raw.billingPeriodStart,
    '2026-01-01'
  );
  const billingPeriodEnd = normalizeUkDateToIso(
    raw.billingPeriodEnd,
    billingPeriodStart
  );
  const invoiceDate = normalizeUkDateToIso(raw.invoiceDate, billingPeriodEnd);

  const readingType =
    String(raw.readingType || raw.status || '')
      .toLowerCase()
      .includes('est')
      ? 'Estimated'
      : 'Actual';

  return {
    id: raw.id || `inv-${Date.now()}-${idx}`,
    invoiceNumber: String(raw.invoiceNumber || `INV-${1000 + idx}`).trim(),
    invoiceDate,
    siteName: normalizeSiteName(raw.siteName || raw.facility),
    supplier: normalizeSupplierName(raw.supplier),
    category,
    billingPeriodStart,
    billingPeriodEnd,
    readingType,
    usage,
    unit,
    netCost,
    vatRate,
    vatAmount,
    grossCost,
    currency: 'GBP',
    notes: String(raw.notes || '').trim(),
    pdfAttachment:
      raw.pdfAttachment && typeof raw.pdfAttachment === 'object'
        ? {
            name: String(raw.pdfAttachment.name || 'invoice.pdf'),
            size: Number(raw.pdfAttachment.size) || 0,
            type: 'application/pdf',
            uploadedAt:
              raw.pdfAttachment.uploadedAt || new Date().toISOString(),
            dataUrl: raw.pdfAttachment.dataUrl || null,
          }
        : null,
  };
}

/**
 * Calculates normalized energy (kWh), normalized water (m³), and GHG emissions (tCO2e)
 * using UK DEFRA conversion factors.
 */
function calculateInvoiceEsgMetrics(invoice) {
  const usage = Math.max(
    0,
    parseCleanNumber(invoice?.usage ?? invoice?.quantity, 0)
  );
  const category = invoice?.category || 'electricity';

  if (category === 'electricity') {
    const unitObj =
      UTILITY_CATEGORIES.electricity.units.find(
        (u) => u.id === invoice?.unit
      ) || UTILITY_CATEGORIES.electricity.units[0];
    const normalizedEnergyKwh = usage * unitObj.toKwh;
    const factor = UTILITY_CATEGORIES.electricity.kgCo2ePerKwh;
    const co2eTonnes = (normalizedEnergyKwh * factor) / 1000;

    return {
      scope: 'Scope 2',
      normalizedEnergyKwh,
      normalizedWaterM3: 0,
      co2eTonnes,
      effectiveFactorLabel: `${factor.toFixed(3)} kgCO₂e/kWh (UK DEFRA)`,
    };
  }

  if (category === 'natural_gas') {
    const unitObj =
      UTILITY_CATEGORIES.natural_gas.units.find(
        (u) => u.id === invoice?.unit
      ) || UTILITY_CATEGORIES.natural_gas.units[0];
    const normalizedEnergyKwh = usage * unitObj.toKwh;

    let totalKgCo2e = 0;
    if (unitObj.kgCo2ePerUnitOverride) {
      totalKgCo2e = usage * unitObj.kgCo2ePerUnitOverride;
    } else {
      totalKgCo2e =
        normalizedEnergyKwh * UTILITY_CATEGORIES.natural_gas.kgCo2ePerKwh;
    }

    const co2eTonnes = totalKgCo2e / 1000;

    return {
      scope: 'Scope 1',
      normalizedEnergyKwh,
      normalizedWaterM3: 0,
      co2eTonnes,
      effectiveFactorLabel: `${UTILITY_CATEGORIES.natural_gas.kgCo2ePerKwh.toFixed(
        4
      )} kgCO₂e/kWh (UK DEFRA)`,
    };
  }

  const unitObj =
    UTILITY_CATEGORIES.water.units.find((u) => u.id === invoice?.unit) ||
    UTILITY_CATEGORIES.water.units[0];
  const normalizedWaterM3 = usage * unitObj.toM3;
  const factorPerM3 = UTILITY_CATEGORIES.water.kgCo2ePerM3;
  const co2eTonnes = (normalizedWaterM3 * factorPerM3) / 1000;

  return {
    scope: 'Water',
    normalizedEnergyKwh: 0,
    normalizedWaterM3,
    co2eTonnes,
    effectiveFactorLabel: `${factorPerM3.toFixed(3)} kgCO₂e/m³ (UK DEFRA)`,
  };
}

/**
 * Comprehensive validation for utility invoice entry to prevent missing or erroneous data
 */
function validateInvoiceForm(
  form,
  existingInvoices = [],
  editingId = null
) {
  const errors = {};

  // 1. Invoice Number
  const invNum = String(form.invoiceNumber || '').trim();
  if (!invNum) {
    errors.invoiceNumber = 'Invoice reference number is required.';
  } else if (invNum.length < 3) {
    errors.invoiceNumber = 'Invoice number must be at least 3 characters.';
  } else {
    const isDuplicate = existingInvoices.some(
      (inv) =>
        inv.id !== editingId &&
        String(inv.invoiceNumber || '')
          .trim()
          .toLowerCase() === invNum.toLowerCase()
    );
    if (isDuplicate) {
      errors.invoiceNumber = `Invoice "${invNum}" already exists in the ledger.`;
    }
  }

  // 2. Supplier & Site Name
  if (!SUPPLIERS.includes(form.supplier)) {
    errors.supplier = 'Select a valid UK utilities provider.';
  }
  if (!SITES.includes(form.siteName)) {
    errors.siteName = 'Select a valid UK site location.';
  }

  // 3. Dates (Invoice Date, Billing Start, Billing End)
  if (!form.invoiceDate) {
    errors.invoiceDate = 'Invoice date is required.';
  }
  if (!form.billingPeriodStart) {
    errors.billingPeriodStart = 'Billing start date is required.';
  }
  if (!form.billingPeriodEnd) {
    errors.billingPeriodEnd = 'Billing end date is required.';
  }

  if (form.billingPeriodStart && form.billingPeriodEnd) {
    const start = new Date(form.billingPeriodStart);
    const end = new Date(form.billingPeriodEnd);
    if (isNaN(start.getTime()) || isNaN(end.getTime())) {
      errors.billingPeriodEnd = 'Invalid billing period dates.';
    } else if (end < start) {
      errors.billingPeriodEnd =
        'Billing end date cannot be earlier than the billing start date.';
    } else {
      const diffDays = (end - start) / (1000 * 60 * 60 * 24);
      if (diffDays > 370) {
        errors.billingPeriodEnd =
          'Billing period exceeds 12 months. Please verify start and end dates.';
      }
    }
  }

  if (form.invoiceDate && form.billingPeriodStart) {
    const invDate = new Date(form.invoiceDate);
    const start = new Date(form.billingPeriodStart);
    if (!isNaN(invDate.getTime()) && !isNaN(start.getTime())) {
      if (invDate < start) {
        errors.invoiceDate =
          'Invoice issue date cannot precede the billing period start date.';
      }
    }
  }

  // 4. Reading Type
  if (!READING_TYPES.includes(form.readingType)) {
    errors.readingType = 'Select Actual or Estimated reading type.';
  }

  // 5. Usage
  const usageStr = String(form.usage ?? '').trim();
  const usageVal = parseCleanNumber(usageStr, NaN);
  if (usageStr === '' || isNaN(usageVal)) {
    errors.usage = 'Metered usage value is required.';
  } else if (usageVal <= 0) {
    errors.usage = 'Usage must be greater than zero.';
  } else if (usageVal > 100000000) {
    errors.usage = 'Usage exceeds plausible single-invoice threshold.';
  }

  // 6. Net Cost & VAT
  const netStr = String(form.netCost ?? '').trim();
  const netVal = parseCleanNumber(netStr, NaN);
  if (netStr === '' || isNaN(netVal)) {
    errors.netCost = 'Net invoice amount (£) is required.';
  } else if (netVal <= 0) {
    errors.netCost = 'Net amount (£) must be greater than zero.';
  } else if (netVal > 10000000) {
    errors.netCost = 'Net amount (£) exceeds plausible invoice threshold.';
  }

  const vatRateNum = Number(form.vatRate);
  if (![20, 5, 0].includes(vatRateNum)) {
    errors.vatRate = 'VAT rate must be 20%, 5%, or 0%.';
  }

  return {
    isValid: Object.keys(errors).length === 0,
    errors,
  };
}

/**
 * IndexedDB helper for storing large invoice datasets + PDF attachments (>5 MB)
 */
function openLedgerIndexedDb() {
  return new Promise((resolve, reject) => {
    if (typeof indexedDB === 'undefined') {
      reject(new Error('IndexedDB is not supported in this environment.'));
      return;
    }
    const req = indexedDB.open(IDB_CONFIG.DB_NAME, IDB_CONFIG.DB_VERSION);
    req.onupgradeneeded = (event) => {
      const db = event.target.result;
      if (!db.objectStoreNames.contains(IDB_CONFIG.STORE_INVOICES)) {
        db.createObjectStore(IDB_CONFIG.STORE_INVOICES);
      }
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

async function saveInvoicesToIndexedDb(invoices) {
  try {
    const db = await openLedgerIndexedDb();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(IDB_CONFIG.STORE_INVOICES, 'readwrite');
      const store = tx.objectStore(IDB_CONFIG.STORE_INVOICES);
      store.put(invoices, 'all_invoices');
      tx.oncomplete = () => {
        db.close();
        resolve(true);
      };
      tx.onerror = () => {
        db.close();
        reject(tx.error);
      };
    });
  } catch (err) {
    console.warn('IndexedDB save fallback:', err);
    return false;
  }
}

async function loadInvoicesFromIndexedDb() {
  try {
    const db = await openLedgerIndexedDb();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(IDB_CONFIG.STORE_INVOICES, 'readonly');
      const store = tx.objectStore(IDB_CONFIG.STORE_INVOICES);
      const req = store.get('all_invoices');
      req.onsuccess = () => {
        db.close();
        if (Array.isArray(req.result)) {
          resolve(
            req.result
              .map((inv, idx) => sanitizeInvoiceRecord(inv, idx))
              .filter(Boolean)
          );
        } else {
          resolve(null);
        }
      };
      req.onerror = () => {
        db.close();
        reject(req.error);
      };
    });
  } catch (err) {
    console.warn('IndexedDB load fallback:', err);
    return null;
  }
}

/**
 * Converts a Base64 PDF Data URL into a native browser Blob URL
 */
function createPdfBlobUrl(dataUrl) {
  if (!dataUrl || typeof dataUrl !== 'string') return null;
  try {
    const parts = dataUrl.split(',');
    const base64 = parts.length > 1 ? parts[1] : parts[0];
    const clean = base64.replace(/\s/g, '');
    const binary = atob(clean);
    const bytes = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i++) {
      bytes[i] = binary.charCodeAt(i);
    }
    const blob = new Blob([bytes], { type: 'application/pdf' });
    return URL.createObjectURL(blob);
  } catch (err) {
    console.error('Failed to create PDF Blob URL:', err);
    return dataUrl;
  }
}

/**
 * Computes storage diagnostics for the Backend Configuration modal
 */
function getStorageDiagnostics(invoices = []) {
  const jsonBytes = new TextEncoder().encode(

  ).byteLength;
  const pdfCount = invoices.filter(
    (inv) => inv.pdfAttachment && inv.pdfAttachment.name
  ).length;
  const pdfBytes = invoices.reduce(

    0
  );
  return {
    invoiceCount: invoices.length,
    pdfCount,
    totalKb: (jsonBytes / 1024).toFixed(1),
    totalMb: (jsonBytes / (1024 * 1024)).toFixed(2),
    pdfKb: (pdfBytes / 1024).toFixed(1),
  };
}

/**
 * UTF-8 safe Base64 helpers for GitHub Contents & Blob APIs
 */
function utf8ToBase64(str) {
  const bytes = new TextEncoder().encode(str);
  let binary = '';
  const chunkSize = 0x8000;
  for (let i = 0; i < bytes.length; i += chunkSize) {
    binary += String.fromCharCode.apply(
      null,
      bytes.subarray(i, i + chunkSize)
    );
  }
  return btoa(binary);
}

function base64ToUtf8(base64) {
  const clean = String(base64 || '').replace(/\s/g, '');
  if (!clean) return '';
  const binary = atob(clean);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) {
    bytes[i] = binary.charCodeAt(i);
  }
  return new TextDecoder().decode(bytes);
}

function encodeGitHubFilePath(filePath) {
  return String(filePath || '')
    .replace(/^\/+/, '')
    .split('/')
    .filter(Boolean)
    .map((segment) => encodeURIComponent(segment))
    .join('/');
}

/**
 * Automatically fetches the shared `data/esg-invoices.json` database for ANY visitor
 * accessing the website (no token required to read from a public repository!).
 * First queries the live GitHub Contents API (instant updates), then falls back to `./data/esg-invoices.json`.
 */
async function fetchSharedRepositoryDatabase(ghConfig = {}) {
  const owner = (ghConfig.owner || 'Mhutt97').trim();
  const repo = (ghConfig.repo || 'esg-energy-tracker').trim();
  const branch = (ghConfig.branch || 'main').trim();
  const filePath = ghConfig.filePath || 'data/esg-invoices.json';
  const token = (ghConfig.token || '').trim();

  const cleanPath = encodeGitHubFilePath(filePath);
  const apiUrl = `https://api.github.com/repos/${encodeURIComponent(
    owner
  )}/${encodeURIComponent(repo)}/contents/${cleanPath}?ref=${encodeURIComponent(
    branch
  )}`;

  const headers = {
    Accept: 'application/vnd.github+json',
    'X-GitHub-Api-Version': '2022-11-28',
  };
  if (token) {
    headers.Authorization = `Bearer ${token}`;
  }

  let parsed = null;

  try {
    const res = await fetch(apiUrl, { cache: 'no-store', headers });
    if (res.ok) {
      const data = await res.json();
      let base64Content = data.content;

      if (!base64Content && data.sha) {
        const blobUrl = `https://api.github.com/repos/${encodeURIComponent(
          owner
        )}/${encodeURIComponent(repo)}/git/blobs/${encodeURIComponent(
          data.sha
        )}`;
        const blobRes = await fetch(blobUrl, { cache: 'no-store', headers });
        if (blobRes.ok) {
          const blobData = await blobRes.json();
          base64Content = blobData.content;
        }
      }

      if (base64Content) {
        parsed = JSON.parse(base64ToUtf8(base64Content) || '{}');
      }
    }
  } catch (apiErr) {
    console.warn('Public GitHub API read fallback:', apiErr);
  }

  // Fallback to relative static file on GitHub Pages if API rate-limited
  if (!parsed) {
    try {
      const staticRes = await fetch(
        `./data/esg-invoices.json?t=${Date.now()}`,
        { cache: 'no-store' }
      );
      if (staticRes.ok) {
        parsed = await staticRes.json();
      }
    } catch (staticErr) {
      console.warn('Static JSON fetch fallback:', staticErr);
    }
  }

  if (!parsed || typeof parsed !== 'object') {
    return null;
  }

  const sanitizedInvoices = Array.isArray(parsed.invoices)
    ? parsed.invoices
        .map((inv, idx) => sanitizeInvoiceRecord(inv, idx))
        .filter(Boolean)
    : [];

  return {
    invoices: sanitizedInvoices,
    orgProfile: parsed.orgProfile || DEFAULT_ORG_PROFILE,
    sharedGsheetsUrl: parsed.sharedGsheetsUrl || '',
    updatedAt: parsed.updatedAt || null,
  };
}

/**
 * Merges remote shared invoices with local invoices by ID / Invoice Number
 * so new visitors get all shared records while preserving any unsynced local additions.
 */
function mergeRemoteAndLocalInvoices(
  remoteInvoices = [],
  localInvoices = []
) {
  if (!remoteInvoices.length) return localInvoices;
  if (!localInvoices.length) return remoteInvoices;

  const mergedMap = new Map();
  // Seed with remote shared invoices first (authoritative shared state)
  remoteInvoices.forEach((inv) => {
    const key = String(inv.invoiceNumber || inv.id)
      .trim()
      .toLowerCase();
    mergedMap.set(key, inv);
  });

  // Preserve any local records that haven't been pushed yet, or enrich PDF dataUrl if local has it
  localInvoices.forEach((localInv) => {
    const key = String(localInv.invoiceNumber || localInv.id)
      .trim()
      .toLowerCase();
    if (!mergedMap.has(key)) {
      mergedMap.set(key, localInv);
    } else {
      const existing = mergedMap.get(key);
      if (!existing.pdfAttachment?.dataUrl && localInv.pdfAttachment?.dataUrl) {
        mergedMap.set(key, {
          ...existing,
          pdfAttachment: localInv.pdfAttachment,
        });
      }
    }
  });

  return Array.from(mergedMap.values());
}

/**
 * Cryptographically verifies via GitHub API that the provided PAT belongs to
 * the authorized repository owner (Mhutt97) with write/push permissions on
 * Mhutt97/esg-energy-tracker. Zero passwords or secrets are stored in code.
 */
async function verifyOwnerGitHubAccess(tokenInput) {
  const cleanToken = String(tokenInput || '').trim();
  if (!cleanToken) {
    throw new Error(
      'Please enter your GitHub Personal Access Token for Mhutt97/esg-energy-tracker to unlock Owner Edit Mode.'
    );
  }

  const headers = {
    Accept: 'application/vnd.github+json',
    Authorization: `Bearer ${cleanToken}`,
    'X-GitHub-Api-Version': '2022-11-28',
  };

  // 1. Verify authenticated user identity via GitHub API
  const userRes = await fetch('https://api.github.com/user', {
    cache: 'no-store',
    headers,
  });

  if (!userRes.ok) {
    throw new Error(
      'Invalid or expired GitHub Personal Access Token. Access remains locked in Read-Only mode.'
    );
  }

  const userData = await userRes.json();
  const login = String(userData.login || '').trim();

  if (login.toLowerCase() !== AUTHORIZED_GITHUB_OWNER.toLowerCase()) {
    throw new Error(
      `Access Denied: Authenticated as "${login}", but data input and edits are strictly locked to repository owner "${AUTHORIZED_GITHUB_OWNER}".`
    );
  }

  // 2. Verify repository write permission on Mhutt97/esg-energy-tracker
  const repoUrl = `https://api.github.com/repos/${encodeURIComponent(
    AUTHORIZED_GITHUB_OWNER
  )}/${encodeURIComponent(AUTHORIZED_GITHUB_REPO)}`;
  const repoRes = await fetch(repoUrl, {
    cache: 'no-store',
    headers,
  });

  if (!repoRes.ok) {
    throw new Error(
      `Could not verify repository permissions for ${AUTHORIZED_GITHUB_OWNER}/${AUTHORIZED_GITHUB_REPO}.`
    );
  }

  const repoData = await repoRes.json();
  const canPush = Boolean(
    repoData.permissions?.push || repoData.permissions?.admin
  );

  if (!canPush) {
    throw new Error(
      `Token belongs to ${AUTHORIZED_GITHUB_OWNER} but lacks "Contents: Read and Write" permission on ${AUTHORIZED_GITHUB_OWNER}/${AUTHORIZED_GITHUB_REPO}.`
    );
  }

  return {
    verified: true,
    ownerLogin: login,
    fullName: repoData.full_name,
  };
}

/**
 * GitHub API Integration — Pulls JSON file from repository (works with OR without token for public repos!)
 */
async function pullFromGitHub(ghConfig) {
  const { owner, repo, branch = 'main', filePath, token } = ghConfig;
  if (!owner || !repo || !filePath) {
    throw new Error('Please provide GitHub Owner, Repository, and File Path.');
  }

  const cleanPath = encodeGitHubFilePath(filePath);
  const url = `https://api.github.com/repos/${encodeURIComponent(
    owner.trim()
  )}/${encodeURIComponent(
    repo.trim()
  )}/contents/${cleanPath}?ref=${encodeURIComponent(branch.trim())}`;

  const headers = {
    Accept: 'application/vnd.github+json',
    'X-GitHub-Api-Version': '2022-11-28',
  };
  if (token && token.trim()) {
    headers.Authorization = `Bearer ${token.trim()}`;
  }

  const res = await fetch(url, {
    cache: 'no-store',
    headers,
  });

  if (res.status === 404) {
    throw new Error(
      `File "${filePath}" not found on branch "${branch}". Click "Commit & Push to GitHub" first to initialize it.`
    );
  }

  if (!res.ok) {
    const errBody = await res.json().catch(() => ({}));
    throw new Error(
      errBody.message || `GitHub API returned HTTP ${res.status}`
    );
  }

  const data = await res.json();
  let base64Content = data.content;

  if (!base64Content && data.sha) {
    const blobUrl = `https://api.github.com/repos/${encodeURIComponent(
      owner.trim()
    )}/${encodeURIComponent(repo.trim())}/git/blobs/${encodeURIComponent(
      data.sha
    )}`;
    const blobRes = await fetch(blobUrl, { cache: 'no-store', headers });
    if (!blobRes.ok) {
      throw new Error(
        `Failed to fetch large Git blob (HTTP ${blobRes.status})`
      );
    }
    const blobData = await blobRes.json();
    base64Content = blobData.content;
  }

  const decodedContent = base64ToUtf8(base64Content);
  const parsed = JSON.parse(decodedContent || '{}');
  const sanitizedInvoices = Array.isArray(parsed.invoices)
    ? parsed.invoices
        .map((inv, idx) => sanitizeInvoiceRecord(inv, idx))
        .filter(Boolean)
    : [];

  return {
    invoices: sanitizedInvoices,
    orgProfile: parsed.orgProfile || DEFAULT_ORG_PROFILE,
    sharedGsheetsUrl: parsed.sharedGsheetsUrl || '',
    sha: data.sha,
    htmlUrl: data.html_url,
  };
}

/**
 * GitHub API Integration — Commits JSON database directly to repository with automatic 409 Conflict retry
 */
async function pushToGitHub(ghConfig, payload, retryCount = 0) {
  const { owner, repo, branch = 'main', filePath, token } = ghConfig;
  if (!owner || !repo || !filePath || !token) {
    throw new Error(
      'To publish invoices to the shared GitHub repository so all website visitors can see them, please enter your GitHub Personal Access Token in Database Sync.'
    );
  }

  const cleanPath = encodeGitHubFilePath(filePath);
  const baseUrl = `https://api.github.com/repos/${encodeURIComponent(
    owner.trim()
  )}/${encodeURIComponent(repo.trim())}/contents/${cleanPath}`;

  const headers = {
    Accept: 'application/vnd.github+json',
    Authorization: `Bearer ${token.trim()}`,
    'X-GitHub-Api-Version': '2022-11-28',
  };

  let existingSha = null;
  const getRes = await fetch(
    `${baseUrl}?ref=${encodeURIComponent(branch.trim())}`,
    {
      cache: 'no-store',
      headers,
    }
  );

  if (getRes.ok) {
    const existingData = await getRes.json();
    existingSha = existingData.sha;
  } else if (getRes.status !== 404) {
    const errBody = await getRes.json().catch(() => ({}));
    throw new Error(
      errBody.message || `Failed to inspect GitHub file (HTTP ${getRes.status})`
    );
  }

  const enrichedPayload = {
    schemaVersion: '2.2',
    updatedAt: new Date().toISOString(),
    orgProfile: payload.orgProfile,
    sharedGsheetsUrl: payload.sharedGsheetsUrl || '',
    invoices: (payload.invoices || []).map((inv, idx) => {
      const cleanInv = sanitizeInvoiceRecord(inv, idx);
      return {
        ...cleanInv,
        calculatedEsg: calculateInvoiceEsgMetrics(cleanInv),
      };
    }),
  };

  const jsonString = JSON.stringify(enrichedPayload, null, 2);
  const body = {
    message: `chore(esg): sync ${enrichedPayload.invoices.length} utility invoices via UK Energy & ESG Intelligence`,
    content: utf8ToBase64(jsonString),
    branch: branch.trim(),
  };

  if (existingSha) {
    body.sha = existingSha;
  }

  const putRes = await fetch(baseUrl, {
    method: 'PUT',
    headers: {
      ...headers,
      'Content-Type': 'application/json',
    },
    body: JSON.stringify(body),
  });

  if (putRes.status === 409 && retryCount < 1) {
    return pushToGitHub(ghConfig, payload, retryCount + 1);
  }

  if (!putRes.ok) {
    const errBody = await putRes.json().catch(() => ({}));
    throw new Error(
      errBody.message || `GitHub commit failed (HTTP ${putRes.status})`
    );
  }

  const result = await putRes.json();
  return {
    commitSha: result.commit?.sha,
    htmlUrl: result.content?.html_url,
  };
}

/**
 * Google Sheets Apps Script Webhook Integration — Pushes rows to Google Sheet
 */
async function pushToGoogleSheets(gsConfig, payload) {
  const { webAppUrl } = gsConfig;
  if (!webAppUrl || !webAppUrl.startsWith('https://')) {
    throw new Error(
      'Please enter a valid Google Apps Script Web App URL starting with https://'
    );
  }

  const enrichedInvoices = (payload.invoices || []).map((inv, idx) => {
    const cleanInv = sanitizeInvoiceRecord(inv, idx);
    const metrics = calculateInvoiceEsgMetrics(cleanInv);
    return {
      ...cleanInv,
      pdfAttachment: cleanInv.pdfAttachment
        ? {
            name: cleanInv.pdfAttachment.name,
            size: cleanInv.pdfAttachment.size,
            type: 'application/pdf',
            uploadedAt: cleanInv.pdfAttachment.uploadedAt,
          }
        : null,
      scope: metrics.scope,
      normalizedEnergyKwh: Number(metrics.normalizedEnergyKwh.toFixed(2)),
      normalizedWaterM3: Number(metrics.normalizedWaterM3.toFixed(2)),
      co2eTonnes: Number(metrics.co2eTonnes.toFixed(4)),
      pdfFileName: cleanInv.pdfAttachment?.name || '',
    };
  });

  const res = await fetch(webAppUrl.trim(), {
    method: 'POST',
    redirect: 'follow',
    headers: {
      'Content-Type': 'text/plain;charset=utf-8',
    },
    body: JSON.stringify({
      action: 'syncAll',
      updatedAt: new Date().toISOString(),
      orgProfile: payload.orgProfile,
      invoices: enrichedInvoices,
    }),
  });

  if (!res.ok) {
    throw new Error(`Google Sheets sync failed with HTTP ${res.status}`);
  }

  const result = await res.json();
  if (result.error) {
    throw new Error(result.error);
  }
  return result;
}

function exportInvoicesToCsv(invoices) {
  const headers = [
    'Invoice ID',
    'Invoice Number',
    'Invoice Date',
    'Site Name',
    'Supplier',
    'Category',
    'ESG Scope',
    'Billing Start',
    'Billing End',
    'Usage',
    'Unit',
    'Normalized Energy (kWh)',
    'Normalized Water (m3)',
    'GHG Emissions (tCO2e)',
    'Net Cost (GBP)',
    'VAT Rate (%)',
    'VAT Amount (GBP)',
    'Gross Cost (GBP)',
    'Currency',
    'Reading Type',
    'PDF Document Attached',
    'Notes',
  ];

  const escapeCsv = (val) => {
    if (val === null || val === undefined) return '';
    const str = String(val);
    if (str.includes(',') || str.includes('"') || str.includes('\n')) {
      return `"${str.replace(/"/g, '""')}"`;
    }
    return str;
  };

  const rows = invoices.map((inv, idx) => {
    const cleanInv = sanitizeInvoiceRecord(inv, idx);
    const metrics = calculateInvoiceEsgMetrics(cleanInv);
    const catName =
      UTILITY_CATEGORIES[cleanInv.category]?.name || cleanInv.category;

    return [
      cleanInv.id,
      cleanInv.invoiceNumber,
      cleanInv.invoiceDate,
      cleanInv.siteName,
      cleanInv.supplier,
      catName,
      metrics.scope,
      cleanInv.billingPeriodStart,
      cleanInv.billingPeriodEnd,
      cleanInv.usage,
      cleanInv.unit,
      metrics.normalizedEnergyKwh.toFixed(2),
      metrics.normalizedWaterM3.toFixed(2),
      metrics.co2eTonnes.toFixed(4),
      cleanInv.netCost.toFixed(2),
      cleanInv.vatRate,
      cleanInv.vatAmount.toFixed(2),
      cleanInv.grossCost.toFixed(2),
      'GBP',
      cleanInv.readingType,
      cleanInv.pdfAttachment?.name || 'None',
      cleanInv.notes || '',
    ]
      .map(escapeCsv)
      .join(',');
  });

  return [headers.join(','), ...rows].join('\n');
}

function parseCsvToInvoices(csvText) {
  const lines = String(csvText || '')
    .split(/\r?\n/)
    .map((l) => l.trim())
    .filter(Boolean);
  if (lines.length < 2) {
    throw new Error(
      'CSV file must include a header row and at least one data row.'
    );
  }

  const parseLine = (line) => {
    const result = [];
    let current = '';
    let inQuotes = false;
    for (let i = 0; i < line.length; i++) {
      const ch = line[i];
      if (ch === '"') {
        if (inQuotes && line[i + 1] === '"') {
          current += '"';
          i++;
        } else {
          inQuotes = !inQuotes;
        }
      } else if (ch === ',' && !inQuotes) {
        result.push(current.trim());
        current = '';
      } else {
        current += ch;
      }
    }
    result.push(current.trim());
    return result;
  };

  const headers = parseLine(lines[0]).map((h) => h.toLowerCase().trim());

  const findCol = (candidates) => {
    for (const c of candidates) {
      const exactIdx = headers.findIndex((h) => h === c);
      if (exactIdx >= 0) return exactIdx;
    }
    for (const c of candidates) {
      const subIdx = headers.findIndex((h) => h.includes(c));
      if (subIdx >= 0) return subIdx;
    }
    return -1;
  };

  const idxInvNum = findCol([
    'invoice number',
    'invoice ref',
    'invoice #',
    'invoice_number',
  ]);
  const idxInvDate = findCol(['invoice date', 'issue date', 'tax date']);
  const idxSite = findCol(['site name', 'site', 'facility', 'location']);
  const idxSupplier = findCol([
    'supplier',
    'utilities provider',
    'provider',
    'utility',
  ]);
  const idxCategory = findCol(['category', 'stream', 'utility type', 'type']);
  const idxStart = findCol(['billing start', 'start date', 'period start']);
  const idxEnd = findCol(['billing end', 'end date', 'period end']);
  const idxUsage = findCol(['usage', 'quantity', 'consumption', 'billed usage']);
  const idxUnit = findCol(['unit', 'uom', 'unit of measure']);
  const idxNet = findCol(['net cost (gbp)', 'net cost', 'net (£)', 'net', 'cost']);
  const idxVatRate = findCol(['vat rate (%)', 'vat rate', 'vat %']);
  const idxReading = findCol(['reading type', 'reading', 'status']);
  const idxNotes = findCol(['notes', 'comment', 'audit notes']);

  const imported = [];
  for (let i = 1; i < lines.length; i++) {
    const cols = parseLine(lines[i]);
    if (cols.length < 3) continue;

    const rawCat = (idxCategory >= 0 ? cols[idxCategory] : '').toLowerCase();
    let category = 'electricity';
    if (
      rawCat.includes('gas') ||
      rawCat.includes('fuel') ||
      rawCat.includes('therm')
    ) {
      category = 'natural_gas';
    } else if (rawCat.includes('water')) {
      category = 'water';
    }

    const defaultUnit =
      category === 'electricity'
        ? 'kWh'
        : category === 'natural_gas'
        ? 'kWh'
        : 'm3';

    const netCost = parseCleanNumber(idxNet >= 0 ? cols[idxNet] : 0, 0);
    const rawVat =
      idxVatRate >= 0 ? parseCleanNumber(cols[idxVatRate], 20) : 20;
    const vatRate = [20, 5, 0].includes(rawVat) ? rawVat : 20;

    const startIso = normalizeUkDateToIso(
      idxStart >= 0 ? cols[idxStart] : '',
      '2026-01-01'
    );
    const endIso = normalizeUkDateToIso(
      idxEnd >= 0 ? cols[idxEnd] : '',
      startIso
    );
    const invDateIso = normalizeUkDateToIso(
      idxInvDate >= 0 ? cols[idxInvDate] : '',
      endIso
    );

    const record = sanitizeInvoiceRecord(
      {
        id: `inv-csv-${Date.now()}-${i}`,
        invoiceNumber:
          (idxInvNum >= 0 && cols[idxInvNum]) || `INV-${1000 + i}`,
        invoiceDate: invDateIso,
        siteName: idxSite >= 0 ? cols[idxSite] : SITES[0],
        supplier: idxSupplier >= 0 ? cols[idxSupplier] : SUPPLIERS[0],
        category,
        billingPeriodStart: startIso,
        billingPeriodEnd: endIso,
        usage: parseCleanNumber(idxUsage >= 0 ? cols[idxUsage] : 0, 0),
        unit: (idxUnit >= 0 && cols[idxUnit]) || defaultUnit,
        netCost,
        vatRate,
        readingType: idxReading >= 0 ? cols[idxReading] : 'Actual',
        notes: idxNotes >= 0 ? cols[idxNotes] : '',
      },
      i
    );

    if (record && record.usage > 0) {
      imported.push(record);
    }
  }

  return imported;
}

function parseJsonBackup(jsonText) {
  const parsed = JSON.parse(jsonText);
  const rawList = Array.isArray(parsed)
    ? parsed
    : Array.isArray(parsed.invoices)
    ? parsed.invoices
    : null;

  if (!rawList) {
    throw new Error(
      'Invalid JSON snapshot format: missing "invoices" array.'
    );
  }

  const sanitizedInvoices = rawList
    .map((inv, idx) => sanitizeInvoiceRecord(inv, idx))
    .filter(Boolean);

  return {
    invoices: sanitizedInvoices,
    orgProfile:
      parsed.orgProfile && typeof parsed.orgProfile === 'object'
        ? parsed.orgProfile
        : null,
  };
}

/**
 * Generates an XBRL / ESRS-tagged XML audit report for institutional ESG assurance
 */
function exportAuditXbrlReport(
  invoices = [],
  framework = 'CSRD',
  reportingYear = '2026',
  tenantName = 'UK Commercial Holdings Ltd'
) {
  let scope1Tonnes = 0;
  let scope2Tonnes = 0;
  let waterTonnes = 0;
  let totalEnergyKwh = 0;
  let totalWaterM3 = 0;
  let totalNetGbp = 0;
  let totalGrossGbp = 0;

  invoices.forEach((inv, idx) => {
    const clean = sanitizeInvoiceRecord(inv, idx);
    if (!clean) return;
    const m = calculateInvoiceEsgMetrics(clean);
    if (clean.category === 'electricity') {
      scope2Tonnes += m.co2eTonnes;
      totalEnergyKwh += m.normalizedEnergyKwh;
    } else if (clean.category === 'natural_gas') {
      scope1Tonnes += m.co2eTonnes;
      totalEnergyKwh += m.normalizedEnergyKwh;
    } else {
      waterTonnes += m.co2eTonnes;
      totalWaterM3 += m.normalizedWaterM3;
    }
    totalNetGbp += Number(clean.netCost) || 0;
    totalGrossGbp += Number(clean.grossCost) || 0;
  });

  const totalGhg = scope1Tonnes + scope2Tonnes + waterTonnes;
  const escapeXml = (s) =>
    String(s ?? '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');

  return `<?xml version="1.0" encoding="UTF-8"?>
<xbrl xmlns="http://www.xbrl.org/2003/instance"
      xmlns:esrs="http://xbrl.efrag.org/taxonomy/esrs/2026"
      xmlns:uksecr="http://xbrl.frc.org.uk/secr/2026"
      xmlns:iso4217="http://www.xbrl.org/2003/iso4217">
  <context id="CTX_${escapeXml(reportingYear)}">
    <entity>
      <identifier scheme="http://companieshouse.gov.uk">${escapeXml(
        tenantName
      )}</identifier>
    </entity>
    <period>
      <startDate>${escapeXml(
        reportingYear === 'All Years' ? '2026' : reportingYear
      )}-01-01</startDate>
      <endDate>${escapeXml(
        reportingYear === 'All Years' ? '2026' : reportingYear
      )}-12-31</endDate>
    </period>
  </context>
  <esrs:ReportingFramework contextRef="CTX_${escapeXml(
    reportingYear
  )}">${escapeXml(framework)}</esrs:ReportingFramework>
  <esrs:GrossScope1GHGEmissions contextRef="CTX_${escapeXml(
    reportingYear
  )}" unitRef="tCO2e" decimals="4">${scope1Tonnes.toFixed(
    4
  )}</esrs:GrossScope1GHGEmissions>
  <esrs:GrossLocationBasedScope2GHGEmissions contextRef="CTX_${escapeXml(
    reportingYear
  )}" unitRef="tCO2e" decimals="4">${scope2Tonnes.toFixed(
    4
  )}</esrs:GrossLocationBasedScope2GHGEmissions>
  <esrs:WaterSupplyAndTreatmentGHGEmissions contextRef="CTX_${escapeXml(
    reportingYear
  )}" unitRef="tCO2e" decimals="4">${waterTonnes.toFixed(
    4
  )}</esrs:WaterSupplyAndTreatmentGHGEmissions>
  <esrs:TotalGHGEmissions contextRef="CTX_${escapeXml(
    reportingYear
  )}" unitRef="tCO2e" decimals="4">${totalGhg.toFixed(
    4
  )}</esrs:TotalGHGEmissions>
  <esrs:TotalEnergyConsumptionMWh contextRef="CTX_${escapeXml(
    reportingYear
  )}" unitRef="MWh" decimals="3">${(totalEnergyKwh / 1000).toFixed(
    3
  )}</esrs:TotalEnergyConsumptionMWh>
  <esrs:TotalWaterConsumptionM3 contextRef="CTX_${escapeXml(
    reportingYear
  )}" unitRef="m3" decimals="2">${totalWaterM3.toFixed(
    2
  )}</esrs:TotalWaterConsumptionM3>
  <uksecr:TotalUtilityNetExpenditureGBP contextRef="CTX_${escapeXml(
    reportingYear
  )}" unitRef="iso4217:GBP" decimals="2">${totalNetGbp.toFixed(
    2
  )}</uksecr:TotalUtilityNetExpenditureGBP>
  <uksecr:TotalUtilityGrossExpenditureGBP contextRef="CTX_${escapeXml(
    reportingYear
  )}" unitRef="iso4217:GBP" decimals="2">${totalGrossGbp.toFixed(
    2
  )}</uksecr:TotalUtilityGrossExpenditureGBP>
  <uksecr:VerifiedInvoiceRecordCount contextRef="CTX_${escapeXml(
    reportingYear
  )}" decimals="0">${invoices.length}</uksecr:VerifiedInvoiceRecordCount>
</xbrl>`;
}

/**
 * High-precision tabular monospace formatter for B2B numerical telemetry
 */
function AnimatedNumber({
  value = 0,
  decimals = 2,
  prefix = '',
  suffix = '',
  className = '',
}) {
  const num = Number(value) || 0;
  const formatted = num.toLocaleString('en-GB', {
    minimumFractionDigits: decimals,
    maximumFractionDigits: decimals,
  });

  return (
    <span className={`font-mono-num tabular-nums ${className}`}>
      {prefix}
      {formatted}
      {suffix}
    </span>
  );
}

}

// --- File: InvoiceTable.jsx ---
function InvoiceTable({
  invoices,
  onAddInvoice,
  onEditInvoice,
  onDuplicateInvoice,
  onDeleteInvoice,
  onBulkImport,
  isOwnerUnlocked = false,
  onRequestOwnerUnlock,
  selectedFramework = REPORTING_FRAMEWORKS.CSRD,
}) {
  const [searchQuery, setSearchQuery] = useState('');
  const [categoryFilter, setCategoryFilter] = useState('all');
  const [siteFilter, setSiteFilter] = useState('all');
  const [supplierFilter, setSupplierFilter] = useState('all');
  const [readingFilter, setReadingFilter] = useState('all');
  const [importError, setImportError] = useState('');
  const [viewingPdfInvoice, setViewingPdfInvoice] = useState(null);
  const [activePdfBlobUrl, setActivePdfBlobUrl] = useState(null);
  const fileInputRef = useRef(null);

  useEffect(() => {
    if (!viewingPdfInvoice?.pdfAttachment?.dataUrl) {
      setActivePdfBlobUrl(null);
      return;
    }
    const url = createPdfBlobUrl(viewingPdfInvoice.pdfAttachment.dataUrl);
    setActivePdfBlobUrl(url);
    return () => {
      if (url && url.startsWith('blob:')) {
        URL.revokeObjectURL(url);
      }
    };
  }, [viewingPdfInvoice]);

  const filtered = useMemo(() => {
    return invoices
      .filter((inv) => {
        const invSite = inv.siteName || inv.facility || '';
        const invReading = inv.readingType || 'Actual';

        if (categoryFilter !== 'all' && inv.category !== categoryFilter) {
          return false;
        }
        if (siteFilter !== 'all' && invSite !== siteFilter) {
          return false;
        }
        if (supplierFilter !== 'all' && inv.supplier !== supplierFilter) {
          return false;
        }
        if (readingFilter !== 'all' && invReading !== readingFilter) {
          return false;
        }
        if (searchQuery.trim()) {
          const q = searchQuery.toLowerCase();
          const hay = [
            inv.invoiceNumber,
            inv.invoiceDate,
            inv.supplier,
            invSite,
            inv.notes,
            inv.pdfAttachment?.name,
          ]
            .filter(Boolean)
            .join(' ')
            .toLowerCase();
          if (!hay.includes(q)) return false;
        }
        return true;
      })
      .sort((a, b) =>
        (b.billingPeriodStart || '').localeCompare(a.billingPeriodStart || '')
      );
  }, [
    invoices,
    categoryFilter,
    siteFilter,
    supplierFilter,
    readingFilter,
    searchQuery,
  ]);

  const handleDownloadCsv = () => {
    const csvContent = exportInvoicesToCsv(filtered);
    const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `uk-esg-utility-invoices-${new Date()
      .toISOString()
      .slice(0, 10)}.csv`;
    a.click();
    URL.revokeObjectURL(url);
  };

  const handleDownloadTemplate = () => {
    const sampleTemplate = [
      'Invoice Number,Invoice Date,Site Name,Supplier,Category,Billing Start,Billing End,Usage,Unit,Net Cost,VAT Rate,Reading Type,Notes',
      'INV-2026-001,2026-02-03,Head Office London,Octopus,Electricity,2026-01-01,2026-01-31,14500,kWh,3190.00,20,Actual,January electricity bill',
      'INV-2026-002,2026-02-04,Office Sheffield,EDF,Natural Gas,2026-01-01,2026-01-31,4200,kWh,336.00,5,Actual,De minimis 5% VAT rate',
      'INV-2026-003,2026-02-05,Office Leeds,EON,Electricity,2026-01-01,2026-01-31,8900,kWh,1958.00,20,Estimated,Estimated meter reading',
    ].join('\n');

    const blob = new Blob([sampleTemplate], {
      type: 'text/csv;charset=utf-8;',
    });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'uk-esg-invoice-import-template.csv';
    a.click();
    URL.revokeObjectURL(url);
  };

  const handleFileUpload = (e) => {
    setImportError('');
    const file = e.target.files?.[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = (event) => {
      try {
        const text = String(event.target?.result || '');
        const parsed = parseCsvToInvoices(text);
        if (parsed.length === 0) {
          setImportError('No valid invoice rows found in CSV.');
          return;
        }
        onBulkImport(parsed);
      } catch (err) {
        setImportError(err.message || 'Failed to parse CSV file.');
      } finally {
        if (fileInputRef.current) fileInputRef.current.value = '';
      }
    };
    reader.readAsText(file);
  };

  const getCategoryIcon = (cat) => {
    if (cat === 'electricity')
      return <Zap className="w-3 h-3 text-emerald-600 shrink-0" />;
    if (cat === 'natural_gas')
      return <Flame className="w-3 h-3 text-teal-600 shrink-0" />;
    return <Droplets className="w-3 h-3 text-blue-600 shrink-0" />;
  };

  return (
    <div className="space-y-3">
      {/* Compact Header & Controls Bar */}
      <div className="b2b-panel rounded p-3 flex flex-wrap items-center justify-between gap-2">

          <div className="flex items-center gap-2">
            <h2 className="text-sm font-semibold text-slate-900">

            </h2>

            </span>
            <span className="px-1.5 py-0.5 rounded bg-indigo-50 border border-indigo-200 font-mono-num text-[10px] font-semibold text-indigo-700">

          <p className="text-xs text-slate-500 mt-0.5">

            (£) VAT breakdown, and embedded PDF documentation.
          </p>
        </div>

        {/* Action Buttons + Disabled Excel Testing Notice */}
        <div className="flex flex-wrap items-center gap-1.5">
          <div className="hidden lg:inline-flex items-center gap-1.5 px-2.5 py-1 rounded bg-slate-50 border border-slate-200 text-[11px] text-slate-400 select-none">
            <Lock className="w-3 h-3 text-amber-500" />
            <span>Upload Legacy Excel (.xlsx)</span>
            <span className="px-1 py-0.5 rounded bg-amber-50 text-amber-700 border border-amber-200 font-mono-num text-[9px] uppercase">
              Testing
            </span>
          </div>

          {isOwnerUnlocked && (
            <>
              <input
                ref={fileInputRef}
                type="file"
                accept=".csv"
                onChange={handleFileUpload}
                className="hidden"
              />
              <button

                onClick={handleDownloadTemplate}
                className="inline-flex items-center gap-1 px-2.5 py-1.5 text-xs font-medium text-slate-700 bg-slate-100 hover:bg-slate-200 rounded border border-slate-200"
              >
                <FileDown className="w-3.5 h-3.5" />
                Template
              </button>
              <button

/**
 * Compact 12-point SVG Sparkline for KPI cards
 */
function MiniSparkline({ values = [], color = '#059669' }) {
  const max = Math.max(1, ...values);
  const pts = values
    .map((v, idx) => {
      const x = (idx / Math.max(1, values.length - 1)) * 72;
      const y = 20 - (v / max) * 16;
      return `${x.toFixed(1)},${y.toFixed(1)}`;
    })
    .join(' ');

  return (
    <svg width="72" height="22" className="overflow-visible shrink-0">
      <polyline
        fill="none"
        stroke={color}
        strokeWidth="1.5"
        points={pts}
      />
    </svg>
  );
}

function DashboardView({

      const matchUtility =

      supBucket.totalCo2e += m.co2eTonnes;

      if (inv.category === 'electricity') {
        supBucket.electricityKwh += m.normalizedEnergyKwh;
      } else if (inv.category === 'natural_gas') {
        supBucket.gasKwh += m.normalizedEnergyKwh;
      } else {
        supBucket.waterM3 += m.normalizedWaterM3;
      }
    });

    const totalEnergyKwh = electricityKwh + fuelKwhEq;

                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  );
}

function BackendConfigModal({
  isOpen,
  onClose,
  backendConfig,
  onSaveConfig,
  invoices,
  orgProfile,
  onRestoreRemoteData,
  isOwnerUnlocked = false,
  verifiedOwnerLogin = null,
  onOwnerVerified,
  onLockOwnerSession,
}) {
  const [config, setConfig] = useState(backendConfig);
  const [activeTab, setActiveTab] = useState(
    backendConfig.activeMode === 'gsheets' ? 'gsheets' : 'github'
  );
  const [loading, setLoading] = useState(false);
  const [statusMsg, setStatusMsg] = useState(null);
  const [copiedScript, setCopiedScript] = useState(false);
  const jsonInputRef = useRef(null);

  useEffect(() => {
    if (isOpen) {
      setConfig(backendConfig);
      setStatusMsg(null);
    }
  }, [isOpen, backendConfig]);

  const diagnostics = useMemo(
    () => getStorageDiagnostics(invoices),
    [invoices]
  );

  if (!isOpen) return null;

  const updateGithub = (field, value) => {
    setConfig((prev) => ({
      ...prev,
      github: { ...prev.github, [field]: value },
    }));
  };

  const updateGsheets = (field, value) => {
    setConfig((prev) => ({
      ...prev,
      gsheets: { ...prev.gsheets, [field]: value },
    }));
  };

  const handlePersistConfig = (nextConfig) => {
    setConfig(nextConfig);
    onSaveConfig(nextConfig);
  };

  const handleVerifyOwner = async () => {
    setLoading(true);
    setStatusMsg(null);
    try {
      const verification = await verifyOwnerGitHubAccess(config.github.token);
      const updated = {
        ...config,
        github: {
          ...config.github,
          owner: AUTHORIZED_GITHUB_OWNER,
          repo: AUTHORIZED_GITHUB_REPO,
        },
      };
      handlePersistConfig(updated);
      if (onOwnerVerified) {
        onOwnerVerified(config.github.token, verification.ownerLogin);
      }
      setStatusMsg({
        type: 'success',
        text: `Owner Authenticated (${verification.ownerLogin}) on ${verification.fullName}. Data input, invoice editing, and cloud commits are now unlocked for this browser!`,
      });
    } catch (err) {
      setStatusMsg({ type: 'error', text: err.message });
    } finally {
      setLoading(false);
    }
  };

  const handleGitHubPush = async () => {
    setLoading(true);
    setStatusMsg(null);
    try {
      const verification = await verifyOwnerGitHubAccess(config.github.token);
      if (onOwnerVerified) {
        onOwnerVerified(config.github.token, verification.ownerLogin);
      }
      const res = await pushToGitHub(
        {
          ...config.github,
          owner: AUTHORIZED_GITHUB_OWNER,
          repo: AUTHORIZED_GITHUB_REPO,
        },
        {
          invoices,
          orgProfile,
          sharedGsheetsUrl: config.gsheets?.webAppUrl || '',
        }
      );
      const updated = {
        ...config,
        activeMode: 'github',
        lastSyncedAt: new Date().toISOString(),
        github: {
          ...config.github,
          owner: AUTHORIZED_GITHUB_OWNER,
          repo: AUTHORIZED_GITHUB_REPO,
        },
      };
      handlePersistConfig(updated);
      setStatusMsg({
        type: 'success',
        text: `Published ${invoices.length} invoices (${diagnostics.pdfCount} PDFs) to ${AUTHORIZED_GITHUB_OWNER}/${AUTHORIZED_GITHUB_REPO} (${config.github.filePath}). All website visitors can view this data in Read-Only mode!`,
        url: res.htmlUrl,
      });
    } catch (err) {
      setStatusMsg({ type: 'error', text: err.message });
    } finally {
      setLoading(false);
    }
  };

  const handleGitHubPull = async () => {
    setLoading(true);
    setStatusMsg(null);
    try {
      const res = await pullFromGitHub(config.github);
      onRestoreRemoteData(res.invoices, res.orgProfile);
      const updated = {
        ...config,
        activeMode: 'github',
        lastSyncedAt: new Date().toISOString(),
      };
      handlePersistConfig(updated);
      setStatusMsg({
        type: 'success',
        text: `Loaded ${res.invoices.length} sanitized invoices from GitHub repository.`,

      setStatusMsg({ type: 'error', text: err.message });
    } finally {
      setLoading(false);
    }
  };

  const handleGoogleSheetsPush = async () => {

        type: 'error',
        text: `Access Denied: Please authenticate as ${AUTHORIZED_GITHUB_OWNER} on the GitHub Repository API tab before syncing to Google Sheets.`,
      });

    }
    setLoading(true);

                config.lastSyncedAt
              ).toLocaleTimeString()}`}

          <button
            type="button"
            onClick={() => {

              onClose();

function App() {
  const initialState = useMemo(() => loadLocalState(), []);

  const [invoices, setInvoices] = useState(initialState.invoices);
  const [orgProfile, setOrgProfile] = useState(initialState.orgProfile);
  const [backendConfig, setBackendConfig] = useState(
    initialState.backendConfig
  );
  const [isOwnerUnlocked, setIsOwnerUnlocked] = useState(false);
  const [verifiedOwnerLogin, setVerifiedOwnerLogin] = useState(null);
  const [hasUnsyncedLocal, setHasUnsyncedLocal] = useState(false);

  // Enterprise Layout & Contextual Command Bar State
  const [sidebarCollapsed, setSidebarCollapsed] = useState(false);
  const [activeTab, setActiveTab] = useState('dashboard');
  const [selectedTenantId, setSelectedTenantId] = useState(
    TENANT_ENTITIES[0].id
  );
  const [selectedFramework, setSelectedFramework] = useState('CSRD');
  const [selectedScopeFilter, setSelectedScopeFilter] = useState('all'); // 'all' | 'scope1' | 'scope2' | 'scope3'
  const [selectedSite, setSelectedSite] = useState('All Sites');
  const [selectedYear, setSelectedYear] = useState('2026');
  const [globalSearch, setGlobalSearch] = useState('');

  // KPI Audit Drill-Down Drawer State
  const [drilldownKpi, setDrilldownKpi] = useState(null);

  const [isInvoiceModalOpen, setIsInvoiceModalOpen] = useState(false);
  const [editingInvoice, setEditingInvoice] = useState(null);
  const [isBackendModalOpen, setIsBackendModalOpen] = useState(false);
  const [toast, setToast] = useState(null);

  const syncQueueRef = useRef(Promise.resolve());
  const toastTimerRef = useRef(null);
  const searchInputRef = useRef(null);

  const showToast = (text, type = 'success') => {
    if (toastTimerRef.current) clearTimeout(toastTimerRef.current);
    setToast({ text, type });
    toastTimerRef.current = setTimeout(() => setToast(null), 4000);
  };

  // Keyboard shortcut '/' or 'Ctrl+K' to focus quick search
  useEffect(() => {
    const handleKeyDown = (e) => {
      if (
        (e.key === '/' || ((e.metaKey || e.ctrlKey) && e.key === 'k')) &&
        document.activeElement?.tagName !== 'INPUT' &&
        document.activeElement?.tagName !== 'TEXTAREA' &&
        document.activeElement?.tagName !== 'SELECT'
      ) {
        e.preventDefault();
        searchInputRef.current?.focus();
      }
      if (e.key === 'Escape' && drilldownKpi) {
        setDrilldownKpi(null);
      }
    };
    window.addEventListener('keydown', handleKeyDown);
    return () => window.removeEventListener('keydown', handleKeyDown);
  }, [drilldownKpi]);

  // Hydrate shared repository database & verify owner status on startup
  useEffect(() => {
    let isMounted = true;

    async function bootstrapMultiUserDatabase() {
      const localIdb =
        (await loadInvoicesFromIndexedDb()) || initialState.invoices || [];

      const remoteRepoData = await fetchSharedRepositoryDatabase(
        initialState.backendConfig.github
      );
      const remoteInvoices = remoteRepoData?.invoices || [];

      let ownerVerified = false;
      let ownerLogin = null;
      const storedToken = initialState.backendConfig.github?.token?.trim();
      if (storedToken) {
        try {
          const check = await verifyOwnerGitHubAccess(storedToken);
          ownerVerified = Boolean(check.verified);
          ownerLogin = check.ownerLogin;
        } catch (err) {
          console.warn('Stored token verification skipped:', err);
        }
      }

      if (!isMounted) return;

      setIsOwnerUnlocked(ownerVerified);
      setVerifiedOwnerLogin(ownerLogin);

      if (ownerVerified) {
        const merged = mergeRemoteAndLocalInvoices(remoteInvoices, localIdb);
        setInvoices(merged);
        if (localIdb.length > remoteInvoices.length) {
          setHasUnsyncedLocal(true);
        }
      } else {
        if (remoteInvoices.length > 0) {
          setInvoices(remoteInvoices);
        } else if (localIdb.length > 0) {
          setInvoices(localIdb);
        }
        setHasUnsyncedLocal(false);
      }

      if (remoteRepoData?.orgProfile) {
        setOrgProfile((prev) => ({ ...prev, ...remoteRepoData.orgProfile }));
      }
    }

    bootstrapMultiUserDatabase();
    return () => {
      isMounted = false;
    };
  }, []);

  useEffect(() => {
    if (isOwnerUnlocked) {
      saveLocalInvoices(invoices);
    }
  }, [invoices, isOwnerUnlocked]);

  useEffect(() => {
    if (isOwnerUnlocked) {
      saveLocalOrgProfile(orgProfile);
    }
  }, [orgProfile, isOwnerUnlocked]);

  useEffect(() => {
    saveBackendConfig(backendConfig);
  }, [backendConfig]);

  const currentTenant = useMemo(
    () =>
      TENANT_ENTITIES.find((t) => t.id === selectedTenantId) ||
      TENANT_ENTITIES[0],
    [selectedTenantId]
  );

  const currentFrameworkObj = useMemo(
    () =>
      REPORTING_FRAMEWORKS[selectedFramework] || REPORTING_FRAMEWORKS.CSRD,
    [selectedFramework]
  );

  const availableYears = useMemo(() => {
    const set = new Set(
      invoices
        .map((i) => (i.billingPeriodStart || '').slice(0, 4))
        .filter((y) => y.length === 4)
    );
    set.add(orgProfile.reportingYear || '2026');
    return ['All Years', ...Array.from(set).sort().reverse()];
  }, [invoices, orgProfile.reportingYear]);

  // Tenant + Scope + Quick Search filtered invoices passed to active views
  const contextFilteredInvoices = useMemo(() => {
    return invoices.filter((inv) => {
      const site = inv.siteName || inv.facility || SITES[0];
      if (!currentTenant.sites.includes(site)) return false;

      if (selectedScopeFilter === 'scope1' && inv.category !== 'natural_gas') {
        return false;
      }
      if (selectedScopeFilter === 'scope2' && inv.category !== 'electricity') {
        return false;
      }
      if (selectedScopeFilter === 'scope3' && inv.category !== 'water') {
        return false;
      }

      if (globalSearch.trim()) {
        const q = globalSearch.toLowerCase();
        const hay = [
          inv.invoiceNumber,
          inv.invoiceDate,
          inv.supplier,
          site,
          inv.category,
          inv.readingType,
          inv.notes,
        ]
          .filter(Boolean)
          .join(' ')
          .toLowerCase();
        if (!hay.includes(q)) return false;
      }

      return true;
    });
  }, [invoices, currentTenant, selectedScopeFilter, globalSearch]);

  // Per-site invoice counts for sidebar badges
  const siteCounts = useMemo(() => {
    const counts = { 'All Sites': contextFilteredInvoices.length };
    SITES.forEach((s) => {
      counts[s] = contextFilteredInvoices.filter(
        (i) => (i.siteName || i.facility) === s

    });
    return counts;
  }, [contextFilteredInvoices]);

  const handleRequestOwnerUnlock = () => {
    showToast(
      `Write access locked to ${AUTHORIZED_GITHUB_OWNER}. Authenticate via GitHub PAT.`,
      'info'
    );
    setIsBackendModalOpen(true);
  };

  const triggerAutoSyncIfEnabled = (nextInvoices, nextProfile) => {
    if (!isOwnerUnlocked) return;

    const hasGithubToken = Boolean(backendConfig.github?.token?.trim());
    const hasSheetsUrl = Boolean(backendConfig.gsheets?.webAppUrl?.trim());

    if (!hasGithubToken && !hasSheetsUrl) {
      setHasUnsyncedLocal(true);
      return;
    }

    if (!backendConfig.autoSync) {
      setHasUnsyncedLocal(true);
      return;
    }

    syncQueueRef.current = syncQueueRef.current
      .then(async () => {
        if (hasGithubToken) {
          await pushToGitHub(backendConfig.github, {
            invoices: nextInvoices,
            orgProfile: nextProfile,
            sharedGsheetsUrl: backendConfig.gsheets?.webAppUrl || '',
          });
        }
        if (hasSheetsUrl) {
          await pushToGoogleSheets(backendConfig.gsheets, {
            invoices: nextInvoices,
            orgProfile: nextProfile,
          });
        }
        setHasUnsyncedLocal(false);
        setBackendConfig((prev) => ({
          ...prev,
          lastSyncedAt: new Date().toISOString(),
        }));
        showToast('Synced ledger state to GitHub repository');
      })
      .catch((err) => {
        setHasUnsyncedLocal(true);
        showToast(`Cloud sync error: ${err.message}`, 'error');
      });
  };

  const handleSaveInvoice = (invoiceRecord) => {
    if (!isOwnerUnlocked) {
      handleRequestOwnerUnlock();
      return;
    }
    let nextInvoices;
    const exists = invoices.some((i) => i.id === invoiceRecord.id);
    if (exists) {
      nextInvoices = invoices.map((i) =>
        i.id === invoiceRecord.id ? invoiceRecord : i
      );
      showToast(`Updated record ${invoiceRecord.invoiceNumber}`);
    } else {
      nextInvoices = [invoiceRecord, ...invoices];
      showToast(`Committed record ${invoiceRecord.invoiceNumber}`);
    }
    setInvoices(nextInvoices);
    setIsInvoiceModalOpen(false);
    setEditingInvoice(null);
    triggerAutoSyncIfEnabled(nextInvoices, orgProfile);
  };

  const handleDeleteInvoice = (id) => {
    if (!isOwnerUnlocked) {
      handleRequestOwnerUnlock();
      return;
    }
    const target = invoices.find((i) => i.id === id);
    const nextInvoices = invoices.filter((i) => i.id !== id);
    setInvoices(nextInvoices);
    showToast(`Deleted record ${target?.invoiceNumber || ''}`);
    triggerAutoSyncIfEnabled(nextInvoices, orgProfile);
  };

  const handleDuplicateInvoice = (inv) => {
    if (!isOwnerUnlocked) {
      handleRequestOwnerUnlock();
      return;
    }
    const copy = {
      ...inv,
      id: `inv-${Date.now()}`,
      invoiceNumber: `${inv.invoiceNumber}-COPY`,
    };
    setEditingInvoice(copy);
    setIsInvoiceModalOpen(true);
  };

  const handleBulkImport = (importedList) => {
    if (!isOwnerUnlocked) {
      handleRequestOwnerUnlock();
      return;
    }
    const existingByNumber = new Map(
      invoices.map((inv) => [
        String(inv.invoiceNumber || '')
          .trim()
          .toLowerCase(),
        inv,
      ])
    );
    let addedCount = 0;
    let updatedCount = 0;

    importedList.forEach((imp) => {
      const key = String(imp.invoiceNumber || '')
        .trim()
        .toLowerCase();
      if (existingByNumber.has(key)) {
        const prev = existingByNumber.get(key);
        existingByNumber.set(key, { ...prev, ...imp, id: prev.id });
        updatedCount++;
      } else {
        existingByNumber.set(key, imp);
        addedCount++;
      }
    });

    const nextInvoices = Array.from(existingByNumber.values());
    setInvoices(nextInvoices);
    showToast(`CSV Import: +${addedCount} new, ${updatedCount} updated`);
    triggerAutoSyncIfEnabled(nextInvoices, orgProfile);
  };

      >
