/**
 * Calculates normalized energy (kWh), normalized water (m³), and Scope 1/2 GHG emissions (tCO2e)
 * for an individual invoice record.
 */
function calculateInvoiceEsgMetrics(invoice) {
  const quantity = Math.max(0, Number(invoice.quantity) || 0);
  const category = invoice.category || 'electricity';

  if (category === 'electricity') {
    const unitObj =
      UTILITY_CATEGORIES.electricity.units.find((u) => u.id === invoice.unit) ||
      UTILITY_CATEGORIES.electricity.units[0];
    const normalizedEnergyKwh = quantity * unitObj.toKwh;

    const regionObj =
      GRID_REGIONS[invoice.gridRegion] || GRID_REGIONS.US_EPA_AVG;
    const customFactor =
      invoice.customEmissionFactor !== undefined &&
      invoice.customEmissionFactor !== '' &&
      invoice.customEmissionFactor !== null
        ? Number(invoice.customEmissionFactor)
        : null;

    const gridKgPerKwh =
      customFactor !== null ? customFactor : regionObj.kgCo2ePerKwh;

    const renewablePct = Math.min(
      100,
      Math.max(0, Number(invoice.renewablePct) || 0)
    );
    const nonRenewableFraction = (100 - renewablePct) / 100;
    const renewableKwh = normalizedEnergyKwh * (renewablePct / 100);

    // Location-based reflects physical grid average regardless of contractual instruments
    const locationBasedCo2eTonnes =
      (normalizedEnergyKwh * gridKgPerKwh) / 1000;

    // Market-based accounts for RECs, Guarantees of Origin, PPAs, or on-site solar (0 factor for renewable portion)
    const marketBasedCo2eTonnes =
      (normalizedEnergyKwh * nonRenewableFraction * gridKgPerKwh) / 1000;

    return {
      scope: 'Scope 2',
      normalizedEnergyKwh,
      normalizedWaterM3: 0,
      renewableKwh,
      locationBasedCo2eTonnes,
      marketBasedCo2eTonnes,
      effectiveFactorLabel: `${gridKgPerKwh.toFixed(3)} kgCO₂e/kWh`,
    };
  }

  if (category === 'natural_gas') {
    const unitObj =
      UTILITY_CATEGORIES.natural_gas.units.find((u) => u.id === invoice.unit) ||
      UTILITY_CATEGORIES.natural_gas.units[0];
    const subtypeObj =
      UTILITY_CATEGORIES.natural_gas.subtypes.find(
        (s) => s.id === invoice.subtype
      ) || UTILITY_CATEGORIES.natural_gas.subtypes[0];

    const normalizedEnergyKwh = quantity * unitObj.toKwh;
    let totalKgCo2e = 0;

    if (
      invoice.customEmissionFactor !== undefined &&
      invoice.customEmissionFactor !== '' &&
      invoice.customEmissionFactor !== null
    ) {
      totalKgCo2e = quantity * Number(invoice.customEmissionFactor);
    } else if (
      subtypeObj.id === 'natural_gas' &&
      unitObj.kgCo2ePerUnitOverride &&
      (unitObj.id === 'therms' || unitObj.id === 'm3')
    ) {
      totalKgCo2e = quantity * unitObj.kgCo2ePerUnitOverride;
    } else if (
      subtypeObj.id !== 'natural_gas' &&
      (unitObj.id === 'liters' || unitObj.id === 'gallons') &&
      unitObj.kgCo2ePerUnitOverride
    ) {
      totalKgCo2e = quantity * unitObj.kgCo2ePerUnitOverride;
    } else {
      totalKgCo2e = normalizedEnergyKwh * subtypeObj.kgCo2ePerKwh;
    }

    const co2eTonnes = totalKgCo2e / 1000;

    return {
      scope: 'Scope 1',
      normalizedEnergyKwh,
      normalizedWaterM3: 0,
      renewableKwh: 0,
      locationBasedCo2eTonnes: co2eTonnes,
      marketBasedCo2eTonnes: co2eTonnes,
      effectiveFactorLabel: `${subtypeObj.kgCo2ePerKwh.toFixed(3)} kgCO₂e/kWh-eq`,
    };
  }

  // Water & Wastewater
  const unitObj =
    UTILITY_CATEGORIES.water.units.find((u) => u.id === invoice.unit) ||
    UTILITY_CATEGORIES.water.units[0];
  const subtypeObj =
    UTILITY_CATEGORIES.water.subtypes.find((s) => s.id === invoice.subtype) ||
    UTILITY_CATEGORIES.water.subtypes[0];

  const normalizedWaterM3 = quantity * unitObj.toM3;
  const factorPerM3 =
    invoice.customEmissionFactor !== undefined &&
    invoice.customEmissionFactor !== '' &&
    invoice.customEmissionFactor !== null
      ? Number(invoice.customEmissionFactor)
      : subtypeObj.kgCo2ePerM3;

  const co2eTonnes = (normalizedWaterM3 * factorPerM3) / 1000;

  return {
    scope: 'Water (GRI 303)',
    normalizedEnergyKwh: 0,
    normalizedWaterM3,
    renewableKwh: 0,
    locationBasedCo2eTonnes: co2eTonnes,
    marketBasedCo2eTonnes: co2eTonnes,
    effectiveFactorLabel: `${factorPerM3.toFixed(3)} kgCO₂e/m³`,
  };
}

function loadLocalState() {
  try {
    const rawInvoices = localStorage.getItem(STORAGE_KEYS.INVOICES);
    const rawProfile = localStorage.getItem(STORAGE_KEYS.ORG_PROFILE);
    const rawBackend = localStorage.getItem(STORAGE_KEYS.BACKEND_CONFIG);

    return {
      invoices: rawInvoices ? JSON.parse(rawInvoices) : INITIAL_SAMPLE_INVOICES,
      orgProfile: rawProfile
        ? { ...DEFAULT_ORG_PROFILE, ...JSON.parse(rawProfile) }
        : DEFAULT_ORG_PROFILE,
      backendConfig: rawBackend
        ? {
            ...DEFAULT_BACKEND_CONFIG,
            ...JSON.parse(rawBackend),
            github: {
              ...DEFAULT_BACKEND_CONFIG.github,
              ...(JSON.parse(rawBackend).github || {}),
            },
            gsheets: {
              ...DEFAULT_BACKEND_CONFIG.gsheets,
              ...(JSON.parse(rawBackend).gsheets || {}),
            },
          }
        : DEFAULT_BACKEND_CONFIG,
    };
  } catch (err) {
    console.error('Failed to load local state:', err);
    return {
      invoices: INITIAL_SAMPLE_INVOICES,
      orgProfile: DEFAULT_ORG_PROFILE,
      backendConfig: DEFAULT_BACKEND_CONFIG,
    };
  }
}

/**
 * UTF-8 safe Base64 helpers for GitHub Contents API
 */
function utf8ToBase64(str) {
  const bytes = new TextEncoder().encode(str);
  let binary = '';
  for (let i = 0; i < bytes.byteLength; i++) {
    binary += String.fromCharCode(bytes[i]);
  }
  return btoa(binary);
}

function base64ToUtf8(base64) {
  const clean = base64.replace(/\s/g, '');
  const binary = atob(clean);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) {
    bytes[i] = binary.charCodeAt(i);
  }
  return new TextDecoder().decode(bytes);
}

/**
 * GitHub API Integration — Pulls JSON file from repository
 */
async function pullFromGitHub(ghConfig) {
  const { owner, repo, branch = 'main', filePath, token } = ghConfig;
  if (!owner || !repo || !filePath || !token) {
    throw new Error(
      'Please provide GitHub Owner, Repository, File Path, and Personal Access Token.'
    );
  }

  const cleanPath = filePath.replace(/^\/+/, '');
  const url = `https://api.github.com/repos/${encodeURIComponent(
    owner.trim()
  )}/${encodeURIComponent(repo.trim())}/contents/${cleanPath}?ref=${encodeURIComponent(
    branch.trim()
  )}`;

  const res = await fetch(url, {
    headers: {
      Accept: 'application/vnd.github+json',
      Authorization: `Bearer ${token.trim()}`,
      'X-GitHub-Api-Version': '2022-11-28',
    },
  });

  if (res.status === 404) {
    throw new Error(
      `File "${cleanPath}" not found on branch "${branch}". Click "Push / Commit to GitHub" first to initialize it.`
    );
  }

  if (!res.ok) {
    const errBody = await res.json().catch(() => ({}));
    throw new Error(
      errBody.message || `GitHub API returned HTTP ${res.status}`
    );
  }

  const data = await res.json();
  const decodedContent = base64ToUtf8(data.content);
  const parsed = JSON.parse(decodedContent);

  return {
    invoices: Array.isArray(parsed.invoices) ? parsed.invoices : [],
    orgProfile: parsed.orgProfile || DEFAULT_ORG_PROFILE,
    sha: data.sha,
    htmlUrl: data.html_url,
  };
}

/**
 * GitHub API Integration — Commits JSON database directly to the repository
 */
async function pushToGitHub(ghConfig, payload) {
  const { owner, repo, branch = 'main', filePath, token } = ghConfig;
  if (!owner || !repo || !filePath || !token) {
    throw new Error(
      'Please provide GitHub Owner, Repository, File Path, and Personal Access Token.'
    );
  }

  const cleanPath = filePath.replace(/^\/+/, '');
  const baseUrl = `https://api.github.com/repos/${encodeURIComponent(
    owner.trim()
  )}/${encodeURIComponent(repo.trim())}/contents/${cleanPath}`;

  const headers = {
    Accept: 'application/vnd.github+json',
    Authorization: `Bearer ${token.trim()}`,
    'X-GitHub-Api-Version': '2022-11-28',
  };

  // Step 1: Check if file already exists to retrieve its SHA
  let existingSha = null;
  const getRes = await fetch(
    `${baseUrl}?ref=${encodeURIComponent(branch.trim())}`,
    { headers }
  );

  if (getRes.ok) {
    const existingData = await getRes.json();
    existingSha = existingData.sha;
  } else if (getRes.status !== 404) {
    const errBody = await getRes.json().catch(() => ({}));
    throw new Error(
      errBody.message || `Failed to inspect GitHub file (HTTP ${getRes.status})`
    );
  }

  // Step 2: Enrich invoices with calculated ESG metrics for repository auditability
  const enrichedPayload = {
    schemaVersion: '1.0',
    updatedAt: new Date().toISOString(),
    orgProfile: payload.orgProfile,
    invoices: payload.invoices.map((inv) => ({
      ...inv,
      calculatedEsg: calculateInvoiceEsgMetrics(inv),
    })),
  };

  const jsonString = JSON.stringify(enrichedPayload, null, 2);
  const body = {
    message: `chore(esg): sync ${payload.invoices.length} utility invoices via EcoLedger ESG Tracker`,
    content: utf8ToBase64(jsonString),
    branch: branch.trim(),
  };

  if (existingSha) {
    body.sha = existingSha;
  }

  const putRes = await fetch(baseUrl, {
    method: 'PUT',
    headers: {
      ...headers,
      'Content-Type': 'application/json',
    },
    body: JSON.stringify(body),
  });

  if (!putRes.ok) {
    const errBody = await putRes.json().catch(() => ({}));
    throw new Error(
      errBody.message || `GitHub commit failed (HTTP ${putRes.status})`
    );
  }

  const result = await putRes.json();
  return {
    commitSha: result.commit?.sha,
    htmlUrl: result.content?.html_url,
  };
}

/**
 * Google Sheets Apps Script Webhook Integration — Pulls rows from Google Sheet
 */
async function pullFromGoogleSheets(gsConfig) {
  const { webAppUrl } = gsConfig;
  if (!webAppUrl || !webAppUrl.startsWith('https://')) {
    throw new Error(
      'Please enter a valid Google Apps Script Web App URL starting with https://'
    );
  }

  const res = await fetch(webAppUrl.trim(), {
    method: 'GET',
    redirect: 'follow',
  });

  if (!res.ok) {
    throw new Error(`Google Sheets Web App returned HTTP ${res.status}`);
  }

  const data = await res.json();
  if (data.error) {
    throw new Error(data.error);
  }

  return {
    invoices: Array.isArray(data.invoices) ? data.invoices : [],
    orgProfile: data.orgProfile || null,
  };
}

/**
 * Google Sheets Apps Script Webhook Integration — Pushes rows to Google Sheet
 */
async function pushToGoogleSheets(gsConfig, payload) {
  const { webAppUrl } = gsConfig;
  if (!webAppUrl || !webAppUrl.startsWith('https://')) {
    throw new Error(
      'Please enter a valid Google Apps Script Web App URL starting with https://'
    );
  }

  const enrichedInvoices = payload.invoices.map((inv) => {
    const metrics = calculateInvoiceEsgMetrics(inv);
    return {
      ...inv,
      scope: metrics.scope,
      normalizedEnergyKwh: Number(metrics.normalizedEnergyKwh.toFixed(2)),
      normalizedWaterM3: Number(metrics.normalizedWaterM3.toFixed(2)),
      locationBasedCo2eTonnes: Number(
        metrics.locationBasedCo2eTonnes.toFixed(4)
      ),
      marketBasedCo2eTonnes: Number(metrics.marketBasedCo2eTonnes.toFixed(4)),
    };
  });

  // Using text/plain avoids CORS preflight rejection on Google Apps Script endpoints
  const res = await fetch(webAppUrl.trim(), {
    method: 'POST',
    redirect: 'follow',
    headers: {
      'Content-Type': 'text/plain;charset=utf-8',
    },
    body: JSON.stringify({
      action: 'syncAll',
      updatedAt: new Date().toISOString(),
      orgProfile: payload.orgProfile,
      invoices: enrichedInvoices,
    }),
  });

  if (!res.ok) {
    throw new Error(`Google Sheets sync failed with HTTP ${res.status}`);
  }

  const result = await res.json();
  if (result.error) {
    throw new Error(result.error);
  }
  return result;
}

/**
 * Generates an audit-ready CSV string from invoices
 */
function exportInvoicesToCsv(invoices) {
  const headers = [
    'Invoice ID',
    'Invoice Number',
    'Facility',
    'Supplier',
    'Account Number',
    'Category',
    'Subtype',
    'ESG Scope',
    'Billing Start',
    'Billing End',
    'Invoice Date',
    'Quantity',
    'Unit',
    'Grid Region',
    'Renewable %',
    'Renewable Instrument',
    'Normalized Energy (kWh)',
    'Normalized Water (m3)',
    'Location-Based GHG (tCO2e)',
    'Market-Based GHG (tCO2e)',
    'Total Cost',
    'Currency',
    'Verification Status',
    'Notes',
  ];

  const escapeCsv = (val) => {
    if (val === null || val === undefined) return '';
    const str = String(val);
    if (str.includes(',') || str.includes('"') || str.includes('\n')) {
      return `"${str.replace(/"/g, '""')}"`;
    }
    return str;
  };

  const rows = invoices.map((inv) => {
    const metrics = calculateInvoiceEsgMetrics(inv);
    const catName = UTILITY_CATEGORIES[inv.category]?.name || inv.category;
    return [
      inv.id,
      inv.invoiceNumber,
      inv.facility,
      inv.supplier,
      inv.accountNumber || '',
      catName,
      inv.subtype || '',
      metrics.scope,
      inv.billingPeriodStart,
      inv.billingPeriodEnd,
      inv.invoiceDate || '',
      inv.quantity,
      inv.unit,
      inv.gridRegion || 'US_EPA_AVG',
      inv.renewablePct || 0,
      inv.renewableInstrument || '',
      metrics.normalizedEnergyKwh.toFixed(2),
      metrics.normalizedWaterM3.toFixed(2),
      metrics.locationBasedCo2eTonnes.toFixed(4),
      metrics.marketBasedCo2eTonnes.toFixed(4),
      inv.cost,
      inv.currency || 'USD',
      inv.status || 'Verified',
      inv.notes || '',
    ]
      .map(escapeCsv)
      .join(',');
  });

  return [headers.join(','), ...rows].join('\n');
}

/**
 * Parses a CSV file string into invoice records
 */
function parseCsvToInvoices(csvText) {
  const lines = csvText
    .split(/\r?\n/)
    .map((l) => l.trim())
    .filter(Boolean);
  if (lines.length < 2) {
    throw new Error('CSV file must include a header row and at least one data row.');
  }

  const parseLine = (line) => {
    const result = [];
    let current = '';
    let inQuotes = false;
    for (let i = 0; i < line.length; i++) {
      const ch = line[i];
      if (ch === '"') {
        if (inQuotes && line[i + 1] === '"') {
          current += '"';
          i++;
        } else {
          inQuotes = !inQuotes;
        }
      } else if (ch === ',' && !inQuotes) {
        result.push(current.trim());
        current = '';
      } else {
        current += ch;
      }
    }
    result.push(current.trim());
    return result;
  };

  const headers = parseLine(lines[0]).map((h) => h.toLowerCase());
  const findCol = (candidates) =>
    headers.findIndex((h) => candidates.some((c) => h.includes(c)));

  const idxInvNum = findCol(['invoice number', 'invoice #', 'invoice_number']);
  const idxFacility = findCol(['facility', 'site', 'location', 'building']);
  const idxSupplier = findCol(['supplier', 'provider', 'utility', 'vendor']);
  const idxCategory = findCol(['category', 'type', 'utility type']);
  const idxStart = findCol(['billing start', 'start date', 'period start']);
  const idxEnd = findCol(['billing end', 'end date', 'period end']);
  const idxQty = findCol(['quantity', 'usage', 'consumption', 'amount']);
  const idxUnit = findCol(['unit', 'uom']);
  const idxRenew = findCol(['renewable %', 'renewable', 'green %']);
  const idxCost = findCol(['total cost', 'cost', 'spend', 'price']);
  const idxCurrency = findCol(['currency']);
  const idxStatus = findCol(['status', 'verification']);
  const idxNotes = findCol(['notes', 'comment']);

  const imported = [];
  for (let i = 1; i < lines.length; i++) {
    const cols = parseLine(lines[i]);
    if (cols.length < 3) continue;

    const rawCat = (idxCategory >= 0 ? cols[idxCategory] : '').toLowerCase();
    let category = 'electricity';
    if (rawCat.includes('gas') || rawCat.includes('fuel') || rawCat.includes('diesel') || rawCat.includes('therm')) {
      category = 'natural_gas';
    } else if (rawCat.includes('water') || rawCat.includes('sewage')) {
      category = 'water';
    }

    const defaultUnit =
      category === 'electricity'
        ? 'kWh'
        : category === 'natural_gas'
        ? 'therms'
        : 'm3';

    imported.push({
      id: `inv-csv-${Date.now()}-${i}`,
      invoiceNumber:
        (idxInvNum >= 0 && cols[idxInvNum]) || `CSV-${1000 + i}`,
      facility:
        (idxFacility >= 0 && cols[idxFacility]) || 'Main Facility',
      supplier:
        (idxSupplier >= 0 && cols[idxSupplier]) || 'Utility Provider',
      accountNumber: '',
      category,
      subtype:
        category === 'electricity'
          ? 'grid_electricity'
          : category === 'natural_gas'
          ? 'natural_gas'
          : 'municipal_water',
      billingPeriodStart:
        (idxStart >= 0 && cols[idxStart]) || '2026-01-01',
      billingPeriodEnd: (idxEnd >= 0 && cols[idxEnd]) || '2026-01-31',
      invoiceDate: (idxEnd >= 0 && cols[idxEnd]) || '2026-02-01',
      quantity: Number(idxQty >= 0 ? cols[idxQty] : 0) || 0,
      unit: (idxUnit >= 0 && cols[idxUnit]) || defaultUnit,
      renewablePct: Number(idxRenew >= 0 ? cols[idxRenew] : 0) || 0,
      renewableInstrument: '',
      gridRegion: 'US_EPA_AVG',
      cost: Number(idxCost >= 0 ? cols[idxCost] : 0) || 0,
      currency: (idxCurrency >= 0 && cols[idxCurrency]) || 'USD',
      status: (idxStatus >= 0 && cols[idxStatus]) || 'Verified',
      notes: (idxNotes >= 0 && cols[idxNotes]) || 'Imported via CSV',
    });
  }

  return imported;
}


// --- File: DashboardView.jsx ---

function DashboardView({
  invoices,
  orgProfile,
  onUpdateOrgProfile,
  selectedFacility,
  onSelectFacility,
  selectedYear,
  onSelectYear,
  onOpenNewInvoice,
  onSwitchTab,
}) {
  const facilities = useMemo(() => {
    const set = new Set(invoices.map((i) => i.facility).filter(Boolean));
    return ['All Facilities', ...Array.from(set)];
  }, [invoices]);

  const years = useMemo(() => {
    const set = new Set(
      invoices
        .map((i) => (i.billingPeriodStart || '').slice(0, 4))
        .filter((y) => y.length === 4)
    );
    set.add(orgProfile.reportingYear || '2026');
    return ['All Years', ...Array.from(set).sort().reverse()];
  }, [invoices, orgProfile.reportingYear]);

  const filteredInvoices = useMemo(() => {
    return invoices.filter((inv) => {
      const matchFacility =
        selectedFacility === 'All Facilities' ||
        inv.facility === selectedFacility;
      const invYear = (inv.billingPeriodStart || '').slice(0, 4);
      const matchYear =
        selectedYear === 'All Years' || invYear === selectedYear;
      return matchFacility && matchYear;
    });
  }, [invoices, selectedFacility, selectedYear]);

  const summary = useMemo(() => {
    let scope1Tonnes = 0;
    let scope2LocationTonnes = 0;
    let scope2MarketTonnes = 0;
    let waterTonnes = 0;

    let electricityKwh = 0;
    let renewableElectricityKwh = 0;
    let fuelKwhEq = 0;
    let waterM3 = 0;
    let totalCost = 0;
    let verifiedCount = 0;

    const monthlyMap = {};
    const facilityMap = {};

    filteredInvoices.forEach((inv) => {
      const m = calculateInvoiceEsgMetrics(inv);
      const cost = Number(inv.cost) || 0;
      totalCost += cost;
      if (inv.status === 'Verified') verifiedCount++;

      if (inv.category === 'electricity') {
        scope2LocationTonnes += m.locationBasedCo2eTonnes;
        scope2MarketTonnes += m.marketBasedCo2eTonnes;
        electricityKwh += m.normalizedEnergyKwh;
        renewableElectricityKwh += m.renewableKwh;
      } else if (inv.category === 'natural_gas') {
        scope1Tonnes += m.locationBasedCo2eTonnes;
        fuelKwhEq += m.normalizedEnergyKwh;
      } else if (inv.category === 'water') {
        waterTonnes += m.locationBasedCo2eTonnes;
        waterM3 += m.normalizedWaterM3;
      }

      // Monthly bucket (YYYY-MM)
      const monthKey = (inv.billingPeriodStart || '2026-01').slice(0, 7);
      if (!monthlyMap[monthKey]) {
        monthlyMap[monthKey] = {
          month: monthKey,
          scope1: 0,
          scope2Location: 0,
          scope2Market: 0,
          waterTonnes: 0,
          energyKwh: 0,
          cost: 0,
        };
      }
      if (inv.category === 'natural_gas') {
        monthlyMap[monthKey].scope1 += m.locationBasedCo2eTonnes;
      } else if (inv.category === 'electricity') {
        monthlyMap[monthKey].scope2Location += m.locationBasedCo2eTonnes;
        monthlyMap[monthKey].scope2Market += m.marketBasedCo2eTonnes;
      } else {
        monthlyMap[monthKey].waterTonnes += m.locationBasedCo2eTonnes;
      }
      monthlyMap[monthKey].energyKwh += m.normalizedEnergyKwh;
      monthlyMap[monthKey].cost += cost;

      // Facility bucket
      const fac = inv.facility || 'Unassigned Facility';
      if (!facilityMap[fac]) {
        facilityMap[fac] = {
          facility: fac,
          scope1: 0,
          scope2Market: 0,
          scope2Location: 0,
          waterM3: 0,
          energyMwh: 0,
          cost: 0,
          invoiceCount: 0,
        };
      }
      facilityMap[fac].invoiceCount += 1;
      facilityMap[fac].cost += cost;
      facilityMap[fac].energyMwh += m.normalizedEnergyKwh / 1000;
      facilityMap[fac].waterM3 += m.normalizedWaterM3;
      if (inv.category === 'natural_gas') {
        facilityMap[fac].scope1 += m.locationBasedCo2eTonnes;
      } else if (inv.category === 'electricity') {
        facilityMap[fac].scope2Market += m.marketBasedCo2eTonnes;
        facilityMap[fac].scope2Location += m.locationBasedCo2eTonnes;
      }
    });

    const isMarket = orgProfile.scope2AccountingMethod !== 'location';
    const activeScope2 = isMarket ? scope2MarketTonnes : scope2LocationTonnes;
    const totalGhgTonnes = scope1Tonnes + activeScope2 + waterTonnes;
    const totalEnergyMwh = (electricityKwh + fuelKwhEq) / 1000;
    const renewableSharePct =
      electricityKwh > 0 ? (renewableElectricityKwh / electricityKwh) * 100 : 0;
    const avoidedByRenewablesTonnes = Math.max(
      0,
      scope2LocationTonnes - scope2MarketTonnes
    );

    const monthlySeries = Object.values(monthlyMap).sort((a, b) =>
      a.month.localeCompare(b.month)
    );
    const facilitySeries = Object.values(facilityMap).sort(
      (a, b) =>
        b.scope1 +
        (isMarket ? b.scope2Market : b.scope2Location) -
        (a.scope1 + (isMarket ? a.scope2Market : a.scope2Location))
    );

    return {
      scope1Tonnes,
      scope2LocationTonnes,
      scope2MarketTonnes,
      activeScope2,
      waterTonnes,
      totalGhgTonnes,
      electricityKwh,
      renewableElectricityKwh,
      renewableSharePct,
      avoidedByRenewablesTonnes,
      fuelKwhEq,
      totalEnergyMwh,
      waterM3,
      totalCost,
      verifiedCount,
      monthlySeries,
      facilitySeries,
    };
  }, [filteredInvoices, orgProfile.scope2AccountingMethod]);

  const isMarket = orgProfile.scope2AccountingMethod !== 'location';
  const maxMonthTonnes = Math.max(
    1,
    ...summary.monthlySeries.map(
      (m) =>
        m.scope1 +
        (isMarket ? m.scope2Market : m.scope2Location) +
        m.waterTonnes
    )
  );

  const carbonPerFte =
    orgProfile.headcountFte > 0
      ? summary.totalGhgTonnes / orgProfile.headcountFte
      : 0;
  const kgPerM2 =
    orgProfile.floorAreaM2 > 0
      ? (summary.totalGhgTonnes * 1000) / orgProfile.floorAreaM2
      : 0;

  return (
    <div className="space-y-6">
      {/* Top Filter & Scope 2 Accounting Bar */}
      <div className="bg-white rounded-xl border border-slate-200 p-4 shadow-sm flex flex-wrap items-center justify-between gap-4">
        <div className="flex flex-wrap items-center gap-3">
          <div className="flex items-center gap-2">
            <Building2 className="w-4 h-4 text-slate-500" />
            <label className="text-xs font-semibold uppercase tracking-wider text-slate-500">
              Facility:
            </label>
            <select
              value={selectedFacility}
              onChange={(e) => onSelectFacility(e.target.value)}
              className="text-sm font-medium bg-slate-50 border border-slate-300 rounded-lg px-3 py-1.5 text-slate-800 focus:outline-none focus:ring-2 focus:ring-emerald-500"
            >
              {facilities.map((f) => (
                <option key={f} value={f}>
                  {f}
                </option>
              ))}
            </select>
          </div>

          <div className="flex items-center gap-2">
            <label className="text-xs font-semibold uppercase tracking-wider text-slate-500">
              Reporting Period:
            </label>
            <select
              value={selectedYear}
              onChange={(e) => onSelectYear(e.target.value)}
              className="text-sm font-medium bg-slate-50 border border-slate-300 rounded-lg px-3 py-1.5 text-slate-800 focus:outline-none focus:ring-2 focus:ring-emerald-500"
            >
              {years.map((y) => (
                <option key={y} value={y}>
                  {y}
                </option>
              ))}
            </select>
          </div>
        </div>

        <div className="flex items-center gap-3">
          <div className="inline-flex items-center bg-slate-100 p-1 rounded-lg border border-slate-200">
            <button
              type="button"
              onClick={() =>
                onUpdateOrgProfile({
                  ...orgProfile,
                  scope2AccountingMethod: 'market',
                })
              }
              className={`px-3 py-1 rounded-md text-xs font-semibold transition ${
                isMarket
                  ? 'bg-white text-emerald-700 shadow-sm'
                  : 'text-slate-600 hover:text-slate-900'
              }`}
            >
              Market-Based Scope 2
            </button>
            <button
              type="button"
              onClick={() =>
                onUpdateOrgProfile({
                  ...orgProfile,
                  scope2AccountingMethod: 'location',
                })

                      </span>

                    <div className="mt-1.5 flex items-center justify-between text-xs text-slate-500">

            </div>
          </div>

        </div>
      </div>
    </div>
  );
}

    if (editingInvoice) {
      setForm({
        ...EMPTY_FORM,
        ...editingInvoice,
        customEmissionFactor:
          editingInvoice.customEmissionFactor !== undefined &&
          editingInvoice.customEmissionFactor !== null
            ? editingInvoice.customEmissionFactor
            : '',
      });
    } else {
      setForm({
        ...EMPTY_FORM,
        invoiceNumber: `INV-${new Date().getFullYear()}-${String(
          Math.floor(100 + Math.random() * 900)
        )}`,
      });

  const handleCategoryChange = (newCategory) => {
    const catObj = UTILITY_CATEGORIES[newCategory];
    setForm((prev) => ({
      ...prev,
      category: newCategory,
      subtype: catObj.subtypes[0].id,
      unit: catObj.units[0].id,
      renewablePct: newCategory === 'electricity' ? prev.renewablePct : 0,

  const liveMetrics = useMemo(() => {
    return calculateInvoiceEsgMetrics(form);

    onSave({
      ...form,
      id: editingInvoice?.id || `inv-${Date.now()}`,
      quantity: Number(form.quantity) || 0,
      cost: Number(form.cost) || 0,
      renewablePct:
        form.category === 'electricity' ? Number(form.renewablePct) || 0 : 0,

function InvoiceTable({
  invoices,
  onAddInvoice,
  onEditInvoice,
  onDuplicateInvoice,
  onDeleteInvoice,
  onBulkImport,
}) {
  const [searchQuery, setSearchQuery] = useState('');
  const [categoryFilter, setCategoryFilter] = useState('all');
  const [facilityFilter, setFacilityFilter] = useState('all');
  const [statusFilter, setStatusFilter] = useState('all');
  const [importError, setImportError] = useState('');
  const fileInputRef = useRef(null);

  const facilities = useMemo(() => {
    const set = new Set(invoices.map((i) => i.facility).filter(Boolean));
    return Array.from(set);
  }, [invoices]);

  const filtered = useMemo(() => {
    return invoices
      .filter((inv) => {
        if (categoryFilter !== 'all' && inv.category !== categoryFilter) {
          return false;
        }
        if (facilityFilter !== 'all' && inv.facility !== facilityFilter) {
          return false;
        }
        if (statusFilter !== 'all' && inv.status !== statusFilter) {
          return false;
        }
        if (searchQuery.trim()) {
          const q = searchQuery.toLowerCase();
          const hay = [
            inv.invoiceNumber,
            inv.supplier,
            inv.facility,
            inv.accountNumber,
            inv.notes,
          ]
            .filter(Boolean)
            .join(' ')
            .toLowerCase();
          if (!hay.includes(q)) return false;
        }
        return true;
      })
      .sort((a, b) =>
        (b.billingPeriodStart || '').localeCompare(a.billingPeriodStart || '')
      );
  }, [invoices, categoryFilter, facilityFilter, statusFilter, searchQuery]);

  const handleDownloadCsv = () => {
    const csvContent = exportInvoicesToCsv(filtered);
    const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `esg-utility-invoices-${new Date()
      .toISOString()
      .slice(0, 10)}.csv`;
    a.click();
    URL.revokeObjectURL(url);
  };

  const handleDownloadTemplate = () => {
    const sampleTemplate = [
      'Invoice Number,Facility,Supplier,Category,Billing Start,Billing End,Quantity,Unit,Renewable %,Total Cost,Currency,Status,Notes',

  const handleFileUpload = (e) => {
    setImportError('');
    const file = e.target.files?.[0];

    const reader = new FileReader();

      try {
        const text = String(event.target?.result || '');
        const parsed = parseCsvToInvoices(text);

          setImportError('No valid invoice rows found in CSV.');
          return;

        onBulkImport(parsed);

        setImportError(err.message || 'Failed to parse CSV file.');

      }
    };
    reader.readAsText(file);
  };

function EsgReportView({
  invoices,
  orgProfile,
  onUpdateOrgProfile,
}) {
  const report = useMemo(() => {
    let scope1Tonnes = 0;
    let scope2LocationTonnes = 0;
    let scope2MarketTonnes = 0;
    let waterTonnes = 0;

    let totalElectricityKwh = 0;
    let renewableElectricityKwh = 0;
    let gridElectricityKwh = 0;
    let naturalGasKwhEq = 0;
    let waterWithdrawalM3 = 0;
    let wastewaterM3 = 0;
    let verifiedInvoices = 0;

    invoices.forEach((inv) => {
      const m = calculateInvoiceEsgMetrics(inv);
      if (inv.status === 'Verified') verifiedInvoices++;

      if (inv.category === 'electricity') {
        scope2LocationTonnes += m.locationBasedCo2eTonnes;
        scope2MarketTonnes += m.marketBasedCo2eTonnes;
        totalElectricityKwh += m.normalizedEnergyKwh;
        renewableElectricityKwh += m.renewableKwh;
        gridElectricityKwh += m.normalizedEnergyKwh - m.renewableKwh;
      } else if (inv.category === 'natural_gas') {
        scope1Tonnes += m.locationBasedCo2eTonnes;
        naturalGasKwhEq += m.normalizedEnergyKwh;
      } else if (inv.category === 'water') {
        waterTonnes += m.locationBasedCo2eTonnes;
        if (inv.subtype === 'wastewater') {
          wastewaterM3 += m.normalizedWaterM3;
        } else {
          waterWithdrawalM3 += m.normalizedWaterM3;
        }
      }
    });

    const totalEnergyKwh = totalElectricityKwh + naturalGasKwhEq;
    const totalEnergyGj = (totalEnergyKwh / 1000) * 3.6;
    const renewableEnergyShare =
      totalEnergyKwh > 0 ? (renewableElectricityKwh / totalEnergyKwh) * 100 : 0;
    const renewableElecShare =
      totalElectricityKwh > 0
        ? (renewableElectricityKwh / totalElectricityKwh) * 100
        : 0;

    const totalLocationGhg = scope1Tonnes + scope2LocationTonnes + waterTonnes;
    const totalMarketGhg = scope1Tonnes + scope2MarketTonnes + waterTonnes;

    const floorArea = Math.max(1, Number(orgProfile.floorAreaM2) || 1);
    const fte = Math.max(1, Number(orgProfile.headcountFte) || 1);

    return {
      scope1Tonnes,
      scope2LocationTonnes,
      scope2MarketTonnes,
      waterTonnes,
      totalLocationGhg,
      totalMarketGhg,
      totalElectricityMwh: totalElectricityKwh / 1000,
      renewableElectricityMwh: renewableElectricityKwh / 1000,
      gridElectricityMwh: gridElectricityKwh / 1000,
      naturalGasMwhEq: naturalGasKwhEq / 1000,
      totalEnergyMwh: totalEnergyKwh / 1000,
      totalEnergyGj,
      renewableEnergyShare,
      renewableElecShare,
      waterWithdrawalM3,
      wastewaterM3,
      energyIntensityKwhPerM2: totalEnergyKwh / floorArea,
      ghgIntensityTonnesPerFte: totalMarketGhg / fte,
      ghgIntensityKgPerM2: (totalMarketGhg * 1000) / floorArea,
      verifiedPct:
        invoices.length > 0 ? (verifiedInvoices / invoices.length) * 100 : 100,
    };
  }, [invoices, orgProfile]);

  const handleDownloadAuditCsv = () => {
    const csv = exportInvoicesToCsv(invoices);
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);

function BackendConfigModal({
  isOpen,
  onClose,
  backendConfig,
  onSaveConfig,
  invoices,
  orgProfile,
  onRestoreRemoteData,
}) {
  const [config, setConfig] = useState(backendConfig);
  const [activeTab, setActiveTab] = useState(
    backendConfig.activeMode === 'gsheets' ? 'gsheets' : 'github'
  );
  const [loading, setLoading] = useState(false);
  const [statusMsg, setStatusMsg] = useState(null);
  const [copiedScript, setCopiedScript] = useState(false);

  if (!isOpen) return null;

  const updateGithub = (field, value) => {
    setConfig((prev) => ({
      ...prev,
      github: { ...prev.github, [field]: value },
    }));
  };

  const updateGsheets = (field, value) => {
    setConfig((prev) => ({
      ...prev,
      gsheets: { ...prev.gsheets, [field]: value },
    }));
  };

  const handlePersistConfig = (nextConfig) => {
    setConfig(nextConfig);
    onSaveConfig(nextConfig);
  };

  const handleGitHubPush = async () => {
    setLoading(true);
    setStatusMsg(null);
    try {
      const res = await pushToGitHub(config.github, { invoices, orgProfile });
      const updated = {
        ...config,
        activeMode: 'github',
        lastSyncedAt: new Date().toISOString(),
      };
      handlePersistConfig(updated);
      setStatusMsg({
        type: 'success',
        text: `Committed ${invoices.length} invoices to ${config.github.owner}/${config.github.repo} (${config.github.filePath}).`,
        url: res.htmlUrl,
      });
    } catch (err) {
      setStatusMsg({ type: 'error', text: err.message });
    } finally {
      setLoading(false);
    }
  };

  const handleGitHubPull = async () => {
    setLoading(true);
    setStatusMsg(null);
    try {
      const res = await pullFromGitHub(config.github);
      onRestoreRemoteData(res.invoices, res.orgProfile);
      const updated = {
        ...config,
        activeMode: 'github',
        lastSyncedAt: new Date().toISOString(),
      };
      handlePersistConfig(updated);
      setStatusMsg({
        type: 'success',
        text: `Loaded ${res.invoices.length} invoices from GitHub repository.`,
      });
    } catch (err) {
      setStatusMsg({ type: 'error', text: err.message });
    } finally {
      setLoading(false);
    }
  };

  const handleGoogleSheetsPush = async () => {
    setLoading(true);
    setStatusMsg(null);
    try {
      await pushToGoogleSheets(config.gsheets, { invoices, orgProfile });
      const updated = {
        ...config,
        activeMode: 'gsheets',
        lastSyncedAt: new Date().toISOString(),
      };
      handlePersistConfig(updated);
      setStatusMsg({
        type: 'success',
        text: `Synced ${invoices.length} invoices to Google Sheets ('ESG_Invoices' tab).`,
      });
    } catch (err) {
      setStatusMsg({ type: 'error', text: err.message });
    } finally {
      setLoading(false);
    }
  };

  const handleGoogleSheetsPull = async () => {
    setLoading(true);
    setStatusMsg(null);
    try {
      const res = await pullFromGoogleSheets(config.gsheets);
      onRestoreRemoteData(res.invoices, res.orgProfile);
      const updated = {
        ...config,
        activeMode: 'gsheets',
        lastSyncedAt: new Date().toISOString(),
      };
      handlePersistConfig(updated);
      setStatusMsg({
        type: 'success',
        text: `Pulled ${res.invoices.length} invoices from Google Sheets.`,
      });
    } catch (err) {
      setStatusMsg({ type: 'error', text: err.message });
    } finally {
      setLoading(false);
    }
  };

  const handleCopyAppsScript = () => {
    navigator.clipboard.writeText(GOOGLE_APPS_SCRIPT_SNIPPET);
    setCopiedScript(true);
    setTimeout(() => setCopiedScript(false), 2500);
  };

  const handleExportJson = () => {
    const json = JSON.stringify(
      {
        exportedAt: new Date().toISOString(),
        orgProfile,
        invoices,
      },
      null,
      2
    );
    const blob = new Blob([json], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `esg-invoices-backup-${new Date()
      .toISOString()
      .slice(0, 10)}.json`;
    a.click();
    URL.revokeObjectURL(url);
  };

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 backdrop-blur-xs p-4 overflow-y-auto">
      <div className="bg-white rounded-2xl border border-slate-200 shadow-2xl max-w-2xl w-full overflow-hidden my-8">
        {/* Header */}
        <div className="px-6 py-4 bg-slate-900 text-white flex items-center justify-between">
          <div>
            <h2 className="text-lg font-bold">
              Cloud Backend Integration (GitHub API & Google Sheets)
            </h2>
            <p className="text-xs text-slate-300">
              Serverless persistence designed for GitHub Pages static hosting
            </p>
          </div>
          <button
            type="button"
            onClick={onClose}
            className="text-slate-400 hover:text-white p-1.5 rounded-lg"
          >
            <X className="w-5 h-5" />
          </button>
        </div>

        {/* Provider Tabs */}
        <div className="border-b border-slate-200 bg-slate-50 px-6 pt-3 flex items-center gap-2">
          <button
            type="button"
            onClick={() => {
              setActiveTab('github');

            }}

                ? 'border-emerald-600 text-slate-900 bg-white'
                : 'border-transparent text-slate-500 hover:text-slate-800'
            }`}
          >
            <Github className="w-4 h-4" />
            GitHub Repository API
          </button>

          <button
            type="button"
            onClick={() => {
              setActiveTab('gsheets');
              setStatusMsg(null);
            }}
            className={`inline-flex items-center gap-2 px-4 py-2.5 text-xs font-bold rounded-t-lg border-b-2 transition ${
              activeTab === 'gsheets'
                ? 'border-emerald-600 text-slate-900 bg-white'
                : 'border-transparent text-slate-500 hover:text-slate-800'
            }`}
          >
            <FileSpreadsheet className="w-4 h-4 text-emerald-600" />
            Google Sheets Webhook
          </button>

          <button
            type="button"
            onClick={() => {
              setActiveTab('local');
              setStatusMsg(null);
            }}
            className={`inline-flex items-center gap-2 px-4 py-2.5 text-xs font-bold rounded-t-lg border-b-2 transition ${
              activeTab === 'local'
                ? 'border-emerald-600 text-slate-900 bg-white'
                : 'border-transparent text-slate-500 hover:text-slate-800'
            }`}
          >
            <HardDrive className="w-4 h-4 text-slate-600" />
            JSON Backup & Auto-Sync
          </button>
        </div>

        <div className="p-6 space-y-5 max-h-[78vh] overflow-y-auto">
          {statusMsg && (
            <div
              className={`p-3.5 rounded-xl border text-xs flex items-start gap-2.5 ${
                statusMsg.type === 'success'
                  ? 'bg-emerald-50 border-emerald-200 text-emerald-900'
                  : 'bg-red-50 border-red-200 text-red-800'
              }`}
            >
              {statusMsg.type === 'success' ? (
                <CheckCircle2 className="w-4 h-4 text-emerald-600 shrink-0 mt-0.5" />
              ) : (
                <AlertTriangle className="w-4 h-4 text-red-600 shrink-0 mt-0.5" />
              )}
              <div className="flex-1">
                <div className="font-semibold">{statusMsg.text}</div>
                {statusMsg.url && (
                  <a
                    href={statusMsg.url}
                    target="_blank"
                    rel="noreferrer"
                    className="underline text-emerald-700 mt-1 inline-block"
                  >
                    View committed file on GitHub →
                  </a>
                )}
              </div>
            </div>
          )}

          {/* TAB 1: GitHub API */}
          {activeTab === 'github' && (
            <div className="space-y-4">
              <div className="p-3.5 rounded-xl bg-slate-50 border border-slate-200 text-xs text-slate-600 leading-relaxed">
                <strong>How GitHub API Storage works on GitHub Pages:</strong>{' '}
                Your browser reads and commits{' '}
                <code className="px-1 py-0.5 bg-slate-200 rounded text-slate-800">
                  data/esg-invoices.json
                </code>{' '}
                directly to your GitHub repository using the GitHub REST API.
                Every ESG invoice update gets a full Git commit audit trail.
              </div>

              <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                  <label className="block text-xs font-semibold text-slate-700 mb-1">
                    GitHub Owner (User or Org) *
                  </label>
                  <input
                    type="text"
                    value={config.github.owner}
                    onChange={(e) => updateGithub('owner', e.target.value)}
                    placeholder="e.g. acme-corp"
                    className="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg"
                  />
                </div>

                <div>
                  <label className="block text-xs font-semibold text-slate-700 mb-1">
                    Repository Name *
                  </label>
                  <input
                    type="text"
                    value={config.github.repo}
                    onChange={(e) => updateGithub('repo', e.target.value)}
                    placeholder="e.g. esg-energy-tracker"
                    className="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg"
                  />
                </div>

                <div>
                  <label className="block text-xs font-semibold text-slate-700 mb-1">
                    Branch Name
                  </label>
                  <input
                    type="text"
                    value={config.github.branch}
                    onChange={(e) => updateGithub('branch', e.target.value)}
                    placeholder="main"
                    className="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg"
                  />
                </div>

                <div>
                  <label className="block text-xs font-semibold text-slate-700 mb-1">
                    JSON File Path in Repo
                  </label>
                  <input
                    type="text"
                    value={config.github.filePath}
                    onChange={(e) => updateGithub('filePath', e.target.value)}
                    placeholder="data/esg-invoices.json"
                    className="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg"
                  />
                </div>
              </div>

              <div>
                <label className="block text-xs font-semibold text-slate-700 mb-1">
                  GitHub Fine-Grained Personal Access Token (PAT) *
                </label>
                <input
                  type="password"
                  value={config.github.token}
                  onChange={(e) => updateGithub('token', e.target.value)}
                  placeholder="github_pat_..."
                  className="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg font-mono"
                />
                <p className="mt-1 text-[11px] text-slate-500">
                  Stored only in your local browser storage. Requires{' '}
                  <strong>Contents: Read and Write</strong> permission on the
                  target repository.
                </p>
              </div>

              <div className="flex flex-wrap items-center gap-3 pt-2">
                <button
                  type="button"
                  disabled={loading}
                  onClick={handleGitHubPush}
                  className="inline-flex items-center gap-2 px-4 py-2.5 rounded-lg text-xs font-semibold bg-slate-900 hover:bg-slate-800 text-white disabled:opacity-50"
                >
                  {loading ? (
                    <RefreshCw className="w-4 h-4 animate-spin" />
                  ) : (
                    <UploadCloud className="w-4 h-4" />
                  )}
                  Commit & Push Invoices to GitHub
                </button>

                <button
                  type="button"
                  disabled={loading}
                  onClick={handleGitHubPull}
                  className="inline-flex items-center gap-2 px-4 py-2.5 rounded-lg text-xs font-semibold bg-white border border-slate-300 hover:bg-slate-50 text-slate-800 disabled:opacity-50"
                >
                  <DownloadCloud className="w-4 h-4" />
                  Pull Latest from GitHub
                </button>
              </div>
            </div>
          )}

          {/* TAB 2: Google Sheets */}
          {activeTab === 'gsheets' && (
            <div className="space-y-4">
              <div>
                <label className="block text-xs font-semibold text-slate-700 mb-1">
                  Google Apps Script Web App URL *
                </label>
                <input
                  type="url"
                  value={config.gsheets.webAppUrl}
                  onChange={(e) => updateGsheets('webAppUrl', e.target.value)}
                  placeholder="https://script.google.com/macros/s/.../exec"
                  className="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg font-mono"
                />
                <p className="mt-1 text-[11px] text-slate-500">
                  Pushes formatted rows + calculated Scope 1 & 2 emissions to
                  your Google Sheet&apos;s <code>ESG_Invoices</code> tab.
                </p>
              </div>

              <div className="flex flex-wrap items-center gap-3">
                <button
                  type="button"
                  disabled={loading}
                  onClick={handleGoogleSheetsPush}
                  className="inline-flex items-center gap-2 px-4 py-2.5 rounded-lg text-xs font-semibold bg-emerald-600 hover:bg-emerald-700 text-white disabled:opacity-50"
                >
                  {loading ? (
                    <RefreshCw className="w-4 h-4 animate-spin" />
                  ) : (
                    <UploadCloud className="w-4 h-4" />
                  )}
                  Push Invoices to Google Sheet
                </button>

                <button
                  type="button"
                  disabled={loading}
                  onClick={handleGoogleSheetsPull}
                  className="inline-flex items-center gap-2 px-4 py-2.5 rounded-lg text-xs font-semibold bg-white border border-slate-300 hover:bg-slate-50 text-slate-800 disabled:opacity-50"
                >
                  <DownloadCloud className="w-4 h-4" />
                  Pull from Google Sheet
                </button>
              </div>

              {/* Copyable Google Apps Script Snippet */}
              <div className="border border-slate-200 rounded-xl overflow-hidden">
                <div className="bg-slate-100 px-4 py-2.5 flex items-center justify-between border-b border-slate-200">
                  <span className="text-xs font-bold text-slate-700">
                    60-Second Google Sheet Setup (Extensions → Apps Script)
                  </span>
                  <button
                    type="button"
                    onClick={handleCopyAppsScript}
                    className="inline-flex items-center gap-1.5 px-2.5 py-1 rounded bg-white border border-slate-300 text-xs font-semibold text-slate-700 hover:bg-slate-50"
                  >
                    {copiedScript ? (
                      <>
                        <Check className="w-3.5 h-3.5 text-emerald-600" />
                        Copied!
                      </>
                    ) : (
                      <>
                        <Copy className="w-3.5 h-3.5" />
                        Copy Apps Script
                      </>
                    )}
                  </button>
                </div>
                <pre className="p-3 bg-slate-950 text-slate-200 text-[11px] font-mono overflow-x-auto max-h-48 leading-relaxed">
                  {GOOGLE_APPS_SCRIPT_SNIPPET}
                </pre>
              </div>
            </div>
          )}

          {/* TAB 3: JSON Backup & Auto-Sync */}
          {activeTab === 'local' && (
            <div className="space-y-4">
              <div className="p-4 rounded-xl bg-slate-50 border border-slate-200 flex items-center justify-between">
                <div>
                  <div className="text-sm font-bold text-slate-800">
                    Auto-Sync to Active Cloud Provider on Save
                  </div>
                  <div className="text-xs text-slate-500">
                    Automatically pushes to{' '}
                    {config.activeMode === 'github'
                      ? 'GitHub Repository'
                      : config.activeMode === 'gsheets'
                      ? 'Google Sheets'
                      : 'your selected cloud backend'}{' '}
                    whenever you add or edit an invoice
                  </div>
                </div>
                <input
                  type="checkbox"
                  checked={Boolean(config.autoSync)}
                  onChange={(e) =>
                    handlePersistConfig({
                      ...config,
                      autoSync: e.target.checked,
                    })
                  }
                  className="w-5 h-5 accent-emerald-600 rounded"
                />
              </div>

              <div className="p-4 rounded-xl border border-slate-200 flex items-center justify-between">
                <div>
                  <div className="text-sm font-bold text-slate-800">
                    Download Complete JSON Database Snapshot
                  </div>
                  <div className="text-xs text-slate-500">
                    Commit this file directly to your repo or keep it as an
                    offline ESG audit archive
                  </div>
                </div>
                <button
                  type="button"
                  onClick={handleExportJson}
                  className="px-4 py-2 rounded-lg text-xs font-semibold bg-slate-900 text-white hover:bg-slate-800"
                >
                  Download JSON
                </button>
              </div>
            </div>
          )}
        </div>

        {/* Modal Footer */}
        <div className="px-6 py-3.5 bg-slate-50 border-t border-slate-200 flex items-center justify-between">
          <div className="text-xs text-slate-500">
            Active Backend:{' '}
            <strong className="text-slate-800 uppercase">
              {config.activeMode}
            </strong>
            {config.lastSyncedAt &&
              ` · Last Synced: ${new Date(
                config.lastSyncedAt
              ).toLocaleTimeString()}`}
          </div>
          <button
            type="button"
            onClick={() => {
              onSaveConfig(config);
              onClose();
            }}
            className="px-4 py-2 rounded-lg text-xs font-semibold bg-emerald-600 hover:bg-emerald-700 text-white"
          >
            Save Settings & Close
          </button>
        </div>
      </div>
    </div>
  );
}


// --- File: App.jsx ---

function App() {
  const initialState = useMemo(() => loadLocalState(), []);

  const [invoices, setInvoices] = useState(initialState.invoices);
  const [orgProfile, setOrgProfile] = useState(initialState.orgProfile);
  const [backendConfig, setBackendConfig] = useState(
    initialState.backendConfig
  );

  const [activeTab, setActiveTab] = useState('dashboard');
  const [selectedFacility, setSelectedFacility] = useState('All Facilities');
  const [selectedYear, setSelectedYear] = useState('All Years');

  const [isInvoiceModalOpen, setIsInvoiceModalOpen] = useState(false);
  const [editingInvoice, setEditingInvoice] = useState(null);
  const [isBackendModalOpen, setIsBackendModalOpen] = useState(false);
  const [toast, setToast] = useState(null);

  useEffect(() => {
    saveLocalInvoices(invoices);
  }, [invoices]);

  useEffect(() => {
    saveLocalOrgProfile(orgProfile);
  }, [orgProfile]);

  useEffect(() => {
    saveBackendConfig(backendConfig);
  }, [backendConfig]);

  const showToast = (text, type = 'success') => {
    setToast({ text, type });
    setTimeout(() => setToast(null), 3500);
  };

  const triggerAutoSyncIfEnabled = async (nextInvoices, nextProfile) => {
    if (!backendConfig.autoSync) return;
    try {
      if (
        backendConfig.activeMode === 'github' &&
        backendConfig.github?.token
      ) {
        await pushToGitHub(backendConfig.github, {
          invoices: nextInvoices,
          orgProfile: nextProfile,
        });
        showToast('Auto-synced invoices to GitHub repository');
      } else if (
        backendConfig.activeMode === 'gsheets' &&
        backendConfig.gsheets?.webAppUrl
      ) {
        await pushToGoogleSheets(backendConfig.gsheets, {
          invoices: nextInvoices,
          orgProfile: nextProfile,
        });
        showToast('Auto-synced invoices to Google Sheets');
      }
    } catch (err) {
      showToast(`Cloud auto-sync failed: ${err.message}`, 'error');
    }
  };

  const handleSaveInvoice = (invoiceRecord) => {
    let nextInvoices;
    const exists = invoices.some((i) => i.id === invoiceRecord.id);
    if (exists) {
      nextInvoices = invoices.map((i) =>
        i.id === invoiceRecord.id ? invoiceRecord : i
      );
      showToast(`Updated invoice ${invoiceRecord.invoiceNumber}`);
    } else {
      nextInvoices = [invoiceRecord, ...invoices];
      showToast(`Added invoice ${invoiceRecord.invoiceNumber} to ESG ledger`);
    }
    setInvoices(nextInvoices);
    setIsInvoiceModalOpen(false);
    setEditingInvoice(null);
    triggerAutoSyncIfEnabled(nextInvoices, orgProfile);
  };

  const handleDeleteInvoice = (id) => {
    const target = invoices.find((i) => i.id === id);
    const nextInvoices = invoices.filter((i) => i.id !== id);
    setInvoices(nextInvoices);
    showToast(`Deleted invoice ${target?.invoiceNumber || ''}`);
    triggerAutoSyncIfEnabled(nextInvoices, orgProfile);
  };

  const handleDuplicateInvoice = (inv) => {
    const copy = {
      ...inv,
      id: `inv-${Date.now()}`,
      invoiceNumber: `${inv.invoiceNumber}-COPY`,
    };
    setEditingInvoice(copy);
    setIsInvoiceModalOpen(true);
  };

  const handleBulkImport = (importedList) => {
    const nextInvoices = [...importedList, ...invoices];
    setInvoices(nextInvoices);
    showToast(`Imported ${importedList.length} utility invoices from CSV`);
    triggerAutoSyncIfEnabled(nextInvoices, orgProfile);
  };

  const handleResetDemoData = () => {
    setInvoices(INITIAL_SAMPLE_INVOICES);
    showToast('Restored sample FY2026 ESG invoice dataset');
  };

  const existingFacilities = useMemo(() => {
    const set = new Set(invoices.map((i) => i.facility).filter(Boolean));
    return Array.from(set);
  }, [invoices]);

  return (
    <div className="min-h-screen flex flex-col bg-slate-50 text-slate-900">
      {/* Top Navigation Header */}
      <header className="bg-slate-900 text-white border-b border-slate-800 sticky top-0 z-30 no-print">
        <div className="max-w-7xl mx-auto px-4 sm:px-6 py-3.5 flex flex-wrap items-center justify-between gap-4">
          {/* Brand Logo */}
          <div className="flex items-center gap-3">
            <div className="w-9 h-9 rounded-xl bg-emerald-500/20 border border-emerald-500/40 flex items-center justify-center text-emerald-400">
              <Leaf className="w-5 h-5" />
            </div>
            <div>
              <div className="flex items-center gap-2">
                <span className="font-bold text-base tracking-tight">
                  EcoLedger ESG
                </span>
                <span className="text-[11px] font-semibold uppercase px-2 py-0.5 rounded-full bg-emerald-500/20 text-emerald-300 border border-emerald-500/30">
                  Scope 1 · 2 · Water
                </span>
              </div>
              <p className="text-xs text-slate-400">
                Business Utility Invoice & GHG Disclosure Tracker
              </p>
            </div>
          </div>

          {/* Center Navigation Tabs */}
          <nav className="flex items-center gap-1 bg-slate-800/90 p-1 rounded-xl border border-slate-700">
            {[
              {
                id: 'dashboard',
                label: 'ESG Dashboard',
                icon: LayoutDashboard,
              },
              {
                id: 'invoices',
                label: `Utility Invoices (${invoices.length})`,
                icon: Receipt,
              },
              {
                id: 'esg-report',
                label: 'GRI / CSRD Disclosure',
                icon: FileSpreadsheet,
              },
            ].map((tab) => {
              const Icon = tab.icon;
              const active = activeTab === tab.id;
              return (
                <button
                  key={tab.id}
                  type="button"
                  onClick={() => setActiveTab(tab.id)}
                  className={`inline-flex items-center gap-2 px-3.5 py-1.5 rounded-lg text-xs font-semibold transition ${
                    active
                      ? 'bg-emerald-600 text-white shadow-xs'
                      : 'text-slate-300 hover:text-white hover:bg-slate-700/60'
                  }`}
                >
                  <Icon className="w-4 h-4" />
                  {tab.label}
                </button>
              );
            })}
          </nav>

          {/* Right Cloud Sync & Quick Add Actions */}
          <div className="flex items-center gap-2.5">
            <button
              type="button"
              onClick={() => setIsBackendModalOpen(true)}
              className="inline-flex items-center gap-2 px-3 py-2 rounded-lg text-xs font-semibold bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 transition"
              title="Configure GitHub API or Google Sheets Sync"
            >
              {backendConfig.activeMode === 'github' ? (
                <Github className="w-3.5 h-3.5 text-emerald-400" />
              ) : (
                <Cloud className="w-3.5 h-3.5 text-emerald-400" />
              )}
              <span>
                {backendConfig.activeMode === 'github'
                  ? 'GitHub Sync'
                  : backendConfig.activeMode === 'gsheets'
                  ? 'Sheets Sync'
                  : 'Cloud Backend'}
              </span>
            </button>

            <button
              type="button"
              onClick={() => {
                setEditingInvoice(null);
                setIsInvoiceModalOpen(true);
              }}
              className="inline-flex items-center gap-1.5 px-3.5 py-2 rounded-lg text-xs font-semibold bg-emerald-600 hover:bg-emerald-500 text-white shadow-xs transition"
            >
              <Plus className="w-4 h-4" />
              New Invoice
            </button>
          </div>
        </div>
      </header>

      {/* Toast Notification */}
      {toast && (
        <div className="fixed bottom-5 right-5 z-50 no-print">
          <div
            className={`px-4 py-3 rounded-xl shadow-lg border text-xs font-semibold flex items-center gap-2 ${
              toast.type === 'error'
                ? 'bg-red-900 text-white border-red-700'
                : 'bg-slate-900 text-emerald-300 border-slate-700'
            }`}
          >
            <span>{toast.text}</span>
          </div>
        </div>
      )}

      {/* Main Content Container */}
      <main className="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 py-6">
        {activeTab === 'dashboard' && (
          <DashboardView
            invoices={invoices}
            orgProfile={orgProfile}
            onUpdateOrgProfile={setOrgProfile}
            selectedFacility={selectedFacility}
            onSelectFacility={setSelectedFacility}
            selectedYear={selectedYear}
            onSelectYear={setSelectedYear}
            onOpenNewInvoice={() => {
              setEditingInvoice(null);
              setIsInvoiceModalOpen(true);
            }}
            onSwitchTab={setActiveTab}
          />
        )}

        {activeTab === 'invoices' && (
          <InvoiceTable
            invoices={invoices}
            onAddInvoice={() => {
              setEditingInvoice(null);
              setIsInvoiceModalOpen(true);
            }}
            onEditInvoice={(inv) => {
              setEditingInvoice(inv);
              setIsInvoiceModalOpen(true);
            }}
            onDuplicateInvoice={handleDuplicateInvoice}
            onDeleteInvoice={handleDeleteInvoice}
            onBulkImport={handleBulkImport}
          />
        )}

        {activeTab === 'esg-report' && (
          <EsgReportView
            invoices={invoices}
            orgProfile={orgProfile}
            onUpdateOrgProfile={setOrgProfile}
          />
        )}
      </main>

      {/* Footer */}
      <footer className="bg-white border-t border-slate-200 py-4 px-6 text-xs text-slate-500 no-print">
        <div className="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-3">
          <div>
            <strong>EcoLedger ESG</strong> · Built for static hosting on GitHub
            Pages with GitHub REST API & Google Sheets persistence.
          </div>
          <div className="flex items-center gap-4">
            <button
              type="button"
              onClick={handleResetDemoData}
              className="inline-flex items-center gap-1 text-slate-500 hover:text-slate-800"
            >
              <RotateCcw className="w-3.5 h-3.5" />
              Reset Sample Dataset
            </button>
          </div>
        </div>
      </footer>

      {/* Modals */}
      <InvoiceModal
        isOpen={isInvoiceModalOpen}
        onClose={() => {
          setIsInvoiceModalOpen(false);
          setEditingInvoice(null);
        }}
        onSave={handleSaveInvoice}
        editingInvoice={editingInvoice}
        existingFacilities={existingFacilities}
      />

      <BackendConfigModal
        isOpen={isBackendModalOpen}
        onClose={() => setIsBackendModalOpen(false)}
        backendConfig={backendConfig}
        onSaveConfig={setBackendConfig}
        invoices={invoices}
        orgProfile={orgProfile}
        onRestoreRemoteData={(remoteInvoices, remoteProfile) => {
          setInvoices(remoteInvoices);
          if (remoteProfile) {
            setOrgProfile((prev) => ({ ...prev, ...remoteProfile }));
          }
        }}
      />
    </div>
  );
}


ReactDOM.createRoot(document.getElementById('root')).render(<App />);

    </script>
  </body>
