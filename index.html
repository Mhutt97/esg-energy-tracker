/**
 * Calculates normalized energy (kWh), normalized water (m³), and GHG emissions (tCO2e)
 * using UK DEFRA conversion factors.
 */
function calculateInvoiceEsgMetrics(invoice) {
  const usage = Math.max(0, Number(invoice.usage ?? invoice.quantity) || 0);
  const category = invoice.category || 'electricity';

  if (category === 'electricity') {
    const unitObj =
      UTILITY_CATEGORIES.electricity.units.find((u) => u.id === invoice.unit) ||
      UTILITY_CATEGORIES.electricity.units[0];
    const normalizedEnergyKwh = usage * unitObj.toKwh;
    const factor = UTILITY_CATEGORIES.electricity.kgCo2ePerKwh;
    const co2eTonnes = (normalizedEnergyKwh * factor) / 1000;

    return {
      scope: 'Scope 2',
      normalizedEnergyKwh,
      normalizedWaterM3: 0,
      co2eTonnes,
      effectiveFactorLabel: `${factor.toFixed(3)} kgCO₂e/kWh (UK DEFRA)`,
    };
  }

  if (category === 'natural_gas') {
    const unitObj =
      UTILITY_CATEGORIES.natural_gas.units.find((u) => u.id === invoice.unit) ||
      UTILITY_CATEGORIES.natural_gas.units[0];
    const normalizedEnergyKwh = usage * unitObj.toKwh;

    let totalKgCo2e = 0;
    if (unitObj.kgCo2ePerUnitOverride) {
      totalKgCo2e = usage * unitObj.kgCo2ePerUnitOverride;
    } else {
      totalKgCo2e =
        normalizedEnergyKwh * UTILITY_CATEGORIES.natural_gas.kgCo2ePerKwh;
    }

    const co2eTonnes = totalKgCo2e / 1000;

    return {
      scope: 'Scope 1',
      normalizedEnergyKwh,
      normalizedWaterM3: 0,
      co2eTonnes,
      effectiveFactorLabel: `${UTILITY_CATEGORIES.natural_gas.kgCo2ePerKwh.toFixed(
        4
      )} kgCO₂e/kWh (UK DEFRA)`,
    };
  }

  // Water & Wastewater
  const unitObj =
    UTILITY_CATEGORIES.water.units.find((u) => u.id === invoice.unit) ||
    UTILITY_CATEGORIES.water.units[0];
  const normalizedWaterM3 = usage * unitObj.toM3;
  const factorPerM3 = UTILITY_CATEGORIES.water.kgCo2ePerM3;
  const co2eTonnes = (normalizedWaterM3 * factorPerM3) / 1000;

  return {
    scope: 'Water',
    normalizedEnergyKwh: 0,
    normalizedWaterM3,
    co2eTonnes,
    effectiveFactorLabel: `${factorPerM3.toFixed(3)} kgCO₂e/m³ (UK DEFRA)`,
  };
}

/**
 * UTF-8 safe Base64 helpers for GitHub Contents API
 */
function utf8ToBase64(str) {
  const bytes = new TextEncoder().encode(str);
  let binary = '';
  for (let i = 0; i < bytes.byteLength; i++) {
    binary += String.fromCharCode(bytes[i]);
  }
  return btoa(binary);
}

function base64ToUtf8(base64) {
  const clean = base64.replace(/\s/g, '');
  const binary = atob(clean);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) {
    bytes[i] = binary.charCodeAt(i);
  }
  return new TextDecoder().decode(bytes);
}

/**
 * GitHub API Integration — Pulls JSON file from repository
 */
async function pullFromGitHub(ghConfig) {
  const { owner, repo, branch = 'main', filePath, token } = ghConfig;
  if (!owner || !repo || !filePath || !token) {
    throw new Error(
      'Please provide GitHub Owner, Repository, File Path, and Personal Access Token.'
    );
  }

  const cleanPath = filePath.replace(/^\/+/, '');
  const url = `https://api.github.com/repos/${encodeURIComponent(
    owner.trim()
  )}/${encodeURIComponent(repo.trim())}/contents/${cleanPath}?ref=${encodeURIComponent(
    branch.trim()
  )}`;

  const res = await fetch(url, {
    headers: {
      Accept: 'application/vnd.github+json',
      Authorization: `Bearer ${token.trim()}`,
      'X-GitHub-Api-Version': '2022-11-28',
    },
  });

  if (res.status === 404) {
    throw new Error(
      `File "${cleanPath}" not found on branch "${branch}". Click "Commit & Push Invoices to GitHub" first to initialize it.`
    );
  }

  if (!res.ok) {
    const errBody = await res.json().catch(() => ({}));
    throw new Error(
      errBody.message || `GitHub API returned HTTP ${res.status}`
    );
  }

  const data = await res.json();
  const decodedContent = base64ToUtf8(data.content);
  const parsed = JSON.parse(decodedContent);

  return {
    invoices: Array.isArray(parsed.invoices) ? parsed.invoices : [],
    orgProfile: parsed.orgProfile || DEFAULT_ORG_PROFILE,
    sha: data.sha,
    htmlUrl: data.html_url,
  };
}

/**
 * GitHub API Integration — Commits JSON database directly to the repository
 */
async function pushToGitHub(ghConfig, payload) {
  const { owner, repo, branch = 'main', filePath, token } = ghConfig;
  if (!owner || !repo || !filePath || !token) {
    throw new Error(
      'Please provide GitHub Owner, Repository, File Path, and Personal Access Token.'
    );
  }

  const cleanPath = filePath.replace(/^\/+/, '');
  const baseUrl = `https://api.github.com/repos/${encodeURIComponent(
    owner.trim()
  )}/${encodeURIComponent(repo.trim())}/contents/${cleanPath}`;

  const headers = {
    Accept: 'application/vnd.github+json',
    Authorization: `Bearer ${token.trim()}`,
    'X-GitHub-Api-Version': '2022-11-28',
  };

  let existingSha = null;
  const getRes = await fetch(
    `${baseUrl}?ref=${encodeURIComponent(branch.trim())}`,
    { headers }
  );

  if (getRes.ok) {
    const existingData = await getRes.json();
    existingSha = existingData.sha;
  } else if (getRes.status !== 404) {
    const errBody = await getRes.json().catch(() => ({}));
    throw new Error(
      errBody.message || `Failed to inspect GitHub file (HTTP ${getRes.status})`
    );
  }

  const enrichedPayload = {
    schemaVersion: '2.0',
    updatedAt: new Date().toISOString(),
    orgProfile: payload.orgProfile,
    invoices: payload.invoices.map((inv) => ({
      ...inv,
      calculatedEsg: calculateInvoiceEsgMetrics(inv),
    })),
  };

  const jsonString = JSON.stringify(enrichedPayload, null, 2);
  const body = {
    message: `chore(esg): sync ${payload.invoices.length} utility invoices via EcoLedger ESG Tracker`,
    content: utf8ToBase64(jsonString),
    branch: branch.trim(),
  };

  if (existingSha) {
    body.sha = existingSha;
  }

  const putRes = await fetch(baseUrl, {
    method: 'PUT',
    headers: {
      ...headers,
      'Content-Type': 'application/json',
    },
    body: JSON.stringify(body),
  });

  if (!putRes.ok) {
    const errBody = await putRes.json().catch(() => ({}));
    throw new Error(
      errBody.message || `GitHub commit failed (HTTP ${putRes.status})`
    );
  }

  const result = await putRes.json();
  return {
    commitSha: result.commit?.sha,
    htmlUrl: result.content?.html_url,
  };
}

/**
 * Google Sheets Apps Script Webhook Integration — Pulls rows from Google Sheet
 */
async function pullFromGoogleSheets(gsConfig) {
  const { webAppUrl } = gsConfig;
  if (!webAppUrl || !webAppUrl.startsWith('https://')) {
    throw new Error(
      'Please enter a valid Google Apps Script Web App URL starting with https://'
    );
  }

  const res = await fetch(webAppUrl.trim(), {
    method: 'GET',
    redirect: 'follow',
  });

  if (!res.ok) {
    throw new Error(`Google Sheets Web App returned HTTP ${res.status}`);
  }

  const data = await res.json();
  if (data.error) {
    throw new Error(data.error);
  }

  return {
    invoices: Array.isArray(data.invoices) ? data.invoices : [],
    orgProfile: data.orgProfile || null,
  };
}

/**
 * Google Sheets Apps Script Webhook Integration — Pushes rows to Google Sheet
 */
async function pushToGoogleSheets(gsConfig, payload) {
  const { webAppUrl } = gsConfig;
  if (!webAppUrl || !webAppUrl.startsWith('https://')) {
    throw new Error(
      'Please enter a valid Google Apps Script Web App URL starting with https://'
    );
  }

  const enrichedInvoices = payload.invoices.map((inv) => {
    const metrics = calculateInvoiceEsgMetrics(inv);
    return {
      ...inv,
      scope: metrics.scope,
      normalizedEnergyKwh: Number(metrics.normalizedEnergyKwh.toFixed(2)),
      normalizedWaterM3: Number(metrics.normalizedWaterM3.toFixed(2)),
      co2eTonnes: Number(metrics.co2eTonnes.toFixed(4)),
    };
  });

  const res = await fetch(webAppUrl.trim(), {
    method: 'POST',
    redirect: 'follow',
    headers: {
      'Content-Type': 'text/plain;charset=utf-8',
    },
    body: JSON.stringify({
      action: 'syncAll',
      updatedAt: new Date().toISOString(),
      orgProfile: payload.orgProfile,
      invoices: enrichedInvoices,
    }),
  });

  if (!res.ok) {
    throw new Error(`Google Sheets sync failed with HTTP ${res.status}`);
  }

  const result = await res.json();
  if (result.error) {
    throw new Error(result.error);
  }
  return result;
}

/**
 * Generates an audit-ready CSV string from invoices (GBP £)
 */
function exportInvoicesToCsv(invoices) {
  const headers = [
    'Invoice ID',
    'Invoice Number',
    'Site Name',
    'Supplier',
    'Category',
    'ESG Scope',
    'Billing Start',
    'Billing End',
    'Usage',
    'Unit',
    'Normalized Energy (kWh)',
    'Normalized Water (m3)',
    'GHG Emissions (tCO2e)',
    'Net Cost (GBP)',
    'VAT Rate (%)',
    'VAT Amount (GBP)',
    'Gross Cost (GBP)',
    'Currency',
    'Reading Type',
    'Notes',
  ];

  const escapeCsv = (val) => {
    if (val === null || val === undefined) return '';
    const str = String(val);
    if (str.includes(',') || str.includes('"') || str.includes('\n')) {
      return `"${str.replace(/"/g, '""')}"`;
    }
    return str;
  };

  const rows = invoices.map((inv) => {
    const metrics = calculateInvoiceEsgMetrics(inv);
    const catName = UTILITY_CATEGORIES[inv.category]?.name || inv.category;
    const usageVal = Number(inv.usage ?? inv.quantity) || 0;
    const netVal = Number(inv.netCost ?? inv.cost) || 0;
    const vatRateVal = Number(inv.vatRate ?? 20);
    const vatAmtVal =
      inv.vatAmount !== undefined
        ? Number(inv.vatAmount)
        : netVal * (vatRateVal / 100);
    const grossVal =
      inv.grossCost !== undefined ? Number(inv.grossCost) : netVal + vatAmtVal;

    return [
      inv.id,
      inv.invoiceNumber,
      inv.siteName || inv.facility || SITES[0],
      inv.supplier || SUPPLIERS[0],
      catName,
      metrics.scope,
      inv.billingPeriodStart,
      inv.billingPeriodEnd,
      usageVal,
      inv.unit,
      metrics.normalizedEnergyKwh.toFixed(2),
      metrics.normalizedWaterM3.toFixed(2),
      metrics.co2eTonnes.toFixed(4),
      netVal.toFixed(2),
      vatRateVal,
      vatAmtVal.toFixed(2),
      grossVal.toFixed(2),
      'GBP',
      inv.readingType || 'Actual',
      inv.notes || '',
    ]
      .map(escapeCsv)
      .join(',');
  });

  return [headers.join(','), ...rows].join('\n');
}

/**
 * Parses a CSV file string into UK invoice records
 */
function parseCsvToInvoices(csvText) {
  const lines = csvText
    .split(/\r?\n/)
    .map((l) => l.trim())
    .filter(Boolean);
  if (lines.length < 2) {
    throw new Error(
      'CSV file must include a header row and at least one data row.'
    );
  }

  const parseLine = (line) => {
    const result = [];
    let current = '';
    let inQuotes = false;
    for (let i = 0; i < line.length; i++) {
      const ch = line[i];
      if (ch === '"') {
        if (inQuotes && line[i + 1] === '"') {
          current += '"';
          i++;
        } else {
          inQuotes = !inQuotes;
        }
      } else if (ch === ',' && !inQuotes) {
        result.push(current.trim());
        current = '';
      } else {
        current += ch;
      }
    }
    result.push(current.trim());
    return result;
  };

  const headers = parseLine(lines[0]).map((h) => h.toLowerCase());
  const findCol = (candidates) =>
    headers.findIndex((h) => candidates.some((c) => h.includes(c)));

  const idxInvNum = findCol(['invoice number', 'invoice #', 'invoice_number']);
  const idxSite = findCol(['site name', 'site', 'facility', 'location']);
  const idxSupplier = findCol(['supplier', 'provider', 'utility']);
  const idxCategory = findCol(['category', 'type', 'utility type']);
  const idxStart = findCol(['billing start', 'start date', 'period start']);
  const idxEnd = findCol(['billing end', 'end date', 'period end']);
  const idxUsage = findCol(['usage', 'quantity', 'consumption']);
  const idxUnit = findCol(['unit', 'uom']);
  const idxNet = findCol(['net cost', 'net', 'cost']);
  const idxVatRate = findCol(['vat rate', 'vat %']);
  const idxReading = findCol(['reading type', 'reading', 'status']);
  const idxNotes = findCol(['notes', 'comment']);

  const imported = [];
  for (let i = 1; i < lines.length; i++) {
    const cols = parseLine(lines[i]);
    if (cols.length < 3) continue;

    const rawCat = (idxCategory >= 0 ? cols[idxCategory] : '').toLowerCase();
    let category = 'electricity';
    if (
      rawCat.includes('gas') ||
      rawCat.includes('fuel') ||
      rawCat.includes('therm')
    ) {
      category = 'natural_gas';
    } else if (rawCat.includes('water')) {
      category = 'water';
    }

    const defaultUnit =
      category === 'electricity'
        ? 'kWh'
        : category === 'natural_gas'
        ? 'kWh'
        : 'm3';

    const netCost = Number(idxNet >= 0 ? cols[idxNet] : 0) || 0;
    const rawVat = idxVatRate >= 0 ? Number(cols[idxVatRate]) : 20;
    const vatRate = [20, 5, 0].includes(rawVat) ? rawVat : 20;
    const vatAmount = Number((netCost * (vatRate / 100)).toFixed(2));
    const grossCost = Number((netCost + vatAmount).toFixed(2));

    const rawReading = (idxReading >= 0 ? cols[idxReading] : '').toLowerCase();
    const readingType = rawReading.includes('est') ? 'Estimated' : 'Actual';

    imported.push({
      id: `inv-csv-${Date.now()}-${i}`,
      invoiceNumber: (idxInvNum >= 0 && cols[idxInvNum]) || `INV-${1000 + i}`,
      siteName: (idxSite >= 0 && cols[idxSite]) || SITES[0],
      supplier: (idxSupplier >= 0 && cols[idxSupplier]) || SUPPLIERS[0],
      category,
      billingPeriodStart: (idxStart >= 0 && cols[idxStart]) || '2026-01-01',
      billingPeriodEnd: (idxEnd >= 0 && cols[idxEnd]) || '2026-01-31',
      usage: Number(idxUsage >= 0 ? cols[idxUsage] : 0) || 0,
      unit: (idxUnit >= 0 && cols[idxUnit]) || defaultUnit,
      netCost,
      vatRate,
      vatAmount,
      grossCost,
      currency: 'GBP',
      readingType,
      notes: (idxNotes >= 0 && cols[idxNotes]) || '',
    });
  }

  return imported;
}

function DashboardView({
  invoices,
  orgProfile,
  selectedSite,
  onSelectSite,
  selectedYear,
  onSelectYear,
  onOpenNewInvoice,
}) {
  const siteOptions = ['All Sites', ...SITES];

  const years = useMemo(() => {
    const set = new Set(
      invoices
        .map((i) => (i.billingPeriodStart || '').slice(0, 4))
        .filter((y) => y.length === 4)
    );
    set.add(orgProfile.reportingYear || '2026');
    return ['All Years', ...Array.from(set).sort().reverse()];
  }, [invoices, orgProfile.reportingYear]);

  const filteredInvoices = useMemo(() => {
    return invoices.filter((inv) => {
      const invSite = inv.siteName || inv.facility || SITES[0];
      const matchSite =
        selectedSite === 'All Sites' || invSite === selectedSite;
      const invYear = (inv.billingPeriodStart || '').slice(0, 4);
      const matchYear =
        selectedYear === 'All Years' || invYear === selectedYear;
      return matchSite && matchYear;
    });
  }, [invoices, selectedSite, selectedYear]);

  const summary = useMemo(() => {
    let scope1Tonnes = 0;
    let scope2Tonnes = 0;
    let waterTonnes = 0;

    let electricityKwh = 0;
    let fuelKwhEq = 0;
    let waterM3 = 0;

    let totalNet = 0;
    let totalVat = 0;
    let totalGross = 0;
    let actualReadingCount = 0;

    const monthlyMap = {};
    const siteMap = {};
    SITES.forEach((s) => {
      siteMap[s] = {
        siteName: s,
        scope1: 0,
        scope2: 0,
        waterTonnes: 0,
        waterM3: 0,
        energyMwh: 0,
        grossCost: 0,
        invoiceCount: 0,
      };
    });

    filteredInvoices.forEach((inv) => {
      const m = calculateInvoiceEsgMetrics(inv);
      const net = Number(inv.netCost ?? inv.cost) || 0;
      const vatRate = inv.vatRate !== undefined ? Number(inv.vatRate) : 20;
      const vat =
        inv.vatAmount !== undefined
          ? Number(inv.vatAmount)
          : net * (vatRate / 100);
      const gross =
        inv.grossCost !== undefined ? Number(inv.grossCost) : net + vat;

      totalNet += net;
      totalVat += vat;
      totalGross += gross;

      if ((inv.readingType || 'Actual') === 'Actual') {
        actualReadingCount++;
      }

      if (inv.category === 'electricity') {
        scope2Tonnes += m.co2eTonnes;
        electricityKwh += m.normalizedEnergyKwh;
      } else if (inv.category === 'natural_gas') {
        scope1Tonnes += m.co2eTonnes;
        fuelKwhEq += m.normalizedEnergyKwh;
      } else if (inv.category === 'water') {
        waterTonnes += m.co2eTonnes;
        waterM3 += m.normalizedWaterM3;
      }

      const monthKey = (inv.billingPeriodStart || '2026-01').slice(0, 7);
      if (!monthlyMap[monthKey]) {
        monthlyMap[monthKey] = {
          month: monthKey,
          scope1: 0,
          scope2: 0,
          waterTonnes: 0,
          energyKwh: 0,
          grossCost: 0,
        };
      }
      if (inv.category === 'natural_gas') {
        monthlyMap[monthKey].scope1 += m.co2eTonnes;
      } else if (inv.category === 'electricity') {
        monthlyMap[monthKey].scope2 += m.co2eTonnes;
      } else {
        monthlyMap[monthKey].waterTonnes += m.co2eTonnes;
      }
      monthlyMap[monthKey].energyKwh += m.normalizedEnergyKwh;
      monthlyMap[monthKey].grossCost += gross;

      const site = inv.siteName || inv.facility || SITES[0];
      if (!siteMap[site]) {
        siteMap[site] = {
          siteName: site,
          scope1: 0,
          scope2: 0,
          waterTonnes: 0,
          waterM3: 0,
          energyMwh: 0,
          grossCost: 0,
          invoiceCount: 0,
        };
      }
      siteMap[site].invoiceCount += 1;
      siteMap[site].grossCost += gross;
      siteMap[site].energyMwh += m.normalizedEnergyKwh / 1000;
      siteMap[site].waterM3 += m.normalizedWaterM3;
      if (inv.category === 'natural_gas') {
        siteMap[site].scope1 += m.co2eTonnes;
      } else if (inv.category === 'electricity') {
        siteMap[site].scope2 += m.co2eTonnes;
      } else {
        siteMap[site].waterTonnes += m.co2eTonnes;
      }
    });

    const totalGhgTonnes = scope1Tonnes + scope2Tonnes + waterTonnes;
    const totalEnergyMwh = (electricityKwh + fuelKwhEq) / 1000;

    const monthlySeries = Object.values(monthlyMap).sort((a, b) =>
      a.month.localeCompare(b.month)
    );
    const siteSeries = Object.values(siteMap);

    return {
      scope1Tonnes,
      scope2Tonnes,
      waterTonnes,
      totalGhgTonnes,
      electricityKwh,
      fuelKwhEq,
      totalEnergyMwh,
      waterM3,
      totalNet,
      totalVat,
      totalGross,
      actualReadingCount,
      monthlySeries,
      siteSeries,
    };
  }, [filteredInvoices]);

  const maxMonthTonnes = Math.max(
    1,
    ...summary.monthlySeries.map((m) => m.scope1 + m.scope2 + m.waterTonnes)
  );

function InvoiceTable({
  invoices,
  onAddInvoice,
  onEditInvoice,
  onDuplicateInvoice,
  onDeleteInvoice,
  onBulkImport,
}) {
  const [searchQuery, setSearchQuery] = useState('');
  const [categoryFilter, setCategoryFilter] = useState('all');
  const [siteFilter, setSiteFilter] = useState('all');
  const [supplierFilter, setSupplierFilter] = useState('all');
  const [readingFilter, setReadingFilter] = useState('all');
  const [importError, setImportError] = useState('');
  const fileInputRef = useRef(null);

  const filtered = useMemo(() => {
    return invoices
      .filter((inv) => {
        const invSite = inv.siteName || inv.facility || '';
        const invReading = inv.readingType || 'Actual';

        if (categoryFilter !== 'all' && inv.category !== categoryFilter) {
          return false;
        }
        if (siteFilter !== 'all' && invSite !== siteFilter) {
          return false;
        }
        if (supplierFilter !== 'all' && inv.supplier !== supplierFilter) {
          return false;
        }
        if (readingFilter !== 'all' && invReading !== readingFilter) {
          return false;
        }
        if (searchQuery.trim()) {
          const q = searchQuery.toLowerCase();
          const hay = [inv.invoiceNumber, inv.supplier, invSite, inv.notes]
            .filter(Boolean)
            .join(' ')
            .toLowerCase();
          if (!hay.includes(q)) return false;
        }
        return true;
      })
      .sort((a, b) =>
        (b.billingPeriodStart || '').localeCompare(a.billingPeriodStart || '')
      );
  }, [
    invoices,
    categoryFilter,
    siteFilter,
    supplierFilter,
    readingFilter,
    searchQuery,
  ]);

  const handleDownloadCsv = () => {
    const csvContent = exportInvoicesToCsv(filtered);
    const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `uk-esg-utility-invoices-${new Date()
      .toISOString()
      .slice(0, 10)}.csv`;
    a.click();
    URL.revokeObjectURL(url);
  };

  const handleDownloadTemplate = () => {
    const sampleTemplate = [
      'Invoice Number,Site Name,Supplier,Category,Billing Start,Billing End,Usage,Unit,Net Cost,VAT Rate,Reading Type,Notes',
      'INV-2026-001,Head Office London,Octopus,Electricity,2026-01-01,2026-01-31,14500,kWh,3190.00,20,Actual,January electricity bill',
      'INV-2026-002,Office Sheffield,EDF,Natural Gas,2026-01-01,2026-01-31,4200,kWh,336.00,5,Actual,De minimis 5% VAT rate',
      'INV-2026-003,Office Leeds,EON,Electricity,2026-01-01,2026-01-31,8900,kWh,1958.00,20,Estimated,Estimated meter reading',
    ].join('\n');

    const blob = new Blob([sampleTemplate], {
      type: 'text/csv;charset=utf-8;',
    });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'uk-esg-invoice-import-template.csv';
    a.click();
    URL.revokeObjectURL(url);
  };

  const handleFileUpload = (e) => {
    setImportError('');
    const file = e.target.files?.[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = (event) => {
      try {
        const text = String(event.target?.result || '');
        const parsed = parseCsvToInvoices(text);
        if (parsed.length === 0) {
          setImportError('No valid invoice rows found in CSV.');
          return;
        }
        onBulkImport(parsed);
      } catch (err) {
        setImportError(err.message || 'Failed to parse CSV file.');
      } finally {
        if (fileInputRef.current) fileInputRef.current.value = '';
      }
    };
    reader.readAsText(file);
  };

  const getCategoryIcon = (cat) => {
    if (cat === 'electricity')
      return <Zap className="w-4 h-4 text-blue-600 shrink-0" />;
    if (cat === 'natural_gas')
      return <Flame className="w-4 h-4 text-amber-600 shrink-0" />;
    return <Droplets className="w-4 h-4 text-cyan-600 shrink-0" />;
  };

  return (
    <div className="space-y-4">
      {/* Toolbar */}
      <div className="bg-white rounded-xl border border-slate-200 p-4 shadow-sm space-y-3">
        <div className="flex flex-wrap items-center justify-between gap-3">
          {/* Search Input */}
          <div className="relative flex-1 min-w-[240px]">
            <Search className="w-4 h-4 text-slate-400 absolute left-3 top-1/2 -translate-y-1/2" />
            <input
              type="text"
              value={searchQuery}
              onChange={(e) => setSearchQuery(e.target.value)}
              placeholder="Search by invoice #, supplier, site name, or notes..."
              className="w-full pl-9 pr-3 py-2 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500"
            />
          </div>

          {/* Action Buttons */}
          <div className="flex flex-wrap items-center gap-2">
            <input
              ref={fileInputRef}

            <tbody className="divide-y divide-slate-200 text-sm">
              {filtered.length === 0 ? (
                <tr>
                  <td
                    colSpan={10}
                    className="py-12 text-center text-slate-400 text-sm"
                  >
                    <div>No utility invoices logged yet.</div>
                    <button
                      type="button"
                      onClick={onAddInvoice}
                      className="mt-2 text-emerald-600 font-semibold hover:underline"
                    >
                      + Log your first utility invoice
                    </button>
                  </td>
                </tr>
              ) : (
                filtered.map((inv) => {
                  const m = calculateInvoiceEsgMetrics(inv);
                  const catName =
                    UTILITY_CATEGORIES[inv.category]?.name || inv.category;
                  const siteName = inv.siteName || inv.facility || SITES[0];
                  const usageVal = Number(inv.usage ?? inv.quantity) || 0;
                  const netVal = Number(inv.netCost ?? inv.cost) || 0;
                  const vatRateVal =
                    inv.vatRate !== undefined ? Number(inv.vatRate) : 20;
                  const vatAmtVal =
                    inv.vatAmount !== undefined
                      ? Number(inv.vatAmount)
                      : netVal * (vatRateVal / 100);
                  const grossVal =
                    inv.grossCost !== undefined
                      ? Number(inv.grossCost)
                      : netVal + vatAmtVal;
                  const readingType = inv.readingType || 'Actual';

                  return (
                    <tr
                      key={inv.id}
                      className="hover:bg-slate-50/80 transition"
                    >
                      <td className="py-3 px-4">
                        <div className="font-semibold text-slate-900">
                          {inv.invoiceNumber}
                        </div>
                        <div className="text-xs text-slate-500">
                          {inv.billingPeriodStart} → {inv.billingPeriodEnd}
                        </div>
                      </td>

                      <td className="py-3 px-4">
                        <div className="font-medium text-slate-800">
                          {siteName}
                        </div>
                        <div className="text-xs text-slate-500">
                          {inv.supplier}
                        </div>
                      </td>

                      <td className="py-3 px-4">
                        <div className="flex items-center gap-2">
                          {getCategoryIcon(inv.category)}
                          <div>
                            <div className="font-medium text-slate-800 text-xs">
                              {catName}
                            </div>
                            <div className="text-[11px] text-slate-500">
                              {m.scope}
                            </div>
                          </div>
                        </div>
                      </td>

                      <td className="py-3 px-4 text-right">
                        <div className="font-semibold text-slate-900">
                          {usageVal.toLocaleString()} {inv.unit}
                        </div>
                        <div className="text-[11px] text-slate-500">
                          {inv.category !== 'water'
                            ? `${(m.normalizedEnergyKwh / 1000).toFixed(2)} MWh`
                            : `${m.normalizedWaterM3.toFixed(1)} m³`}
                        </div>
                      </td>

                      <td className="py-3 px-4 text-right">
                        <span className="font-bold text-emerald-700">
                          {m.co2eTonnes.toFixed(3)}
                        </span>{' '}
                        <span className="text-xs text-slate-400">tCO₂e</span>
                      </td>

                      <td className="py-3 px-4 text-right font-medium text-slate-700">
                        £
                        {netVal.toLocaleString(undefined, {
                          minimumFractionDigits: 2,
                          maximumFractionDigits: 2,
                        })}
                      </td>

                      <td className="py-3 px-4 text-right">
                        <div className="font-medium text-slate-700">
                          £
                          {vatAmtVal.toLocaleString(undefined, {
                            minimumFractionDigits: 2,
                            maximumFractionDigits: 2,
                          })}
                        </div>
                        <div className="text-[11px] text-slate-400">
                          {vatRateVal}% VAT
                        </div>
                      </td>

                      <td className="py-3 px-4 text-right font-bold text-slate-900">
                        £
                        {grossVal.toLocaleString(undefined, {
                          minimumFractionDigits: 2,
                          maximumFractionDigits: 2,
                        })}
                      </td>

                      <td className="py-3 px-4">
                        {readingType === 'Actual' ? (
                          <span className="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-xs font-medium bg-emerald-50 text-emerald-700 border border-emerald-200">
                            <CheckCircle2 className="w-3 h-3" />
                            Actual
                          </span>
                        ) : (
                          <span className="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-xs font-medium bg-amber-50 text-amber-700 border border-amber-200">
                            <Clock className="w-3 h-3" />
                            Estimated
                          </span>
                        )}
                      </td>

                      <td className="py-3 px-4 text-right">
                        <div className="inline-flex items-center gap-1">
                          <button
                            type="button"
                            onClick={() => onEditInvoice(inv)}
                            className="p-1.5 text-slate-500 hover:text-slate-900 hover:bg-slate-100 rounded-md"
                            title="Edit invoice"
                          >
                            <Edit3 className="w-4 h-4" />
                          </button>
                          <button
                            type="button"
                            onClick={() => onDuplicateInvoice(inv)}
                            className="p-1.5 text-slate-500 hover:text-blue-600 hover:bg-blue-50 rounded-md"
                            title="Duplicate invoice for next billing cycle"
                          >
                            <Copy className="w-4 h-4" />
                          </button>
                          <button
                            type="button"
                            onClick={() => onDeleteInvoice(inv.id)}
                            className="p-1.5 text-slate-500 hover:text-red-600 hover:bg-red-50 rounded-md"
                            title="Delete invoice"
                          >
                            <Trash2 className="w-4 h-4" />
                          </button>
                        </div>
                      </td>
                    </tr>
                  );
                })
              )}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
}

function BackendConfigModal({
  isOpen,
  onClose,
  backendConfig,
  onSaveConfig,
  invoices,
  orgProfile,
  onRestoreRemoteData,
}) {
  const [config, setConfig] = useState(backendConfig);
  const [activeTab, setActiveTab] = useState(
    backendConfig.activeMode === 'gsheets' ? 'gsheets' : 'github'
  );
  const [loading, setLoading] = useState(false);
  const [statusMsg, setStatusMsg] = useState(null);
  const [copiedScript, setCopiedScript] = useState(false);

  if (!isOpen) return null;

  const updateGithub = (field, value) => {
    setConfig((prev) => ({
      ...prev,
      github: { ...prev.github, [field]: value },
    }));
  };

  const updateGsheets = (field, value) => {
    setConfig((prev) => ({
      ...prev,
      gsheets: { ...prev.gsheets, [field]: value },
    }));
  };

  const handlePersistConfig = (nextConfig) => {
    setConfig(nextConfig);
    onSaveConfig(nextConfig);
  };

  const handleGitHubPush = async () => {
    setLoading(true);
    setStatusMsg(null);
    try {
      const res = await pushToGitHub(config.github, { invoices, orgProfile });
      const updated = {
        ...config,
        activeMode: 'github',
        lastSyncedAt: new Date().toISOString(),
      };
      handlePersistConfig(updated);
      setStatusMsg({
        type: 'success',
        text: `Committed ${invoices.length} invoices to ${config.github.owner}/${config.github.repo} (${config.github.filePath}).`,
        url: res.htmlUrl,
      });
    } catch (err) {
      setStatusMsg({ type: 'error', text: err.message });
    } finally {
      setLoading(false);
    }
  };

  const handleGitHubPull = async () => {
    setLoading(true);
    setStatusMsg(null);
    try {
      const res = await pullFromGitHub(config.github);
      onRestoreRemoteData(res.invoices, res.orgProfile);
      const updated = {
        ...config,
        activeMode: 'github',
        lastSyncedAt: new Date().toISOString(),
      };
      handlePersistConfig(updated);
      setStatusMsg({
        type: 'success',
        text: `Loaded ${res.invoices.length} invoices from GitHub repository.`,
      });
    } catch (err) {
      setStatusMsg({ type: 'error', text: err.message });
    } finally {
      setLoading(false);
    }
  };

  const handleGoogleSheetsPush = async () => {
    setLoading(true);
    setStatusMsg(null);
    try {
      await pushToGoogleSheets(config.gsheets, { invoices, orgProfile });
      const updated = {
        ...config,
        activeMode: 'gsheets',
        lastSyncedAt: new Date().toISOString(),

      handlePersistConfig(updated);
      setStatusMsg({
        type: 'success',
        text: `Synced ${invoices.length} invoices to Google Sheets ('ESG_Invoices' tab).`,
      });
    } catch (err) {
      setStatusMsg({ type: 'error', text: err.message });
    } finally {
      setLoading(false);
    }

  const handleGoogleSheetsPull = async () => {
    setLoading(true);
    setStatusMsg(null);
    try {
      const res = await pullFromGoogleSheets(config.gsheets);
      onRestoreRemoteData(res.invoices, res.orgProfile);
      const updated = {
        ...config,
        activeMode: 'gsheets',
        lastSyncedAt: new Date().toISOString(),
      };
      handlePersistConfig(updated);
      setStatusMsg({
        type: 'success',
        text: `Pulled ${res.invoices.length} invoices from Google Sheets.`,
      });
    } catch (err) {
      setStatusMsg({ type: 'error', text: err.message });
    } finally {
      setLoading(false);
    }
  };

  const handleCopyAppsScript = () => {
    navigator.clipboard.writeText(GOOGLE_APPS_SCRIPT_SNIPPET);
    setCopiedScript(true);
    setTimeout(() => setCopiedScript(false), 2500);
  };

  const handleExportJson = () => {
    const json = JSON.stringify(
      {
        exportedAt: new Date().toISOString(),
        orgProfile,
        invoices,
      },
      null,
      2
    );
    const blob = new Blob([json], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `esg-invoices-backup-${new Date()
      .toISOString()
      .slice(0, 10)}.json`;
    a.click();
    URL.revokeObjectURL(url);

            <p className="text-xs text-slate-300">

  useEffect(() => {
    saveBackendConfig(backendConfig);
  }, [backendConfig]);

  const showToast = (text, type = 'success') => {
    setToast({ text, type });
    setTimeout(() => setToast(null), 3500);
  };

  const triggerAutoSyncIfEnabled = async (nextInvoices, nextProfile) => {
    if (!backendConfig.autoSync) return;
    try {
      if (
        backendConfig.activeMode === 'github' &&
        backendConfig.github?.token
      ) {
        await pushToGitHub(backendConfig.github, {
          invoices: nextInvoices,
          orgProfile: nextProfile,
        });
        showToast('Auto-synced invoices to GitHub repository');
      } else if (
        backendConfig.activeMode === 'gsheets' &&
        backendConfig.gsheets?.webAppUrl
      ) {
        await pushToGoogleSheets(backendConfig.gsheets, {
          invoices: nextInvoices,
          orgProfile: nextProfile,
        });
        showToast('Auto-synced invoices to Google Sheets');
      }
    } catch (err) {
      showToast(`Cloud auto-sync failed: ${err.message}`, 'error');
    }
  };

  const handleSaveInvoice = (invoiceRecord) => {
    let nextInvoices;
    const exists = invoices.some((i) => i.id === invoiceRecord.id);
    if (exists) {
      nextInvoices = invoices.map((i) =>
        i.id === invoiceRecord.id ? invoiceRecord : i
      );
      showToast(`Updated invoice ${invoiceRecord.invoiceNumber}`);
    } else {
      nextInvoices = [invoiceRecord, ...invoices];
      showToast(`Added invoice ${invoiceRecord.invoiceNumber}`);
    }
    setInvoices(nextInvoices);
    setIsInvoiceModalOpen(false);
    setEditingInvoice(null);
    triggerAutoSyncIfEnabled(nextInvoices, orgProfile);
  };

  const handleDeleteInvoice = (id) => {
    const target = invoices.find((i) => i.id === id);
    const nextInvoices = invoices.filter((i) => i.id !== id);
    setInvoices(nextInvoices);
    showToast(`Deleted invoice ${target?.invoiceNumber || ''}`);
    triggerAutoSyncIfEnabled(nextInvoices, orgProfile);
  };

  const handleDuplicateInvoice = (inv) => {
    const copy = {
      ...inv,
      id: `inv-${Date.now()}`,
      invoiceNumber: `${inv.invoiceNumber}-COPY`,
    };
    setEditingInvoice(copy);
    setIsInvoiceModalOpen(true);
  };

  const handleBulkImport = (importedList) => {
    const nextInvoices = [...importedList, ...invoices];
    setInvoices(nextInvoices);
    showToast(`Imported ${importedList.length} utility invoices from CSV`);
    triggerAutoSyncIfEnabled(nextInvoices, orgProfile);
  };

  return (
    <div className="min-h-screen flex flex-col bg-slate-50 text-slate-900">
      {/* Top Navigation Header */}
      <header className="bg-slate-900 text-white border-b border-slate-800 sticky top-0 z-30 no-print">
        <div className="max-w-7xl mx-auto px-4 sm:px-6 py-3.5 flex flex-wrap items-center justify-between gap-4">
          {/* Brand Logo */}
          <div className="flex items-center gap-3">
            <div className="w-9 h-9 rounded-xl bg-emerald-500/20 border border-emerald-500/40 flex items-center justify-center text-emerald-400">
              <Leaf className="w-5 h-5" />
            </div>
            <div>
              <div className="flex items-center gap-2">
                <span className="font-bold text-base tracking-tight">
                  EcoLedger ESG
                </span>
                <span className="text-[11px] font-semibold uppercase px-2 py-0.5 rounded-full bg-emerald-500/20 text-emerald-300 border border-emerald-500/30">
                  UK Energy Tracker (£ GBP)
                </span>
              </div>
              <p className="text-xs text-slate-400">
                Business Utility Invoice & ESG Emissions Tracker
              </p>
            </div>
          </div>

          {/* Center Navigation Tabs */}
          <nav className="flex items-center gap-1 bg-slate-800/90 p-1 rounded-xl border border-slate-700">
            {[
              {
                id: 'dashboard',
                label: 'ESG Dashboard',
                icon: LayoutDashboard,
              },
              {
                id: 'invoices',
                label: `Utility Invoices (${invoices.length})`,
                icon: Receipt,
              },
            ].map((tab) => {
              const Icon = tab.icon;
              const active = activeTab === tab.id;
              return (
                <button
                  key={tab.id}
                  type="button"
                  onClick={() => setActiveTab(tab.id)}
                  className={`inline-flex items-center gap-2 px-3.5 py-1.5 rounded-lg text-xs font-semibold transition ${
                    active
                      ? 'bg-emerald-600 text-white shadow-xs'
                      : 'text-slate-300 hover:text-white hover:bg-slate-700/60'
                  }`}
                >
                  <Icon className="w-4 h-4" />
                  {tab.label}
                </button>
              );
            })}
          </nav>

          {/* Right Cloud Sync & Quick Add Actions */}
          <div className="flex items-center gap-2.5">
            <button
              type="button"
              onClick={() => setIsBackendModalOpen(true)}
              className="inline-flex items-center gap-2 px-3 py-2 rounded-lg text-xs font-semibold bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 transition"
              title="Configure GitHub API or Google Sheets Sync"
            >
              {backendConfig.activeMode === 'github' ? (
                <Github className="w-3.5 h-3.5 text-emerald-400" />
              ) : (
                <Cloud className="w-3.5 h-3.5 text-emerald-400" />
              )}
              <span>
                {backendConfig.activeMode === 'github'
                  ? 'GitHub Sync'
                  : backendConfig.activeMode === 'gsheets'
                  ? 'Sheets Sync'
                  : 'Cloud Backend'}
              </span>
            </button>

            <button
              type="button"
              onClick={() => {
                setEditingInvoice(null);
                setIsInvoiceModalOpen(true);
              }}
              className="inline-flex items-center gap-1.5 px-3.5 py-2 rounded-lg text-xs font-semibold bg-emerald-600 hover:bg-emerald-500 text-white shadow-xs transition"
            >
              <Plus className="w-4 h-4" />
              Log Utility Invoice
            </button>
          </div>
        </div>
      </header>

      {/* Toast Notification */}
      {toast && (
        <div className="fixed bottom-5 right-5 z-50 no-print">
          <div
            className={`px-4 py-3 rounded-xl shadow-lg border text-xs font-semibold flex items-center gap-2 ${
              toast.type === 'error'
                ? 'bg-red-900 text-white border-red-700'
                : 'bg-slate-900 text-emerald-300 border-slate-700'
            }`}
          >
            <span>{toast.text}</span>
          </div>
        </div>
      )}

      {/* Main Content Container */}
      <main className="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 py-6">
        {activeTab === 'dashboard' && (
          <DashboardView
            invoices={invoices}
            orgProfile={orgProfile}
            selectedSite={selectedSite}
            onSelectSite={setSelectedSite}
            selectedYear={selectedYear}
            onSelectYear={setSelectedYear}
            onOpenNewInvoice={() => {
              setEditingInvoice(null);
              setIsInvoiceModalOpen(true);
            }}
          />
        )}

        {activeTab === 'invoices' && (
          <InvoiceTable
            invoices={invoices}
            onAddInvoice={() => {
              setEditingInvoice(null);
              setIsInvoiceModalOpen(true);
            }}
            onEditInvoice={(inv) => {
              setEditingInvoice(inv);
              setIsInvoiceModalOpen(true);
            }}
            onDuplicateInvoice={handleDuplicateInvoice}
            onDeleteInvoice={handleDeleteInvoice}
            onBulkImport={handleBulkImport}
          />
        )}
      </main>

      {/* Footer */}
      <footer className="bg-white border-t border-slate-200 py-4 px-6 text-xs text-slate-500 no-print">
        <div className="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-3">
          <div>
            <strong>EcoLedger ESG</strong> · UK Business Utility & Emissions
            Tracker (Head Office London · Office Sheffield · Office Leeds ·
            Office Bristol)
          </div>
        </div>
      </footer>

      {/* Modals */}
      <InvoiceModal
        isOpen={isInvoiceModalOpen}
        onClose={() => {
          setIsInvoiceModalOpen(false);
          setEditingInvoice(null);
        }}
        onSave={handleSaveInvoice}
        editingInvoice={editingInvoice}
      />

      <BackendConfigModal
        isOpen={isBackendModalOpen}
        onClose={() => setIsBackendModalOpen(false)}
        backendConfig={backendConfig}
        onSaveConfig={setBackendConfig}
        invoices={invoices}
        orgProfile={orgProfile}
        onRestoreRemoteData={(remoteInvoices, remoteProfile) => {
          setInvoices(remoteInvoices);
          if (remoteProfile) {
            setOrgProfile((prev) => ({ ...prev, ...remoteProfile }));
          }
        }}
      />
    </div>
  );
}


ReactDOM.createRoot(document.getElementById('root')).render(<App />);

    </script>
  </body>
</html>
